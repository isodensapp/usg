rda}}, medindo {{*}} cm.","hd":["Achados sugestivos de nefrolitíase não obstrutiva à {{direita|esquerda}}."]},{"nome":"Múltiplos cálculos","texto":"Múltiplos cálculos renais com morfologia {{riziforme|esférica}}, o maior medindo até {{*}} cm, localizado no grupamento calicinal {{inferior|médio|superior}} à {{direita|esquerda}}.","hd":["Achados sugestivos de nefrolitíase não obstrutiva à {{direita|esquerda}}."]},{"nome":"Por grupamento","texto":"Múltiplos cálculos renais, assim dispostos:\n- grupamento superior, medindo {{*}} cm;\n- grupamento médio, medindo {{*}} cm;\n- grupamento inferior, medindo {{*}} cm.","hd":["Achados sugestivos de nefrolitíase não obstrutiva à {{direita|esquerda}}."]}]},{"id":"calculo-ureteral","nome":"Cálculo ureteral distal","substitui":[],"apos":"rins","variantes":[{"texto":"Caracteriza-se formação hiperecogênica, de morfologia {{riziforme|esférica}}, que produz sombra acústica posterior, localizada no segmento inferior do ureter distal {{direito|esquerdo}}, logo abaixo do cruzamento com os vasos ilíacos, medindo {{*}} cm, compatível com cálculo, sem determinar dilatação significativa do sistema coletor.","hd":["Achado sugestivo de ureterolitíase na topografia do segmento distal à {{direita|esquerda}}."]}]},{"id":"calculo-jup","nome":"Cálculo ureteral próximo à JUP","substitui":["rins.pielocalicial"],"apos":"rins","variantes":[{"texto":"Cálculo localizado no ureter proximal à {{direita|esquerda}}, distando {{*}} cm da junção ureteropiélica (JUP), medindo {{*}} cm, determinando {{leve|moderada}} dilatação do sistema coletor a montante.","hd":["Ureterolitíase determinando uretero-hidronefrose {{leve|moderada}} à {{direita|esquerda}}."]}]},{"id":"calculo-juv","nome":"Cálculo ureteral próximo à JUV","substitui":["rins.pielocalicial"],"apos":"rins","variantes":[{"texto":"Cálculo localizado no ureter distal, distando {{*}} cm da junção ureterovesical (JUV) à {{direita|esquerda}}, medindo {{*}} cm, determinando {{discreta|moderada}} dilatação do sistema coletor a montante.","hd":["Ureterolitíase determinando uretero-hidronefrose {{discreta|moderada}} à {{direita|esquerda}}."]}]},{"id":"cisto-renal","nome":"Cisto renal","frequente":true,"substitui":[],"apos":"rins","variantes":[{"nome":"Cisto único","texto":"Formação cística renal cortical, de paredes finas e regulares, conteúdo anecoide e homogêneo, medindo {{*}} cm, localizado no terço {{*}} à {{direita|esquerda}}.","hd":["Achados sugestivos de cisto(s) renal(is) à {{direita|esquerda|bilateral}}."]},{"nome":"Múltiplos cistos","texto":"Formações císticas renais, de paredes finas e regulares, conteúdo anecoide e homogêneo, predominantemente corticais, o maior medindo até {{*}} cm, localizado no terço {{*}} à {{direita|esquerda}}.","hd":["Achados sugestivos de cisto(s) renal(is) à {{direita|esquerda|bilateral}}."]},{"nome":"Por terço","texto":"Formações císticas renais à {{direita|esquerda|bilateral}}, de paredes finas e regulares, conteúdo anecoide homogêneo, assim dispostas:\n- Terço superior, cortical, medindo {{*}} cm;\n- Terço médio, cortical, medindo {{*}} cm;\n- Terço inferior, cortical, medindo {{*}} cm.","hd":["Achados sugestivos de cisto(s) renal(is) à {{direita|esquerda|bilateral}}."]}]},{"id":"cistos-policisticos","nome":"Múltiplos cistos (policístico)","substitui":[],"apos":"rins","variantes":[{"texto":"Múltiplas formações císticas, distribuídas por todo o parênquima renal à {{direita|esquerda}}, predominantemente corticais, de paredes finas e regulares, conteúdo anecoide e homogêneo, o maior medindo até {{*}} cm, localizado no terço {{superior|médio|inferior}}.","hd":["Múltiplos cistos renais bilaterais, achados sugestivos de doença renal policística do adulto."]}]},{"id":"duplicidade-pielocalicial","nome":"Duplicidade pielocalicial","substitui":[],"apos":"rins","variantes":[{"texto":"Sistema pielocalicial compacto à {{direita|esquerda}}, apresentando divisão do sistema coletor no nível do grupamento calicinal superior e dos médio/inferior, achados sugestivos de duplicidade pielocalicial (variante anatômica).","hd":[]}]},{"id":"duplo-j","nome":"Cateter duplo J","substitui":[],"apos":"rins","variantes":[{"texto":"Presença de cateter duplo J à {{direita|esquerda}}.","hd":[]}]},{"id":"estenose-jup","nome":"Estenose de JUP","substitui":["rins.pielocalicial"],"apos":"rins","variantes":[{"nome":"Simples","texto":"{{Moderada|Acentuada}} dilatação do sistema pielocalicial à {{direita|esquerda}}, sem determinar sinais de dilatação ureteral.","hd":["Hidronefrose {{moderada|acentuada}} à {{direita|esquerda}}, achados sugestivos de estenose de JUP."]},{"nome":"Com medidas","texto":"{{Moderada|Acentuada}} dilatação do sistema pielocalicial à {{direita|esquerda}}, com diâmetro da pelve no eixo anteroposterior no corte transversal, medindo {{*}} cm, associado a afilamento cortical difuso, medindo {{*}} cm de espessura, não sendo caracterizado fator obstrutivo ao método. Ureter de diâmetro preservado. O conjunto destes achados favorece a possibilidade de estenose de JUP.","hd":["Hidronefrose {{moderada|acentuada}} à {{direita|esquerda}}, achados sugestivos de estenose de JUP."]}]},{"id":"ferradura","nome":"Rim em ferradura","substitui":["rins.morfologia"],"apos":"rins","variantes":[{"texto":"Rins de contornos e ecotextura habituais com pelves renais anteriorizadas, apresentando-se fundidos em seus polos inferiores na topografia do mesogástrio, sugestivo de \"rins em ferradura\". Rim direito mede {{*}} cm, com espessura do parênquima medindo {{*}} cm. Rim esquerdo mede {{*}} cm, com espessura do parênquima medindo {{*}} cm. Região renal na topografia mediana mede aproximadamente {{*}} cm. Sistemas pielocaliciais compactos, sem aparentes cálculos.","hd":["Achados sugestivos de vício de rotação e rins em ferradura (variantes anatômicas)."]}]},{"id":"hidronefrose","nome":"Hidronefrose","frequente":true,"substitui":["rins.pielocalicial"],"apos":"rins","variantes":[{"nome":"Hidronefrose","texto":"Rim {{direito|esquerdo}} com dimensões aumentadas, apresentando acentuada dilatação do sistema pielocalicial.","hd":["{{Hidronefrose|Uretero-hidronefrose}} à {{direita|esquerda}}."]},{"nome":"Uretero-hidronefrose","texto":"Rim {{direito|esquerdo}} com dimensões aumentadas, apresentando acentuada dilatação do sistema pielocalicial e do ureter, medindo até {{*}} cm nas janelas acessíveis.","hd":["{{Hidronefrose|Uretero-hidronefrose}} à {{direita|esquerda}}."]}]},{"id":"hidronefrose-gestacional","nome":"Hidronefrose gestacional","substitui":["rins.pielocalicial"],"apos":"rins","variantes":[{"texto":"Caracteriza-se discreta hidronefrose bilateral própria para a idade gestacional.","hd":["Achados sugestivos de discreta hidronefrose bilateral relacionada à gestação."]}]},{"id":"massa-pelvica","nome":"Massa pélvica com uretero-hidronefrose","substitui":["rins.pielocalicial"],"apos":"bexiga","variantes":[{"texto":"Massa sólida na escavação pélvica, localizada superiormente à bexiga, de contornos lobulados, heterogênea, com focos de calcificação e fluxo periférico ao estudo complementar com Doppler, medindo {{*:a}} x {{*:b}} x {{*:c}} cm e volume estimado de {{=elipsoide(a,b,c)}} cm³. Esta exerce compressão extrínseca nos ureteres distais promovendo {{discreta|moderada}} dilatação dos sistemas coletores a montante.","hd":["Achados sugestivos de massa pélvica que determina uretero-hidronefrose {{discreta|moderada}} bilateral, sendo conveniente prosseguir investigação diagnóstica."]}]},{"id":"nefrectomia","nome":"Nefrectomia total ou parcial","substitui":[],"apos":"rins","variantes":[{"nome":"Total","texto":"Rim {{direito|esquerdo}} não caracterizado (status pós-operatório).","hd":["Nefrectomia {{parcial|total}} à {{direita|esquerda}}."]},{"nome":"Parcial","texto":"Rim {{direito|esquerdo}} em topografia e ecotextura habitual, com dimensões reduzidas (status pós-operatório).","hd":["Nefrectomia {{parcial|total}} à {{direita|esquerda}}."]}]},{"id":"nefrectomia-vicariante","nome":"Nefrectomia e rim vicariante","substitui":[],"apos":"rins","variantes":[{"texto":"Rim {{direito|esquerdo}} vicariante com forma, contornos e ecotextura habitual.\nRim mede {{*}} x {{*}} x {{*}} cm, com espessura do parênquima de {{*}} cm.\nRim contralateral não caracterizado (status pós-operatório).","hd":["Nefrectomia à {{direita|esquerda}}, apresentando sinais de rim contralateral vicariante."]}]},{"id":"nefrocalcinose","nome":"Nefrocalcinose","substitui":[],"apos":"rins","variantes":[{"texto":"Hiperecogenicidade difusa, provida de sombra acústica posterior, localizada na zona medular renal à {{direita|esquerda}}.","hd":["Achados sugestivos de nefrocalcinose medular {{direita|esquerda}}."]}]},{"id":"nefropatia-aguda","nome":"Nefropatia aguda","substitui":[],"apos":"rins","variantes":[{"texto":"Rim {{esquerdo|direito}} com perda da relação corticomedular, parênquima apresentando hiperrefringência difusa e redução da ecogenicidade das pirâmides.","hd":["Achados sugestivos de nefropatia parenquimatosa aguda."]}]},{"id":"nefropatia-aguda-2","nome":"Nefropatia aguda (descritiva)","substitui":[],"apos":"rins","variantes":[{"texto":"Morfologia, contornos e topografia habituais.\nDimensões discretamente aumentadas em relação ao lado contralateral, medindo no eixo longitudinal: {{*}} cm, associado a aumento da espessura do parênquima, que mede: {{*}} cm.\nParênquima com hipoecogenicidade difusa, determinando {{discreta|moderada|acentuada}} perda da diferenciação corticomedular.\nSistema pielocalicial compacto.\nNão visibilizado imagens compatíveis com cálculos no sistema pielocalicial.","hd":["Achados sugestivos de nefropatia parenquimatosa aguda {{direita|esquerda|bilateral}}."]}]},{"id":"nefropatia-cronica","nome":"Nefropatia crônica","substitui":["rins.morfologia"],"apos":"rins","variantes":[{"texto":"Rins de morfologia e topografia habituais, com dimensões reduzidas, contornos lobulados e perda das relações corticomedulares à custa de aumento difuso de sua ecogenicidade parenquimatosa.\nRim direito mede {{*}} x {{*}} x {{*}} cm, com redução da espessura do parênquima, medindo {{*}} cm.\nRim esquerdo mede {{*}} x {{*}} x {{*}} cm, com redução da espessura do parênquima, medindo {{*}} cm.","hd":["Achados sugestivos de nefropatia parenquimatosa crônica {{direita|esquerda|bilateral}}."]}]},{"id":"nefropatia-cronica-2","nome":"Nefropatia crônica (descritiva)","substitui":[],"apos":"rins","variantes":[{"texto":"Morfologia e topografia habituais, apresentando contornos lobulados e irregulares.\nDimensões reduzidas, medindo no eixo longitudinal: {{*}} cm, associado a redução da espessura do parênquima, que mede: {{*}} cm.\nParênquima com {{discreta|moderada|acentuada}} perda da diferenciação corticomedular.\nSistema pielocalicial compacto.\nNão visibilizado imagens compatíveis com cálculos no sistema pielocalicial.","hd":["Achados sugestivos de nefropatia parenquimatosa crônica {{direita|esquerda|bilateral}}."]}]},{"id":"nefropatia-cronica-pielonefrite","nome":"Nefropatia crônica e sequela de pielonefrite","substitui":["rins.morfologia"],"apos":"rins","variantes":[{"texto":"Rins tópicos, de contornos irregulares e ecotextura heterogênea, com áreas de retrações, redução da espessura cortical e perda das relações corticomedulares. Apresenta redução da ecotextura e de suas dimensões, sugerindo doença renal parenquimatosa crônica. Associa-se áreas lobuladas com fibrose de permeio sugerindo sequela de episódios prévios de pielonefrite.\nRim direito mede {{*}} x {{*}} x {{*}} cm, com redução da espessura do parênquima, medindo {{*}} cm.\nRim esquerdo mede {{*}} x {{*}} x {{*}} cm, com redução da espessura do parênquima, medindo {{*}} cm.","hd":["Achados sugestivos de doença renal parenquimatosa crônica (DRPC), associado a sequela de episódios prévios de pielonefrite."]}]},{"id":"atrofia-renal","nome":"Atrofia renal","substitui":["rins.morfologia"],"apos":"rins","variantes":[{"texto":"Rins tópicos, de contornos irregulares, margens mal definidas, ecotextura heterogênea, de dimensões reduzidas, afilamento e hiperecogenicidade cortical, assumindo aspecto atrófico.","hd":["Achados sugestivos de comprometimento renal bilateral por patologia parenquimatosa crônica em estágio avançado com atrofia renal bilateral."]}]},{"id":"pielonefrite","nome":"Pielonefrite","substitui":[],"apos":"rins","variantes":[{"texto":"Rim {{direito|esquerdo}} com relação corticomedular preservada e parênquima apresentando leve hiperrefringência difusa, associado à hipoecogenicidade {{focal|segmentar}} cortical, localizada no terço {{superior|médio|inferior}}, e discreta redução do fluxo sanguíneo ao estudo complementar com Doppler. Sistema pielocalicial compacto.","hd":["Achados sugestivos de nefropatia parenquimatosa aguda (pielonefrite) à {{direita|esquerda}}, caso haja um contexto clínico e laboratorial compatível."]}]},{"id":"pelve-extrarrenal","nome":"Pelve extrarrenal","substitui":[],"apos":"rins","variantes":[{"texto":"Pelve extrarrenal à {{direita|esquerda}} (variante anatômica).","hd":["Pelve extrarrenal à {{direita|esquerda}}."]}]},{"id":"refluxo-vesicoureteral","nome":"Refluxo vesicoureteral","substitui":["rins.pielocalicial"],"apos":"rins","variantes":[{"texto":"Moderada dilatação dos sistemas pielocaliciais e de toda a extensão dos ureteres, medindo até {{*}} cm de calibre à direita e {{*}} cm à esquerda sem evidência de fatores obstrutivos/compressivos. Junções uretero-vesicais patentes durante toda a realização do exame.","hd":["Uretero-hidronefrose {{leve|moderada|acentuada}} bilateral, achados sugestivos de refluxo vesicoureteral."]}]},{"id":"retracao-cortical","nome":"Retração cortical","substitui":["rins.morfologia"],"apos":"rins","variantes":[{"texto":"Rins tópicos, de dimensões normais e ecotextura preservadas. Relação corticomedular mantida à {{direita|esquerda}}, observando-se retração cortical focal no terço superior do rim esquerdo.","hd":["Achados de retração cortical no rim {{direito|esquerdo}}, sugestivo de processo sequelar."]}]},{"id":"rim-pelvico","nome":"Rim pélvico","substitui":[],"apos":"rins","variantes":[{"texto":"Rim {{direito|esquerdo}} em topografia ectópica, localizado na fossa ilíaca {{direita|esquerda}}, de morfologia, contornos e ecotextura habituais, com dimensões levemente reduzidas, medindo {{*}} x {{*}} x {{*}} cm, e espessura parenquimatosa de {{*}} cm. Sistema pielocalicial compacto sem evidência de cálculos.","hd":["Achados sugestivos de rim {{direito|esquerdo}} pélvico."]}]},{"id":"rim-policistico","nome":"Rim policístico","substitui":[],"apos":"rins","variantes":[{"texto":"Rim {{direito|esquerdo}} tópico, com contornos lobulados e presença de múltiplas formações císticas anecoicas e homogêneas.\nRim mede {{*}} x {{*}} x {{*}} cm, com redução da espessura do parênquima, medindo {{*}} cm.","hd":["Achados sugestivos de rim policístico à {{direita|esquerda}}."]}]},{"id":"rins-policisticos","nome":"Rins policísticos","substitui":["rins.morfologia"],"apos":"rins","variantes":[{"texto":"Rins tópicos, com forma, contornos e ecotextura habitual, caracterizando-se presença de múltiplos cistos esparsos, sendo os maiores no rim {{direito|esquerdo}}, localizado no terço superior, medindo {{*}} cm.\nRim direito mede {{*}} x {{*}} x {{*}} cm, com redução da espessura do parênquima, medindo {{*}} cm.\nRim esquerdo mede {{*}} x {{*}} x {{*}} cm, com redução da espessura do parênquima, medindo {{*}} cm.","hd":["Achados ultrassonográficos sugestivos de rins policísticos."]}]},{"id":"wilms-neuroblastoma","nome":"Tumor de Wilms ou neuroblastoma","substitui":[],"apos":"rins","variantes":[{"texto":"Volumosa massa sólida, de limites imprecisos com o terço superior renal à direita, com aparente plano de clivagem com o fígado, rechaçando-o superiormente e não ultrapassando a linha mediana. Apresenta contornos lobulados e aspecto heterogêneo, predominantemente hipoecogênico (componente sólido >95% da massa), com áreas císticas anecoides, sugerindo degeneração cístico-necrótica, sem calcificações evidentes, apresentando fluxo central e periférico ao estudo complementar com Doppler, medindo {{*}} cm e volume estimado de {{*}} cm³.","hd":["Volumosa massa sólida na loja renal {{direita|esquerda}}. Dentre os diferenciais, achados sugestivos de nefroblastoma ou neuroblastoma, sendo conveniente prosseguir investigação diagnóstica com estudo tomográfico."]}]},{"id":"urinoma","nome":"Urinoma","substitui":[],"apos":"rins","variantes":[{"texto":"Coleção líquida anecogênica, localizada adjacente à superfície posterossuperior do rim {{direito|esquerdo}}, limitada pela fáscia de Gerota, medindo {{*}} cm e volume estimado de {{*}} mL, sem fluxo ao estudo complementar com Doppler, associado a alterações da ecogenicidade dos planos gordurosos perirrenais.","hd":["Achados sugestivos de urinoma."]}]},{"id":"valvula-uretra-posterior","nome":"Válvula de uretra posterior","substitui":["rins.pielocalicial"],"apos":"rins","variantes":[{"texto":"Moderada dilatação dos sistemas pielocaliciais e de toda a extensão dos ureteres bilaterais, medindo até {{*}} cm de calibre à direita e {{*}} cm à esquerda.","hd":["Achados sugestivos de uretero-hidronefrose {{leve|moderada|acentuada}} bilateral, que dentre os diferenciais, há possibilidade de válvula de uretra posterior."]}]}]},{"id":"bexiga","nome":"Bexiga","mascaras":["abdome-total"],"achados":[{"id":"cistite","nome":"Cistite","substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga de morfologia habitual, apresentando paredes regulares e difusamente espessadas, medindo {{*}} cm (VR \u003c0,5 cm). O conteúdo vesical é heterogêneo, à custa de focos ecogênicos / ecos em suspensão (debris). Esse achado não é específico, mas pode estar relacionado a processo inflamatório/infeccioso, na dependência de dados clínicos e laboratoriais.","hd":["Espessamento parietal vesical difuso, que apesar de não ser um achado específico, pode corresponder a processo inflamatório/infeccioso (cistite), caso haja um contexto clínico e laboratorial compatível."]}]},{"id":"cistite-nivel","nome":"Cistite com nível líquido","substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga urinária de forma e capacidade conservadas, com presença de conteúdo hipoecogênico no seu interior, móvel à mudança de decúbito, formando nível líquido-líquido, sem fluxo ao estudo complementar com Doppler, associado a focos ecogênicos/ecos em suspensão (debris), que podem corresponder a material sedimentado (etiologia infecciosa?).","hd":["Bexiga urinária com conteúdo formando nível líquido-líquido, que apesar de não ser um achado específico, pode corresponder a processo inflamatório/infeccioso (cistite), caso haja um contexto clínico e laboratorial compatível."]}]},{"id":"bexiga-esforco","nome":"Bexiga de esforço","substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga urinária normodistendida, com conteúdo anecoide e parede irregular com espessura difusamente aumentada, medindo até {{*}} cm (VR \u003c0,5 cm). Observa-se ainda formações compatíveis com pseudodivertículos vesicais, medindo até {{*}} cm na parede anterossuperior.","hd":["Espessamento parietal vesical difuso, associado a pseudodivertículos, achados sugestivos de bexiga de esforço."]}]},{"id":"diverticulo","nome":"Divertículo vesical","substitui":[],"apos":"bexiga","variantes":[{"texto":"Bexiga urinária de capacidade conservada, apresentando formações diverticulares na sua parede {{lateral|posterior}} à direita, medindo cerca de {{*}} cm.","hd":["Formações diverticulares vesicais na parede {{lateral|posterior}} à direita."]}]},{"id":"litiase-vesical","nome":"Litíase vesical","substitui":[],"apos":"bexiga","variantes":[{"texto":"Caracteriza-se no interior da bexiga formação arredondada, de limites precisos, contornos regulares, hiperecogênica, com sombra acústica posterior, móvel com a mudança de decúbito, medindo {{*}} cm, sugestiva de cálculo.","hd":["Sinais de litíase vesical."]}]},{"id":"coagulo-movel","nome":"Coágulo vesical móvel","substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga urinária de forma e capacidade conservadas, com presença de conteúdo hipoecogênico e amorfo no seu interior, móvel à mudança de decúbito, sem fluxo ao estudo complementar com Doppler, que pode corresponder a coágulos sanguíneos ou a sedimento de outra natureza.","hd":["Achados sugestivos de coágulo vesical e/ou sedimento de outra natureza."]}]},{"id":"coagulo-aderido","nome":"Coágulo vesical aderido","substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga de paredes levemente espessadas, apresentando material amorfo e heterogêneo, aderido à sua parede lateral esquerda, imóvel à mudança de decúbito, sem fluxo ao estudo complementar com Doppler, sugestivo de coágulo aderido, na dependência de dados clínicos e laboratoriais. A critério correlacionar com cistoscopia.","hd":["Achados sugestivos de coágulo vesical aderido à parede vesical."]}]},{"id":"coagulo-diverticulo","nome":"Coágulo e divertículo","substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Identifica-se material ecogênico heterogêneo e amorfo no interior da bexiga urinária, móvel à mudança de decúbito, sem fluxo ao estudo complementar com Doppler, que pode estar relacionada a coágulos sanguíneos/sedimentos. Destaca-se ainda divertículo localizado em sua parede lateral inferior direita, medindo {{*}} cm, também com conteúdo ecogênico em seu interior.","hd":["Achados sugestivos de coágulos e divertículo vesicais."]}]},{"id":"sonda-foley","nome":"Sonda vesical (Foley)","substitui":[],"apos":"bexiga","variantes":[{"texto":"Balão de sonda vesical do tipo Foley normoposicionado.","hd":[]}]},{"id":"residuo-aumentado","nome":"Resíduo pós-miccional aumentado","frequente":true,"substitui":[],"apos":"bexiga","variantes":[{"texto":"Volume vesical pré-miccional {{*}} mL.\nVolume vesical pós-miccional {{pequeno|moderado|acentuado}}: {{*}} mL.","hd":["Resíduo vesical {{pequeno|moderado|acentuado}}."]}]},{"id":"globo-vesical","nome":"Globo vesical","substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga com contornos regulares, paredes finas e lisas, apresentando acentuada repleção (globo vesical), caracterizando volume estimado em cerca de {{*}} cm³.","hd":["Achados sugestivos de bexigoma."]}]},{"id":"hematoma-vesical","nome":"Hematoma vesical","substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga urinária normodistendida, com conteúdo anecoide e parede de espessura habitual. No assoalho vesical caracteriza-se formação hipoecogênica e irregular, sem fluxo ao Doppler, móvel às mudanças de decúbito, medindo {{*}} cm e volume estimado de {{*}} cm³.","hd":["Formação irregular no lúmen vesical, sugerindo hematoma."]}]},{"id":"massa-vesical","nome":"Massa ou pólipo vesical","substitui":[],"apos":"bexiga","variantes":[{"texto":"Na parede vesical anterossuperior, caracteriza-se formação nodular sólida, {{hipo|hiper}}ecogênica, de contornos arredondados, com fluxo ao estudo complementar com Doppler, imóvel às mudanças de decúbito, medindo {{*:ap}} x {{*:ll}} x {{*:cc}} cm (AP x LL x CC) e volume de {{=elipsoide(ap,ll,cc)}} cm³.","hd":["Achados sugestivos de massa/pólipo vesical, sendo conveniente prosseguir investigação diagnóstica."]}]},{"id":"pos-operatorio","nome":"Pós-operatório","substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"O estudo ultrassonográfico da pelve mostrou a bexiga urinária de repleção adequada, conteúdo anecoico, apresentando espessamento parietal mal definido em seu aspecto posterior. Ao estudo complementar com Doppler caracteriza-se discreta vascularização.","hd":["Espessamento mal definido no aspecto posterior da bexiga urinária, de caráter inespecífico pelo método, que pode estar relacionado à cirurgia prévia."]}]},{"id":"pos-operatorio-refluxo","nome":"Pós-operatório de refluxo","substitui":[],"apos":"bexiga","variantes":[{"texto":"Caracteriza-se discreto espessamento do urotélio na projeção do meato ureteral distal direito, que não apresenta vasculariz o-de-saco"],"apos":"ovario-e","variantes":[{"nome":"Pequena quantidade","texto":"Pequena quantidade de fluido, de aspecto anecoico e homogêneo, no fundo de saco de Douglas.","hd":["Pequena quantidade de líquido livre {{homogêneo|heterogêneo}} em fundo de saco de Douglas."]},{"nome":"Moderada, hemorrágico","texto":"Moderada quantidade de líquido livre, de aspecto heterogêneo, em recessos peritoneais inferiores e nas fossas ilíacas, possivelmente de natureza hemorrágica.","hd":["Pequena quantidade de líquido livre {{homogêneo|heterogêneo}} em fundo de saco de Douglas."]},{"nome":"Moderada, septado","texto":"Moderada quantidade de líquido em região pélvica com finos septos de permeio, de aparência compartimentalizada, estáveis em relação ao exame anterior.","hd":["Pequena quantidade de líquido livre {{homogêneo|heterogêneo}} em fundo de saco de Douglas."]}]},{"id":"massa-ovariana","nome":"Massa ovariana","substitui":[],"apos":"ovario-e","porEscolha":{"direita":{"substitui":[],"apos":"ovario-d"},"esquerda":{"substitui":[],"apos":"ovario-e"}},"variantes":[{"texto":"Nota-se volumosa massa sólida, na região anexial {{direita|esquerda}}, de contornos lobulados, com conteúdo heterogêneo, predominantemente hiperecogênico, sem calcificações evidentes, medindo cerca de {{*}} mm (volume estimado: {{*}} cm³). Ao estudo Doppler evidenciou-se vasos periféricos e centrais, com diástole positiva e sem incisura, IR= {{*}} e IP= {{*}}.","hd":["Massa pélvica de provável natureza ovariana, conveniente prosseguir propedêutica diagnóstica."]}]},{"id":"mioma","nome":"Mioma","frequente":true,"substitui":["miometrio"],"apos":"utero","variantes":[{"texto":"Miométrio com ecotextura homogênea, exceto por formação nodular sólida, de contornos bem definidos e regulares, conteúdo {{hipoecogênico|heterogêneo}}, na parede anterior/intramural, medindo {{*}} mm.","hd":["Nódulo uterino sugestivo de leiomioma ou suas variantes histológicas."]}]},{"id":"miomas","nome":"Miomas","frequente":true,"substitui":["miometrio"],"apos":"utero","variantes":[{"texto":"Miométrio com ecotextura {{homogênea|heterogênea}} apresentando formações nodulares sólidas, {{hipoecogênicas|heterogêneas}}, de contornos regulares, nas paredes:\n- anterior/intramural, medindo {{*}} mm;\n- posterior/subseroso, medindo {{*}} mm;\n- fúndica, com componentes submucoso/subseroso, medindo {{*}} mm.","hd":["Nódulos uterinos sugestivos de leiomiomas ou suas variantes histológicas."]}]},{"id":"ovarios-fixos-medianizados","nome":"Ovários fixos e medianizados","substitui":[],"apos":"ovario-e","variantes":[{"texto":"Os ovários apresentam mobilidade reduzida em topografia medianizada (Kissing ovaries - “Beijo dos ovários\").","hd":["Ovários medianizados e fixos."]}]},{"id":"ooforectomia","nome":"Ooforectomia","substitui":[],"apos":"ovario-e","porEscolha":{"direito":{"substitui":["ovario-d.morfologia","ovario-d.parenquima","ovario-d.medidas"],"apos":"ovario-d"},"esquerdo":{"substitui":["ovario-e.morfologia","ovario-e.parenquima","ovario-e.medidas"],"apos":"ovario-e"}},"variantes":[{"texto":"Ovário {{direito|esquerdo}} não identificado (“status” pós-ooforectomia, conforme dados clínicos), não se observando lesões expansivas na topografia anexial {{direito|esquerdo}}.","hd":["Sinais de ooforectomia à {{direita|esquerda}}."]}]},{"id":"ovarios-policisticos","nome":"Ovários policísticos","frequente":true,"substitui":["ovario-d.morfologia","ovario-d.parenquima","ovario-d.medidas","ovario-e.morfologia","ovario-e.parenquima","ovario-e.medidas"],"apos":"ovario-e","variantes":[{"texto":"Ovários na topografia habitual, ecotextura preservada e com dimensões aumentadas (VR \u003c10cm³), apresentando múltiplas formações císticas, menores que 9 mm, de localização predominantemente periférica, com aumento do estroma central, assumindo aspecto policístico.\nMedidas ovarianas: {{*:a1}} x {{*:b1}} x {{*:c1}} mm, volume {{=elipsoide(a1,b1,c1)/1000}} cm³ à direita e {{*:a2}} x {{*:b2}} x {{*:c2}} mm, volume {{=elipsoide(a2,b2,c2)/1000}} cm³ à esquerda.","hd":["Achados ultrassonográficos sugestivos de ovários policísticos. Conveniente correlacionar dados clínicos e laboratoriais."]}]},{"id":"piossalpinge","nome":"Piossalpinge / salpingite","substitui":[],"apos":"ovario-e","variantes":[{"texto":"Presença de formação cística, de morfologia alongada e serpiginosa, com conteúdo ecogênico e finos ecos em suspensão (debris), de paredes lisas e regulares, com fluxo aumentado ao estudo complementar com Doppler, localizada na topografia anexial à direita, adjacente ao ovário ipsilateral, podendo corresponder a piossalpinge, na vigência de estreita correlação clínica/laboratorial.","hd":["Achados ultrassonográficos sugestivos de piossalpinge, na vigência de estreita correlação clínica/laboratorial."]}]},{"id":"polipo-endometrial","nome":"Pólipo endometrial","substitui":["cavidade"],"apos":"endometrio","variantes":[{"texto":"Cavidade uterina apresentando formação nodular hiperecogênica, de aspecto polipoide, em continuidade com a camada basal do endométrio na região fúndica, medindo {{*}} mm.","hd":["Achados ultrassonográficos sugestivos de pólipo endometrial."]}]},{"id":"polipo-ou-mioma-submucoso","nome":"Pólipo endometrial / mioma submucoso","substitui":["cavidade","endometrio","endometrio.espessura"],"apos":"endometrio","variantes":[{"texto":"Endométrio centrado, com espessura de {{*}} mm e ecotextura heterogênea, destacando-se no interior da sua cavidade, formação nodular e ovalada, hiperecogênica, circunscrita, com pedículo vascular transpondo a camada basal ao estudo complementar com Doppler, medindo {{*}} x {{*}} mm, localizado na parede {{*}} ao nível da transição corpo/colo, podendo corresponder a pólipo endometrial ou mioma submucoso. A critério clínico, sugiro complementar estudo com histeroscopia.","hd":["Achados ultrassonográficos sugestivos de pólipo endometrial ou mioma submucoso. A critério clínico, sugiro complementar estudo com histeroscopia."]}]},{"id":"sinequias","nome":"Sinéquias","substitui":["endometrio","endometrio.espessura"],"apos":"endometrio","variantes":[{"texto":"Endométrio medindo {{*}} mm e com ecotextura heterogênea, apresentando em região fúndica formações hiperecogênicas sugestivas de sinéquias calcificadas.","hd":["Achados ultrassonográficos sugestivos de sinéquias calcificadas."]}]},{"id":"teratoma","nome":"Teratoma maduro / tumor germinativo","substitui":[],"apos":"ovario-e","porEscolha":{"direita":{"substitui":[],"apos":"ovario-d"},"esquerda":{"substitui":[],"apos":"ovario-e"}},"variantes":[{"texto":"Formação nodular heterogênea, caracterizada por áreas císticas com focos ecogênicos em suspensão (debris), pequenos focos com sombra acústica posterior sugerindo calcificações, bem como áreas hiperecogênicas de permeio que inferem conteúdo gorduroso, de contornos lobulados e definidos, sem vascularização significativa ao estudo complementar com Doppler, localizada na região anexial à {{direita|esquerda}}, medindo aproximadamente {{*:a}} x {{*:b}} x {{*:c}} mm, e volume estimado em {{=elipsoide(a,b,c)/1000}} cm³. O conjunto destes achados sugere lesão de linhagem germinativa (teratoma). A critério clínico um estudo de RM de pelve poderá fornecer informações adicionais.","hd":["Achados ultrassonográficos sugestivos de lesão de linhagem germinativa (teratoma), localizada na região anexial à {{direita|esquerda}}. A critério clínico um estudo de RM de pelve poderá fornecer informações adicionais."]}]},{"id":"varizes-pelvicas","nome":"Varizes pélvicas","substitui":[],"apos":"ovario-e","variantes":[{"nome":"Parauterinas","texto":"Caracteriza-se nas regiões parauterinas, presença de múltiplas formações anecoides, tubulares, tortuosas, de limites precisos e contornos regulares, com diâmetro médio de {{*}} mm, apresentando fluxo ao estudo complementar com Doppler.","hd":["Achados ultrassonográficos sugestivos de varizes pélvicas bilaterais."]},{"nome":"Vasos bilaterais","texto":"Caracteriza-se dilatação e tortuosidade de vasos pélvicos bilaterais, com calibre de até {{*}} mm à direita e {{*}} mm à esquerda.","hd":["Achados ultrassonográficos sugestivos de varizes pélvicas bilaterais."]}]},{"id":"varizes-pelvicas-trombose","nome":"Varizes pélvicas – trombose","substitui":[],"apos":"ovario-e","porEscolha":{"direita":{"substitui":[],"apos":"ovario-d"},"esquerda":{"substitui":[],"apos":"ovario-e"}},"variantes":[{"texto":"Caracteriza-se dilatação e tortuosidade de vasos pélvicos bilaterais, com calibre de até {{*}} mm à direita e {{*}} mm à esquerda, mais evidentes junto aos ovários, sendo que à {{direita|esquerda}}, identifica-se segmento venoso com focos preenchidos por conteúdo ecogênico, sem evidência de fluxo ao estudo complementar com Doppler, mesmo durante as manobras de Valsalva, sugestivo de trombose de varizes pélvicas.","hd":["Achados ultrassonográficos sugestivos de trombose de varizes pélvicas."]}]},{"id":"utero-septado","nome":"Útero septado","substitui":[],"apos":"endometrio","variantes":[{"texto":"Nota-se na cavidade uterina aparente formação septada, hipoecogênica na região fúndica, medindo {{*}} mm longitudinal x {{*}} mm de espessura.","hd":["Aparente septo na região fúndica da cavidade uterina, sugestivo de útero septado."]}]},{"id":"utero-bicorno","nome":"Útero bicorno","substitui":["utero.posicao","utero.dimensoes","utero.volume","cavidade","endometrio","endometrio.espessura","colo"],"apos":"utero","variantes":[{"texto":"Útero em anteversoflexão apresentando duas regiões cornuais, medindo à direita {{*}} mm (L x AP x T) e à esquerda {{*}} mm (L x AP x T). Volume uterino de {{*}} cm³.\nCavidades uterinas virtuais.\nEndométrio homogêneo, centrado e medindo {{*}} mm de espessura à direita e {{*}} mm à esquerda.\nColo uterino aparentemente único, medindo {{*}} mm no eixo longitudinal.","hd":["Sinais sugestivos de útero bicorno."]}]},{"id":"utero-didelfo","nome":"Útero didelfo","substitui":["utero.posicao","utero.dimensoes","utero.volume","cavidade","endometrio","endometrio.espessura","colo"],"apos":"utero","variantes":[{"texto":"Útero em anteversoflexão apresentando duas regiões cornuais, medindo à direita {{*}} mm (L x AP x T) e à esquerda {{*}} mm (L x AP x T). Volume uterino de {{*}} cm³.\nCavidades uterinas virtuais.\nEndométrio homogêneo, centrado e medindo {{*}} mm de espessura à direita e {{*}} mm à esquerda.\nColo uterino duplo medindo nos eixos longitudinais, {{*}} mm à direita e {{*}} mm à esquerda.","hd":["Sinais sugestivos de útero didelfo."]}]}]},{"id":"obstetricia","nome":"Obstetrícia","achados":[{"id":"abortamento-em-curso","nome":"Abortamento em curso","substitui":["cavidade","endometrio","endometrio.espessura"],"apos":"endometrio","variantes":[{"texto":"Saco gestacional na cavidade uterina, deslocado, em topografia ístmica, de contornos irregulares, medindo {{*}} mm (diâmetro médio {{*}} mm).\nNota-se formação laminar, hipoecogênica, de contornos irregulares, sem fluxo ao estudo Doppler, adjacente à parede inferior do saco gestacional, ocupando cerca de {{*}} % do mesmo, sugerindo hematoma retrocoriônico.\nFormação ecogênica no interior do saco gestacional, medindo {{*}} mm no maior eixo, sugerindo eco embrionário.\nMovimentos embrionários e batimentos cardíacos ausentes.\nVesícula vitelina não caracterizada.","hd":["Sinais ultrassonográficos de abortamento em curso."]}]},{"id":"doenca-trofoblastica","nome":"Doença trofoblástica gestacional","substitui":["cavidade","endometrio","endometrio.espessura"],"apos":"endometrio","variantes":[{"texto":"Cavidade uterina preenchida por material heterogêneo, predominantemente ecogênico com diminutas áreas císticas de permeio, de aspecto vesicular, sem sinais de componentes ósseos, medindo {{*}} mm e volume estimado de {{*}} cm³. Planos de clivagem aparentemente bem definidos entre a cavidade endometrial e a parede anterior do miométrio. Parede posterior do miométrio de difícil avaliação ecográfica devido à atenuação dos feixes sonoros posteriores.","hd":["Material heterogêneo na cavidade uterina, podendo corresponder à doença trofoblástica gestacional.","Nota: Os achados dependem da adequada correlação clínico-laboratorial."]}]},{"id":"ectopica-massa","nome":"Ectópica – massa","substitui":["fundo-de-saco"],"apos":"ovario-e","porEscolha":{"direita":{"substitui":["fundo-de-saco"],"apos":"ovario-d"},"esquerda":{"substitui":["fundo-de-saco"],"apos":"ovario-e"}},"variantes":[{"texto":"Formação cístico-sólida, na região anexial {{direita|esquerda}}, de contornos lobulados, com septos espessos e moderados debris de permeio, sem fluxo ao estudo complementar com Doppler, medindo {{*:a}} x {{*:b}} x {{*:c}} mm e volume estimado de {{=elipsoide(a,b,c)/1000}} cm³.\nModerada quantidade de líquido livre de aspecto anecoide, com moderados debris e traves de permeio, se estendendo do fundo de saco posterior até espaços hepato e espleno-renais.","hd":["Moderada quantidade de líquido intraperitoneal, sugerindo sangue/coágulos.","Formação heterogênea na região anexial à {{direita|esquerda}}. Considerar possibilidade de gestação ectópica rota.","Nota: Os achados dependem da adequada correlação clínico-laboratorial."]}]},{"id":"ectopica-rota-ou-cisto-hemorragico","nome":"Ectópica rota ou cisto hemorrágico","substitui":["fundo-de-saco"],"apos":"ovario-e","porEscolha":{"direita":{"substitui":["fundo-de-saco"],"apos":"ovario-d"},"esquerda":{"substitui":["fundo-de-saco"],"apos":"ovario-e"}},"variantes":[{"texto":"Formação cístico-sólida, na região anexial {{direita|esquerda}}, adjacente ao ovário, impossibilitando a precisa distinção pelo método ecográfico, de contornos irregulares com septos espessos e moderados debris de permeio, sem fluxo ao estudo Doppler, medindo {{*:a}} x {{*:b}} x {{*:c}} mm, e volume estimado de {{=elipsoide(a,b,c)/1000}} cm³. Moderada quantidade de líquido livre de aspecto anecoide, com moderados debris e septações finas de permeio, se estendendo do fundo de saco posterior até espaços hepato e espleno-renais.","hd":["Moderada quantidade de líquido intraperitoneal, sugerindo sangue/coágulos.","Formação heterogênea anexial à {{direita|esquerda}}. Considerar possibilidade de gestação ectópica rota ou cisto hemorrágico roto.","Nota: Os achados dependem da adequada correlação clínico-laboratorial."]}]},{"id":"ectopica-anel-tubario","nome":"Ectópica – anel tubário","substitui":[],"apos":"ovario-e","porEscolha":{"direita":{"substitui":[],"apos":"ovario-d"},"esquerda":{"substitui":[],"apos":"ovario-e"}},"variantes":[{"texto":"Na região anexial {{direita|esquerda}}, caracteriza-se formação em \"anel tubário\", arredondada, de contornos bem definidos e regulares, medindo {{*}} x {{*}} x {{*}} mm, com paredes espessas hipoecogênicas e fluxo ao estudo complementar com Doppler, ocupando cerca de 1/3 da circunferência. Apresenta no interior, formação compatível com saco gestacional ectópico, de contornos regulares e medindo {{*}} mm (diâmetro médio {{*}} mm), com vesícula vitelina presente, medindo {{*}} mm. Embrião não caracterizado.","hd":["Gestação ectópica tubária à {{direita|esquerda}}.","Nota: Os achados dependem da adequada correlação clínico-laboratorial."]}]},{"id":"ectopica-anel-ou-cisto","nome":"Ectópica – anel tubário ou cisto ovariano","substitui":[],"apos":"ovario-e","porEscolha":{"direita":{"substitui":[],"apos":"ovario-d"},"esquerda":{"substitui":[],"apos":"ovario-e"}},"variantes":[{"texto":"Na região anexial {{direita|esquerda}}, caracteriza-se formação cística, arredondada, adjacente ao ovário, impossibilitando a precisa distinção pelo método ecográfico, de contornos bem definidos e regulares, com paredes espessas, hipoecogênicas e fluxo ao estudo Doppler ocupando cerca de 1/3 da circunferência, medindo {{*:a}} x {{*:b}} x {{*:c}} mm, e volume estimado de {{=elipsoide(a,b,c)/1000}} cm³. Área cística central mede {{*}} mm (diâmetro médio {{*}} mm). Ausência de sinais de vesícula vitelina ou embrião.","hd":["Formação cística anexial à {{direita|esquerda}}. Considerar possibilidade de gestação ectópica ou cisto  idade gestacional específica.","hd":[]}]},{"id":"objetivo-crescimento-vitalidade","nome":"Objetivo: crescimento e vitalidade","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: O objetivo do ultrassom obstétrico é avaliar o crescimento e vitalidade fetais. Não tem finalidade de rastreamento e diagnóstico de doenças genéticas e/ou malformações fetais.","hd":[]}]},{"id":"bhcg-previo","nome":"b-HCG prévio","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: Necessário b-HCG previamente ao estudo ultrassonográfico para aumentar-se com isso, a acurácia do método.","hd":[]}]},{"id":"urgencia","nome":"Exame de urgência","frequente":true,"tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Exame realizado em caráter de urgência.","hd":[]}]},{"id":"finalidade-obstetrica","nome":"Finalidade da obstétrica","frequente":true,"tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: A ultrassonografia obstétrica tem como finalidade a determinação do posicionamento fetal e da placenta, avaliação quantitativa do líquido amniótico e biometria fetal. O estudo da morfologia fetal é realizado na ultrassonografia morfológica.","hd":[]}]},{"id":"malformacoes-morfologico","nome":"Malformações não detectadas","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Mesmo ao ultrassom morfológico, cerca de 15% das malformações podem não ser detectadas intraútero.","hd":[]}]},{"id":"correlacao-clinico-laboratorial","nome":"Correlação clínico-laboratorial","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Os achados dependem da adequada correlação clínico-laboratorial.","hd":[]}]},{"id":"migracao-placentaria","nome":"Controle da migração placentária","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Sugiro a critério clínico, controle ultrassonográfico da localização placentária após idade gestacional de 24/28 semanas, para acompanhar o fenômeno de migração placentária.","hd":[]}]}]},{"id":"primeiro-trimestre","nome":"Primeiro trimestre","mascaras":["obstetrica-inicial-tv","obstetrica-inicial-abdominal","gemelar-inicial-tv"],"achados":[{"id":"abortamento-em-curso","nome":"Abortamento em curso","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce"],"apos":"saco-gestacional","variantes":[{"nome":"Com conteúdo hemático","texto":"Cavidade uterina ocupada por material heterogêneo, predominantemente hiperecogênico, sem fluxo ao estudo Doppler, medindo até {{*}} mm de espessura, podendo corresponder a conteúdo hemático/coágulos, caracterizando ainda saco gestacional na cavidade uterina, deslocado, em topografia ístmica, de contornos irregulares, medindo {{*}} mm (diâmetro médio {{*}} mm). Formação ecogênica no interior do saco gestacional, medindo {{*}} mm no maior eixo, sugerindo eco embrionário.","hd":["Sinais ultrassonográficos de abortamento em curso, na dependência de correlação com dados clínicos."]},{"nome":"Com hematoma retrocoriônico","texto":"Saco gestacional na cavidade uterina, deslocado, em topografia ístmica, de contornos irregulares, medindo {{*}} mm (diâmetro médio {{*}} mm). Nota-se formação laminar, hipoecogênica, de contornos irregulares, sem fluxo ao estudo Doppler, adjacente à parede inferior do saco gestacional, ocupando cerca de {{*}} % do mesmo, sugerindo hematoma retrocoriônico.\nFormação ecogênica no interior do saco gestacional, medindo {{*}} mm no maior eixo, sugerindo eco embrionário. Movimentos embrionários e batimentos cardíacos ausentes. Vesícula vitelina não caracterizada.","hd":["Sinais ultrassonográficos de abortamento em curso, na dependência de correlação com dados clínicos."]}]},{"id":"corpo-luteo","nome":"Corpo lúteo","frequente":true,"substitui":[],"apos":"ovarios","variantes":[{"texto":"Cisto de paredes espessas e {{regulares|anfractuosas}}, apresentando conteúdo hipoecogênico e halo ecogênico, medindo {{*}} x {{*}} mm, que ao estudo complementar com Doppler apresenta vascularização periférica, sendo de provável etiologia funcional (corpo lúteo).","hd":["Formação cística localizada no ovário {{direito|esquerdo}} sugestiva de corpo lúteo."]}]},{"id":"doenca-trofoblastica","nome":"Doença trofoblástica gestacional","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido"],"apos":"utero","variantes":[{"texto":"Cavidade uterina preenchida por material heterogêneo, predominantemente ecogênico com diminutas áreas císticas de permeio, de aspecto vesicular, caracterizando o sinal de \"flocos de neve\", sem sinais de componentes ósseos, medindo {{*}} mm e volume estimado de {{*}} cm³. Planos de clivagem aparentemente bem definidos entre a cavidade endometrial e a parede anterior do miométrio. Parede posterior do miométrio de difícil avaliação ecográfica devido à atenuação dos feixes sonoros posteriores.","hd":["Material heterogêneo na cavidade uterina, podendo corresponder à doença trofoblástica gestacional."]}]},{"id":"ectopica-massa","nome":"Ectópica: massa anexial","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido","fundo-de-saco"],"apos":"ovarios","variantes":[{"texto":"Formação cístico-sólida, na região anexial {{direita|esquerda}}, de contornos lobulados, com septos espessos e moderados debris de permeio, sem fluxo ao estudo complementar com Doppler, medindo {{*:a}} x {{*:b}} x {{*:c}} mm e volume estimado de {{=elipsoide(a,b,c)/1000}} cm³.\nModerada quantidade de líquido livre de aspecto anecoide, com moderados debris e traves de permeio, se estendendo do fundo de saco posterior até espaços hepato e espleno-renais.","hd":["Não foram caracterizados embrião ou saco gestacional na cavidade uterina.","Moderada quantidade de líquido intraperitoneal, sugerindo sangue/coágulos.","Formação heterogênea na região anexial à {{direita|esquerda}}. Considerar possibilidade de gestação ectópica rota."]}]},{"id":"ectopica-rota-ou-cisto-hemorragico","nome":"Ectópica rota ou cisto hemorrágico","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido","fundo-de-saco"],"apos":"ovarios","variantes":[{"texto":"Formação cístico-sólida, na região anexial {{direita|esquerda}}, adjacente ao ovário, impossibilitando a precisa distinção pelo método ecográfico, de contornos irregulares com septos espessos e moderados debris de permeio, sem fluxo ao estudo Doppler, medindo {{*:a}} x {{*:b}} x {{*:c}} mm, e volume estimado de {{=elipsoide(a,b,c)/1000}} cm³. Moderada quantidade de líquido livre de aspecto anecoide, com moderados debris e septações finas de permeio, se estendendo do fundo de saco posterior até espaços hepato e espleno-renais.","hd":["Não foram caracterizados embrião ou saco gestacional na cavidade uterina.","Moderada quantidade de líquido intraperitoneal, sugerindo sangue/coágulos.","Formação heterogênea anexial à {{direita|esquerda}}. Considerar possibilidade de gestação ectópica rota ou cisto hemorrágico roto."]}]},{"id":"ectopica-anel-tubario","nome":"Ectópica: anel tubário","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido"],"apos":"ovarios","variantes":[{"texto":"Na região anexial {{direita|esquerda}}, caracteriza-se formação em \"anel tubário\", arredondada, de contornos bem definidos e regulares, medindo {{*}} x {{*}} x {{*}} mm, com paredes espessas hipoecogênicas e fluxo ao estudo complementar com Doppler, ocupando cerca de 1/3 da circunferência. Apresenta no interior, formação compatível com saco gestacional ectópico, de contornos regulares e medindo {{*}} mm (diâmetro médio {{*}} mm), com vesícula vitelina presente, medindo {{*}} mm. Embrião não caracterizado.","hd":["Não foram caracterizados embrião ou saco gestacional na cavidade uterina.","Gestação ectópica tubária à {{direita|esquerda}}."]}]},{"id":"ectopica-anel-ou-cisto","nome":"Anel tubário ou cisto ovariano","substitui":["saco-gestacional","hematoma-retrocorionic vesicula-vitelina","embriao.ccn","embriao.bce"],"apos":"saco-gestacional","variantes":[{"texto":"Saco gestacional tópico, implantado na região fúndica, com contornos irregulares, medindo {{*}} mm (diâmetro médio: {{*}} mm), não sendo caracterizado embrião no presente estudo.","hd":["Achados sugestivos de gestação anembrionada."]}]},{"id":"evolucao-desfavoravel","nome":"Evolução desfavorável","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce"],"apos":"saco-gestacional","variantes":[{"texto":"Saco gestacional tópico, implantado na região fúndica, com contornos irregulares, medindo {{*}} mm (diâmetro médio: {{*}} mm), apresentando vesícula vitelínica hiperecogênica, medindo >6,0 mm (hidrópica), e formação convexa, polipoide, com invaginação de tecido coriônico para o interior da cavidade amniótica \"bump coriônico\". Embrião único com comprimento cabeça-nádega (CCN) medindo {{*}} mm. Movimentos embrionários presentes, associado a bradicardia embrionária (\u003c90/100bpm).","hd":["Gestação tópica, com feto único e vivo, apresentando critérios de evolução desfavorável.","Idade gestacional de {{*}} semanas e {{*}} dia(s) (± 5 dias) pelo CCN."]}]},{"id":"gestacao-ectopica","nome":"Gestação ectópica","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido"],"apos":"ovarios","variantes":[{"texto":"Caracteriza-se na região anexial {{direita|esquerda}}, formação arredondada, de contornos bem definidos e regulares, medindo {{*}} mm, com paredes espessas hipoecogênicas e fluxo ao Doppler ocupando cerca de 1/3 da circunferência. Apresenta no interior formação compatível com saco gestacional ectópico de contornos regulares, medindo {{*}} mm (diâmetro médio {{*}} mm), vesícula vitelina presente medindo {{*}} mm, e embrião único com comprimento cabeça-nádega (CCN) medindo {{*}} mm. Movimentos embrionários e batimentos cardíacos presentes (BCE = {{*}} bpm).","hd":["Não foram caracterizados embrião ou saco gestacional na cavidade uterina.","Gestação ectópica tubária à {{direita|esquerda}} com embrião único e vivo.","Idade gestacional de {{*}} semanas e {{*}} dia(s) (± 5 dias) pelo CCN."]}]},{"id":"hematoma-retrocorionico","nome":"Hematoma retrocoriônico","frequente":true,"substitui":["hematoma-retrocorionico"],"apos":"saco-gestacional","variantes":[{"texto":"Formação laminar, hipoecogênica, de contornos irregulares, sem fluxo ao estudo Doppler, adjacente à parede {{fúndica|inferior|lateral|posterior|anterior}} do saco gestacional, ocupando cerca de {{*}}% do mesmo, sugerindo hematoma.","hd":["Achados ultrassonográficos sugestivos de hematoma retrocoriônico."]}]},{"id":"restos-ovulares","nome":"Restos ovulares","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido"],"apos":"utero","variantes":[{"texto":"Cavidade uterina ocupada por material heterogêneo, predominantemente hiperecogênico, sem fluxo ao estudo Doppler, medindo até {{*}} mm de espessura, podendo corresponder a conteúdo hemático, coágulos e/ou restos ovulares.","hd":["Material heterogêneo em {{pequena|moderada|acentuada}} quantidade na cavidade uterina. Considerar possibilidade de restos ovulares/coágulos."]}]}]},{"id":"segundo-terceiro-trimestres","nome":"Segundo e terceiro trimestres","mascaras":["obstetrica","obstetrica-doppler","morfologica","perfil-biofisico","colo-uterino-tv","obstetrica-gemelar","obstetrica-gemelar-doppler","obstetrica-trigemelar"],"achados":[{"id":"hematoma-retroplacentario","nome":"Hematoma retroplacentário","substitui":[],"apos":"placenta","variantes":[{"texto":"Formação laminar, hipoecogênica, de contornos irregulares, sem fluxo ao Doppler, adjacente à região inferior da placenta, ocupando cerca de {{*}}% da sua superfície de inserção, medindo {{*}} mm, se insinuando através do orifício interno do colo uterino, podendo corresponder a hematoma.","hd":["Achados ultrassonográficos sugestivos de hematoma {{retroplacentário|periplacentário}}."]}]},{"id":"incompetencia-istmo-cervical","nome":"Avaliação istmo-cervical","substitui":["colo","colo.protrusao"],"apos":"colo","variantes":[{"texto":"Colo uterino apresentando orifício cervical interno medindo {{*}} mm (VR \u003c5 mm), sem protrusão das membranas (protrusão normal \u003c 3 mm), e medindo {{*}} mm de extensão (VR >25 mm).","hd":["Ausência de achados ultrassonográficos sugestivos de incompetência istmo-cervical."]}]},{"id":"obito-fetal","nome":"Óbito fetal","substitui":["bcf","liquido","liquido.ila"],"apos":"feto","variantes":[{"texto":"Polo cefálico de contornos irregulares, sugerindo superposição de ossos do crânio (Sinal de Spalding) com gases na circulação fetal (Sinal de Robert), associado a hiperflexão da coluna vertebral (Sinal de Hartley) e sinal do halo craniano (Sinal de Deuel).\nMovimentos fetais e batimentos cardíacos ausentes.\nLíquido amniótico em quantidade reduzida (ILA {{*}} / Maior bolsão {{*}} mm).","hd":["Gestação com feto único.","Óbito fetal em idade gestacional de {{*}} semanas e {{*}} dias (± {{*}} semanas) pelo comprimento femoral.","Oligoâmnio severo."]}]},{"id":"oligoamnio","nome":"Oligoâmnio","frequente":true,"substitui":["liquido","liquido.ila"],"apos":"liquido","variantes":[{"texto":"Líquido amniótico em quantidade reduzida com ILA de {{*}} e maior bolsão de {{*}} mm.","hd":["Oligoâmnio."]}]},{"id":"polidramnio","nome":"Polidrâmnio","frequente":true,"substitui":["liquido","liquido.ila"],"apos":"liquido","variantes":[{"texto":"Líquido amniótico em quantidade aumentada com ILA de {{*}} e maior bolsão de {{*}} mm.","hd":["Polidrâmnio."]}]},{"id":"placenta-baixa","nome":"Placenta baixa","frequente":true,"substitui":["placenta","placenta.grau"],"apos":"placenta","variantes":[{"texto":"Placenta de inserção corporal {{anterior|posterior}} estendendo-se até o segmento ístmico do útero, não ocupando o orifício interno do colo, distando {{*}} mm deste (VR >20). Espessura placentária normal e grau {{*}} de maturidade (Grannum).","hd":["Placenta de inserção baixa."]}]},{"id":"placentomegalia","nome":"Placentomegalia","substitui":["placenta","placenta.grau"],"apos":"placenta","variantes":[{"texto":"Placenta de inserção corporal {{anterior|posterior|fúndica}}, não se estendendo até o segmento inferior do útero, apresentando aumento difuso de suas dimensões, medindo até {{*}} mm de espessura (VR para idade gestacional \u003c {{*}} mm). Grau {{*}} de maturidade (Grannum).","hd":["Placentomegalia."]}]}]},{"id":"observacoes-doppler","nome":"Observações do Doppler obstétrico","mascaras":["obstetrica-doppler","morfologica","obstetrica-gemelar-doppler","obstetrica-gemelar","obstetrica-trigemelar"],"achados":[{"id":"doppler-pre-eclampsia","nome":"Doppler e pré-eclâmpsia","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: A importância fundamental do Doppler obstétrico para predizer pré-eclâmpsia (sensibilidade de 25 a 100 % e valor preditivo positivo de 4 a 72 %), é a sua realização, através das artérias uterinas, entre a 20ª e a 27ª semana de gestação. No terceiro trimestre de gestação, através das artérias umbilicais, a atenção estará direcionada para a avaliação do bem-estar fetal.","hd":[]}]},{"id":"corrigir-ig","nome":"Corrigir IG pelo 1º trimestre","tipo":"nota","substitui":[],"variantes":[{"texto":"Observações: Convém corrigir a idade gestacional de acordo com a ultrassonografia do primeiro trimestre.","hd":[]}]},{"id":"ausencia-incisura","nome":"Ausência de incisura","tipo":"nota","substitui":[],"variantes":[{"texto":"Observações: A ausência de incisura no traçado das artérias uterinas sugere considerar outras causas, distintas da pré-eclâmpsia, para explicar o quadro hipertensivo da gestante.","hd":[]}]},{"id":"incisura-unilateral","nome":"Incisura unilateral","tipo":"nota","substitui":[],"variantes":[{"texto":"Observações: A incisura protodiastólica, quando unilateral, geralmente não configura indicativo patológico.","hd":[]}]},{"id":"incisura-unilateral-diferenca-ir","nome":"Incisura unilateral, diferença de IR","tipo":"nota","substitui":[],"variantes":[{"texto":"Observações: A incisura protodiastólica, quando unilateral, geralmente não configura indicativo patológico. No entanto, diferença superior a 0,10 entre os índices de resistência das artérias uterinas justifica acompanhamento clínico e complementar mais estreito.","hd":[]}]},{"id":"incisura-fisiologica","nome":"Incisura fisiológica (reavaliar após 27 sem.)","tipo":"nota","substitui":[],"variantes":[{"texto":"Observações: O achado de incisura protodiastólica nas artérias uterinas pode ser fisiológico nesta idade gestacional. A critério clínico, pode ser conveniente reavaliar com estudo Doppler após 27 semanas.","hd":[]}]},{"id":"incisura-bilateral-persistente","nome":"Incisura bilateral persistente","tipo":"nota","substitui":[],"variantes":[{"texto":"Observações: A presença de incisura protodiastólica bilateral nas artérias uterinas, persistente nesta idade gestacional, sugere aumento da reatividade vascular na circulação uteroplacentária. A vigilância clínica pode identificar, em cerca de metade dos casos, alterações características no ganho ponderal e nos níveis pressóricos maternos.","hd":[]}]},{"id":"centralizacao-hipoxemia","nome":"Centralização e hipoxemia","tipo":"nota","substitui":[],"variantes":[{"texto":"Observações: A \"centralização\" hemodinâmica fetal apresenta estreita correlação com hipoxemia fetal. A critério clínico, e considerando as condições de assistência neonatal disponíveis, pode ser conveniente (ou eventualmente dispensável) a associação com métodos biofísicos, como cardiotocografia e/ou estudo Doppler do ducto venoso.","hd":[]}]},{"id":"incisura-fisiologica-22","nome":"Incisura fisiológica (reavaliar após 22 sem.)","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: O achado de incisura protodiastólica, em artérias uterinas, pode ser fisiológico nesta idade gestacional. Sob julgamento clínico, poderia ser ca.","hd":[]}]},{"id":"correlacao-dra","nome":"Correlação na DRA","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs: As alterações renais morfoestruturais embora sejam sugestivas de DRA, a adequada correlação funcional/laboratorial torna-se indispensável.","hd":[]}]},{"id":"correlacao-drc","nome":"Correlação na DRC","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs: As alterações renais morfoestruturais embora sejam sugestivas de DRC, a adequada correlação funcional/laboratorial torna-se indispensável.","hd":[]}]},{"id":"urgencia","nome":"Exame de urgência","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Exame realizado em caráter de urgência.","hd":[]}]},{"id":"nodulos-5mm","nome":"Nódulos prostáticos menores que 5 mm","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs: Nódulos prostáticos menores que 5 mm de diâmetro geralmente não são visibilizados ultrassonograficamente.","hd":[]}]}]},{"id":"bexiga","nome":"Bexiga","achados":[{"id":"cistite","nome":"Cistite","substitui":["bexiga.conteudo","bexiga.parede"],"apos":"bexiga","variantes":[{"texto":"Bexiga de morfologia habitual, apresentando paredes regulares e difusamente espessadas, medindo {{*}} cm (VR \u003c0,5 cm). O conteúdo vesical é heterogêneo, à custa de focos ecogênicos / ecos em suspensão (debris). Esse achado não é específico, mas pode estar relacionado a processo inflamatório/infeccioso, na dependência de dados clínicos e laboratoriais.","hd":["Espessamento parietal vesical difuso, que apesar de não ser um achado específico, pode corresponder a processo inflamatório/infeccioso (cistite), caso haja um contexto clínico e laboratorial compatível."]}]},{"id":"cistite-nivel","nome":"Cistite com nível líquido","substitui":["bexiga.conteudo"],"apos":"bexiga","variantes":[{"texto":"Bexiga urinária de forma e capacidade conservadas, com presença de conteúdo hipoecogênico no seu interior, móvel à mudança de decúbito, formando nível líquido-líquido, sem fluxo ao estudo complementar com D   var ECOGENICIDADE = [
    { id: 'anecoico', nome: 'Anecoico', pontos: 0, texto: 'anecoico' },
    { id: 'hiper-iso', nome: 'Hiperecogênico ou isoecogênico', pontos: 1, texto: 'hiperecogênico ou isoecogênico' },
    { id: 'hipo', nome: 'Hipoecogênico', pontos: 2, texto: 'hipoecogênico' },
    { id: 'muito-hipo', nome: 'Muito hipoecogênico', pontos: 3, texto: 'muito hipoecogênico' }
  ];
  var FORMA = [
    { id: 'largo', nome: 'Mais largo que alto', pontos: 0, texto: 'mais largo que alto' },
    { id: 'alto', nome: 'Mais alto que largo', pontos: 3, texto: 'mais alto que largo' }
  ];
  var MARGEM = [
    { id: 'lisa', nome: 'Lisa (regular)', pontos: 0, texto: 'de margens regulares' },
    { id: 'mal-definida', nome: 'Mal definida', pontos: 0, texto: 'de margens mal definidas' },
    { id: 'irregular', nome: 'Lobulada ou irregular', pontos: 2, texto: 'de margens lobuladas ou irregulares' },
    { id: 'extensao', nome: 'Extensão extratireoidiana', pontos: 3, texto: 'com extensão extratireoidiana' }
  ];
  // Focos: vários, somam. "nenhum" exclui os outros.
  var FOCOS = [
    { id: 'nenhum', nome: 'Nenhum ou cauda de cometa grande', pontos: 0, texto: '' },
    { id: 'macro', nome: 'Macrocalcificações', pontos: 1, texto: 'macrocalcificações' },
    { id: 'periferica', nome: 'Calcificações periféricas (em anel)', pontos: 2, texto: 'calcificações periféricas (em anel)' },
    { id: 'puntiformes', nome: 'Focos ecogênicos puntiformes', pontos: 3, texto: 'focos ecogênicos puntiformes' }
  ];
  // Fora da pontuação: vascularização ao Doppler (Chammas).
  var CHAMMAS = [
    { id: 'I', nome: 'I · ausente', texto: 'Ao Doppler, ausência de vascularização (Chammas I).' },
    { id: 'II', nome: 'II · periférica', texto: 'Ao Doppler, vascularização predominantemente periférica (Chammas II).' },
    { id: 'III', nome: 'III · periférica ≥ central', texto: 'Ao Doppler, vascularização periférica maior ou igual à central (Chammas III).' },
    { id: 'IV', nome: 'IV · central > periférica', texto: 'Ao Doppler, vascularização central maior que a periférica (Chammas IV).' },
    { id: 'V', nome: 'V · só central', texto: 'Ao Doppler, vascularização exclusivamente central (Chammas V).' }
  ];
  var LOBOS = [
    { id: 'direito', nome: 'Lobo direito', texto: 'do lobo direito', conclusao: 'no lobo direito' },
    { id: 'istmo', nome: 'Istmo', texto: 'no istmo', conclusao: 'no istmo' },
    { id: 'esquerdo', nome: 'Lobo esquerdo', texto: 'do lobo esquerdo', conclusao: 'no lobo esquerdo' }
  ];
  var TERCOS = [
    { id: 'superior', nome: 'Superior', texto: 'superior' },
    { id: 'medio', nome: 'Médio', texto: 'médio' },
    { id: 'inferior', nome: 'Inferior', texto: 'inferior' }
  ];
  var CATEGORIAS = [
    null,
    { tr: 1, nome: 'benigno' },
    { tr: 2, nome: 'não suspeito' },
    { tr: 3, nome: 'levemente suspeito' },
    { tr: 4, nome: 'moderadamente suspeito' },
    { tr: 5, nome: 'altamente suspeito' }
  ];
  // Conduta pelo maior diâmetro (cm): PAAF a partir de, seguimento a partir de.
  var LIMITES = { 3: { paaf: 2.5, seguimento: 1.5 }, 4: { paaf: 1.5, seguimento: 1.0 }, 5: { paaf: 1.0, seguimento: 0.5 } };
  var PONTUADAS = ['composicao', 'ecogenicidade', 'forma', 'margem', 'focos'];
  var NOMES_SECAO = { composicao: 'composição', ecogenicidade: 'ecogenicidade', forma: 'forma', margem: 'margem', focos: 'focos ecogênicos' };
  var MEDIDAS = ['d1', 'd2', 'd3'];

  function opcao(lista, id) {
    for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i];
    return null;
  }
  var LISTAS = { composicao: COMPOSICAO, ecogenicidade: ECOGENICIDADE, forma: FORMA, margem: MARGEM, focos: FOCOS };

  // Focos válidos, na ordem da lista; "nenhum" sozinho exclui os outros.
  function focosDe(dados) {
    var f = (dados && Array.isArray(dados.focos)) ? dados.focos : [];
    var r = FOCOS.filter(function (o) { return f.indexOf(o.id) >= 0; }).map(function (o) { return o.id; });
    if (r.indexOf('nenhum') >= 0 && r.length > 1) r = r.filter(function (x) { return x !== 'nenhum'; });
    return r;
  }

  // { total, completo, faltam: [ids das categorias sem marcação], espongiforme }
  // Espongiforme: 0 ponto no total, sem somar as outras categorias (TR1), e já basta.
  function pontuar(dados) {
    dados = dados || {};
    if (dados.composicao === 'espongiforme') return { total: 0, completo: true, faltam: [], espongiforme: true };
    var total = 0, faltam = [];
    PONTUADAS.forEach(function (k) {
      if (k === 'focos') {
        var fs = focosDe(dados);
        if (!fs.length) faltam.push(k);
        fs.forEach(function (id) { total += opcao(FOCOS, id).pontos; });
        return;
      }
      var o = opcao(LISTAS[k], dados[k]);
      if (!o) faltam.push(k); else total += o.pontos;
    });
    return { total: total, completo: !faltam.length, faltam: faltam, espongiforme: false };
  }

  // Total -> { tr, nome }. 0-1 TR1; 2 TR2; 3 TR3; 4-6 TR4; >= 7 TR5.
  function categoria(total) {
    var t = +total || 0;
    return CATEGORIAS[t <= 1 ? 1 : t === 2 ? 2 : t === 3 ? 3 : t <= 6 ? 4 : 5];
  }

  // Número digitado (vírgula ou ponto) ou null.
  function lerNumero(v) {
    if (v == null) return null;
    var t = String(v).trim();
    if (!/^[-+]?(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(t)) return null;
    var x = parseFloat(t.replace(',', '.'));
    return isFinite(x) && x > 0 ? x : null;
  }

  function maiorDiametro(valores) {
    var m = null;
    MEDIDAS.forEach(function (k) { var x = lerNumero(valores && valores[k]); if (x != null && (m == null || x > m)) m = x; });
    return m;
  }

  // 'paaf' | 'seguimento' | 'nenhuma' (abaixo dos limites, ou TR1/TR2) | null (sem medida).
  function conduta(tr, diametro) {
    if (diametro == null || !(diametro > 0)) return null;
    var lim = LIMITES[tr];
    if (!lim) return 'nenhuma';
    var d = Math.round(diametro * 1000) / 1000; // 2.5 digitado é 2.5, sem resto de ponto flutuante
    if (d >= lim.paaf) return 'paaf';
    if (d >= lim.seguimento) return 'seguimento';
    return 'nenhuma';
  }

  function fmt(x) { return String(Math.round(x * 100) / 100).replace('.', ','); }
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }

  function juntarE(lista) {
    if (lista.length <= 1) return lista.join('');
    return lista.slice(0, -1).join(', ') + ' e ' + lista[lista.length - 1];
  }

  // Avaliação completa: pontos, categoria (só com tudo marcado), maior diâmetro, conduta.
  function avaliar(dados, valores) {
    var p = pontuar(dados);
    var cat = p.completo ? categoria(p.total) : null;
    var d = maiorDiametro(valores);
    return { pontos: p, categoria: cat, diametro: d, conduta: cat ? conduta(cat.tr, d) : null };
  }

  // Linha(s) do laudo. Medidas são campos do laudo ({{*:d1}}…); categoria ainda incompleta é
  // campo pendente ({{*:tr}}), como qualquer valor que falta.
  function textoNodulo(dados, numero) {
    dados = dados || {};
    var lobo = opcao(LOBOS, dados.lobo);
    if (!lobo) return '';
    var carac = [];
    ['composicao', 'ecogenicidade', 'forma', 'margem'].forEach(function (k) {
      var o = opcao(LISTAS[k], dados[k]);
      if (o) carac.push(o.texto);
    });
    var fs = focosDe(dados);
    if (fs.length) {
      if (fs[0] === 'nenhum') carac.push('sem focos ecogênicos');
      else carac.push('com ' + juntarE(fs.map(function (id) { return opcao(FOCOS, id).texto; })));
    }
    var terco = dados.lobo === 'istmo' ? null : opcao(TERCOS, dados.terco);
    var onde = dados.lobo === 'istmo' ? 'no istmo' : terco ? 'no terço ' + terco.texto + ' ' + lobo.texto : (dados.lobo === 'direito' ? 'no lobo direito' : 'no lobo esquerdo');
    var p = pontuar(dados), cat = p.completo ? categoria(p.total) : null;
    var classe = cat ? 'ACR TI-RADS ' + cat.tr + ' – ' + plural(p.total, 'ponto', 'pontos') : 'ACR TI-RADS {{*:tr}}';
    var t = (numero ? 'N' + numero + ': ' : '') + 'Nódulo' + (carac.length ? ' ' + carac.join(', ') + ',' : '') +
      ' medindo {{*:d1}} x {{*:d2}} x {{*:d3}} cm, localizado ' + onde + ' (' + classe + ').';
    var ch = opcao(CHAMMAS, dados.chammas);
    if (ch) t += '\n' + ch.texto;
    return t;
  }

  var FRASE_CONDUTA = { paaf: ' Pelo tamanho, há indicação de PAAF.', seguimento: ' Pelo tamanho, sugere-se seguimento ultrassonográfico.' };

  function textoConclusao(dados, valores, numero, comConduta) {
    dados = dados || {};
    var lobo = opcao(LOBOS, dados.lobo);
    if (!lobo) return '';
    var a = avaliar(dados, valores);
    var t = 'Nódulo ' + lobo.conclusao + (numero ? ' (N' + numero + ')' : '') + ', ';
    t += a.categoria ? 'ACR TI-RADS ' + a.categoria.tr + ' (' + a.categoria.nome + ').' : 'ACR TI-RADS {{*:tr}}.';
    if (comConduta && a.conduta && FRASE_CONDUTA[a.conduta]) t += FRASE_CONDUTA[a.conduta];
    return t;
  }

  // Resumo para a interface (topo do formulário e item na faixa).
  function resumo(dados, valores) {
    var a = avaliar(dados, valores), p = a.pontos, itens = [];
    itens.push({ rotulo: 'Pontos', valor: String(p.total) + (p.espongiforme ? ' (espongiforme)' : '') });
    if (a.categoria) itens.push({ rotulo: 'Categoria', valor: 'TR' + a.categoria.tr + ' · ' + a.categoria.nome, nivel: a.categoria.tr });
    else itens.push({ rotulo: 'Categoria', valor: 'falta: ' + p.faltam.map(function (k) { return NOMES_SECAO[k]; }).join(', '), pendente: true });
    if (a.categoria && a.diametro != null) {
      var lim = LIMITES[a.categoria.tr], txt;
      if (a.conduta === 'paaf') txt = 'PAAF (≥ ' + fmt(lim.paaf) + ' cm)';
      else if (a.conduta === 'seguimento') txt = 'Seguimento (≥ ' + fmt(lim.seguimento) + ' cm)';
      else txt = lim ? 'Sem PAAF nem seguimento (< ' + fmt(lim.seguimento) + ' cm)' : 'Sem PAAF';
      itens.push({ rotulo: 'Conduta', valor: txt + ' · maior eixo ' + fmt(a.diametro) + ' cm', nivel: a.conduta === 'paaf' ? 5 : a.conduta === 'seguimento' ? 3 : 1 });
    }
    var curto = [];
    if (a.categoria) curto.push('TR' + a.categoria.tr);
    if (a.diametro != null) curto.push(fmt(a.diametro) + ' cm');
    return { itens: itens, curto: curto.join(' · ') || 'incompleto' };
  }

  // ---------- registro no motor (formulário genérico) ----------
  function semPontos(l) { return l.map(function (o) { return { id: o.id, nome: o.nome }; }); }
  function comPontos(l) { return l.map(function (o) { return { id: o.id, nome: o.nome, pontos: o.pontos }; }); }

  var formulario = {
    nome: 'Nódulo (TI-RADS)',
    prefixo: 'N',              // N1, N2… pela ordem no laudo
    rotuloOutro: 'Outro nódulo',
    escolha: 'lobo',           // dado que escolhe o lugar (chave de porEscolha do achado)
    unidades: { d1: 'cm', d2: 'cm', d3: 'cm' },
    secoes: [
      { id: 'lobo', nome: 'Localização', opcoes: semPontos(LOBOS), fixa: true },
      { id: 'terco', nome: 'Terço', opcoes: semPontos(TERCOS), quando: function (d) { return d.lobo !== 'istmo'; } },
      { id: 'composicao', nome: 'Composição', opcoes: comPontos(COMPOSICAO), cartoes: true },
      { id: 'ecogenicidade', nome: 'Ecogenicidade', opcoes: comPontos(ECOGENICIDADE), cartoes: true },
      { id: 'forma', nome: 'Forma', opcoes: comPontos(FORMA), cartoes: true },
      { id: 'margem', nome: 'Margem', opcoes: comPontos(MARGEM), cartoes: true },
      { id: 'focos', nome: 'Focos ecogênicos', dica: 'pode marcar mais de um; somam', opcoes: comPontos(FOCOS), cartoes: true, multipla: true, exclusiva: 'nenhum' },
      { id: 'medidas', nome: 'Medidas', tipo: 'medidas', campos: MEDIDAS, unidade: 'cm' },
      { id: 'chammas', nome: 'Doppler (Chammas)', dica: 'opcional, fora da pontuação', opcoes: semPontos(CHAMMAS) }
    ],
    opcoes: [{ id: 'conduta', nome: 'Incluir conduta na conclusão', padrao: false }],
    // ctx: { numero, valores, opcoes }. Texto vazio = ainda não entra no laudo (sem lobo).
    gerar: function (dados, ctx) {
      ctx = ctx || {};
      var texto = textoNodulo(dados, ctx.numero);
      if (!texto) return { texto: '', hd: [] };
      return { texto: texto, hd: [textoConclusao(dados, ctx.valores, ctx.numero, !!(ctx.opcoes && ctx.opcoes.conduta))] };
    },
    resumo: function (dados, valores) { return resumo(dados, valores); }
  };

  return {
    COMPOSICAO: COMPOSICAO, ECOGENICIDADE: ECOGENICIDADE, FORMA: FORMA, MARGEM: MARGEM, FOCOS: FOCOS,
    CHAMMAS: CHAMMAS, LIMITES: LIMITES,
    pontuar: pontuar,
    categoria: categoria,
    conduta: conduta,
    maiorDiametro: maiorDiametro,
    avaliar: avaliar,
    textoNodulo: textoNodulo,
    textoConclusao: textoConclusao,
    resumo: resumo,
    formulario: formulario
  };
});

</script>
<script>
/* Isodens USG - ilustrações esquemáticas do formulário TI-RADS (SVG nosso, 120x80, tons de cinza
   como num corte de ultrassom: subcutâneo, musculatura pré-tireoidiana, cápsula, parênquima e o
   nódulo mostrando a característica). Só para a interface: global USGFiguras.tirads[secao][opcao].
   Depende de figuras.js (USGDesenho). */
(function (raiz) {
  'use strict';
  var PAR = '#8a8a8a';        // parênquima tireoidiano
  var MUSC = '#2e2e2e';       // musculatura pré-tireoidiana (referência do "muito hipoecogênico")
  var CX = 60, CY = 46;

  // peças comuns (figuras.js)
  var D = raiz.USGDesenho, elipse = D.elipse, circ = D.circ, poli = D.poli, contorno = D.contorno;
  // Pontinhos fixos de textura (sempre os mesmos, sem sorteio).
  var TEXTURA = [[8, 28], [17, 60], [26, 35], [31, 66], [44, 24], [79, 25], [90, 63], [97, 31], [104, 52], [112, 26], [12, 45], [109, 67], [86, 40], [22, 52]];

  function fundo(semCapsula) {
    var h = '<rect width="120" height="80" fill="#0d0d0d"/>' +
      '<rect y="0" width="120" height="9" fill="#4a4a4a"/>' +
      '<rect y="9" width="120" height="11" fill="' + MUSC + '"/>' +
      '<path d="M0 12.5H120M0 16H120" stroke="#3b3b3b" stroke-width=".7"/>' +
      '<rect y="20" width="120" height="52" fill="' + PAR + '"/>' +
      '<rect y="72" width="120" height="8" fill="#1a1a1a"/>';
    TEXTURA.forEach(function (p, i) { h += circ(p[0], p[1], 0.9, i % 2 ? '#9b9b9b' : '#7b7b7b'); });
    if (!semCapsula) h += '<path d="M0 20H120" stroke="#b9b9b9" stroke-width="1"/>';
    return h;
  }
  function svg(corpo, semCapsula) {
    return '<svg class="fig" width="120" height="80" viewBox="0 0 120 80" aria-hidden="true" focusable="false">' + fundo(semCapsula) + corpo + '</svg>';
  }
  // Reforço acústico posterior (atrás de conteúdo líquido).
  function reforco(x0, x1) { return '<rect x="' + x0 + '" y="60" width="' + (x1 - x0) + '" height="12" fill="#a9a9a9"/>'; }
  // Sombra acústica posterior (atrás de calcificação grosseira).
  function sombra(x0, x1, y) { return poli([[x0, y], [x1, y], [x1 + 1, 72], [x0 - 1, 72]], '#141414'); }
  function solido(fill) { return elipse(CX, CY, 24, 14, fill || '#5c5c5c'); }

  var microcistos = '';
  [[-14, -5], [-7, -8], [0, -9], [7, -7], [14, -4], [-18, 2], [-10, 0], [-3, -1], [4, 0], [11, 1], [18, 2], [-12, 7], [-4, 7], [4, 8], [12, 7]].forEach(function (p, i) {
    microcistos += elipse(CX + p[0], CY + p[1], i % 3 ? 2.6 : 2, i % 2 ? 2.1 : 1.7, '#080808');
  });

  var pontos = '';
  [[-12, -4], [-5, 3], [2, -6], [8, 4], [14, -2], [-15, 5], [4, 9], [-2, -1]].forEach(function (p) { pontos += circ(CX + p[0], CY + p[1], 1.15, '#fafafa'); });

  var lobulado = contorno(CX, CY, 25, 15, function (a) { return 1 + 0.13 * Math.sin(5 * a) + 0.07 * Math.sin(11 * a + 1); });
  var espiculado = contorno(CX, CY, 24, 14, function (a) { var s = Math.sin(9 * a); return 1 + 0.1 * Math.sin(4 * a) + (s > 0.75 ? 0.28 * (s - 0.75) / 0.25 : 0); });
  var extensao = contorno(CX, 33, 24, 16, function (a) { var cima = Math.sin(a) < 0 ? -Math.sin(a) : 0; return 1 + 0.35 * Math.pow(cima, 3) + 0.06 * Math.sin(7 * a); });

  raiz.USGFiguras = raiz.USGFiguras || {};
  raiz.USGFiguras.tirads = {
    composicao: {
      cistico: svg(reforco(37, 83) + elipse(CX, CY, 24, 14, '#060606', ' stroke="#cfcfcf" stroke-width=".9"')),
      espongiforme: svg(elipse(CX, CY, 25, 15, '#9e9e9e') + microcistos),
      misto: svg(reforco(56, 82) + elipse(CX, CY, 24, 14, '#6e6e6e') + poli(contorno(CX + 7, CY - 1, 12, 9, function (a) { return 1 + 0.12 * Math.sin(3 * a); }), '#060606') + elipse(CX - 11, CY + 5, 4, 3, '#060606')),
      solido: svg(elipse(CX, CY, 24, 14, '#686868', ' stroke="#575757" stroke-width=".8"') + circ(CX - 9, CY - 3, 1, '#5c5c5c') + circ(CX + 6, CY + 4, 1, '#5c5c5c') + circ(CX + 12, CY - 5, 1, '#777'))
    },
    ecogenicidade: {
      anecoico: svg(reforco(37, 83) + elipse(CX, CY, 24, 14, '#060606')),
      'hiper-iso': svg(elipse(CX, CY, 25.5, 15.5, '#4a4a4a') + elipse(CX, CY, 24, 14, '#a8a8a8') + elipse(CX + 9, CY, 13, 12, PAR)),
      hipo: svg(solido('#545454')),
      'muito-hipo': svg(solido('#1b1b1b'))
    },
    forma: {
      largo: svg(elipse(CX, CY, 27, 12, '#555') +
        '<path d="M31 ' + CY + 'H89M' + CX + ' 32V60" stroke="#e6e6e6" stroke-width=".9" stroke-dasharray="2 2"/>'),
      alto: svg(elipse(CX, CY, 11, 22, '#555') +
        '<path d="M47 ' + CY + 'H73M' + CX + ' 22V70" stroke="#e6e6e6" stroke-width=".9" stroke-dasharray="2 2"/>')
    },
    margem: {
      lisa: svg(elipse(CX, CY, 24, 14, '#555', ' stroke="#3a3a3a" stroke-width="1"')),
      'mal-definida': svg(elipse(CX, CY, 29, 19, '#808080') + elipse(CX, CY, 27, 17, '#767676') + elipse(CX, CY, 25.5, 15.5, '#6a6a6a') + elipse(CX, CY, 24, 14, '#5f5f5f') + elipse(CX, CY, 21, 11.5, '#555')),
      irregular: svg(poli(lobulado.slice(0, 32).concat(espiculado.slice(32)), '#555')),
      extensao: svg('<path d="M0 20H38M82 20H120" stroke="#b9b9b9" stroke-width="1"/>' + poli(extensao, '#555'), true)
    },
    focos: {
      nenhum: svg(solido() + elipse(CX + 6, CY - 1, 9, 6, '#080808') + circ(CX + 6, CY - 4, 1.4, '#f2f2f2') +
        poli([[CX + 4.9, CY - 3], [CX + 7.1, CY - 3], [CX + 6, CY + 4]], '#d9d9d9', ' opacity=".85"')),
      macro: svg(solido() + sombra(53, 70, 50) +
        '<path d="M51 47Q61 39 71 46" fill="none" stroke="#f4f4f4" stroke-width="3.4" stroke-linecap="round"/>'),
      periferica: svg(solido() + sombra(37, 83, 59) + elipse(CX, CY, 24, 14, 'none', ' stroke="#f4f4f4" stroke-width="2.2"')),
      puntiformes: svg(solido('#4e4e4e') + pontos)
    }
  };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/* Isodens USG - nódulo de mama pelo léxico BI-RADS de ultrassom (ACR): descrição, sugestão de
   categoria (o médico decide), redação e categoria final do exame. Lógica pura, sem DOM.
   No navegador: global USGBirads (e se registra em USGMotor como "birads").
   No Node: module.exports (o teste registra com M.registrarFormulario('birads', B.formulario)). */
(function (raiz, fabrica) {
  var ehNode = typeof module === 'object' && module.exports;
  var B = fabrica(ehNode ? require('./motor.js') : raiz.USGMotor);

  // ---------- estado de tela ----------
  function abrirCategoria(id, mascaraId) {

  // Opções dos formulários (ex.: "Incluir conduta na conclusão"): padrão da definição + preferência.

  // ---------- favoritos por uso ----------

  function usoDe(g, a) { return ((prefs.uso || {})[cat.id] || {})[g + '/' + a] || 0; }
  function contarUso() {
