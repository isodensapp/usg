  // ---------- foco preservado entre renderizações ----------
  function acharF(f) {
    var els = document.querySelectorAll('[data-f]');
    for (var i = 0; i < els.length; i++) if (els[i].getAttribute('data-f') === f) return els[i];
    return null;
  }
  function capturarFoco() {
    var a = document.activeElement;
    if (a && a === $('folha')) { var s = selecao(); return s ? { cursor: { chave: s.fim.chave, pos: s.fim.pos } } : null; }
    var f = a && a.getAttribute && a.getAttribute('data-f');
    if (!f) return null;
    var r = { f: f };
    try { if (typeof a.selectionStart === 'number') { r.s = a.selectionStart; r.e = a.selectionEnd; } } catch (e) { /* tipo sem seleção */ }
    return r;
  }
  function restaurarFoco(r) {
    if (!r) return null;
    if (r.cursor) return colocarCursor(r.cursor.chave, r.cursor.pos, true) ? $('folha') : null;
    var el = acharF(r.f);
    if (!el) return null;
    if (el !== document.activeElement) el.focus({ preventScroll: true });
    if (r.s != null && el.setSelectionRange) { try { el.setSelectionRange(r.s, r.e); } catch (e) { /* ok */ } }
    return el;
  }
  function focar(f) {
    var el = acharF(f);
    if (el) el.focus({ preventScroll: true });
    return el && document.activeElement === el ? el : null;
  }

  function render() {
    var foco = capturarFoco();
    renderCategorias(); renderMascaras(); renderAchados(); renderFolha();
    return restaurarFoco(foco);

  function renderSoFolha() {

  // ---------- barra superior e máscaras ----------

  // ---------- painel por órgão: uma faixa por parágrafo da máscara ----------
  // Nome de reserva para blocos sem "nome" nos dados (pelo prefixo do id da 1a linha).
  var NOMES = {
    'tecnica': 'Técnica', 'figado': 'Fígado', 'vias-biliares': 'Vias biliares', 'vesicula': 'Vesícula biliar',
    'pancreas': 'Pâncreas', 'baco': 'Baço', 'rins': 'Rins', 'bexiga': 'Bexiga', 'linfonodos': 'Linfonodos',
    'liquido-livre': 'Líquido livre', 'alcas': 'Alças intestinais', 'fast': 'FAST', 'utero': 'Útero',
    'ovario-d': 'Ovário direito', 'ovario-e': 'Ovário esquerdo', 'fundo-de-saco': 'Fundo de saco', 'pelve': 'Pelve',
    'colo': 'Colo uterino', 'endometriose': 'Endometriose', 'saco-gestacional': 'Saco gestacional',
    'vesicula-vitelina': 'Vesícula vitelina', 'embriao': 'Embrião', 'liquido': 'Líquido amniótico',
    'ovarios': 'Ovários', 'feto': 'Feto', 'placenta': 'Placenta', 'prostata': 'Próstata',
    'vesiculas': 'Vesículas seminais', 'pele': 'Pele', 'axilas': 'Axilas', 'salivares': 'Glândulas salivares',
    'nodulos': 'Nódulos', 'tireoide': 'Tireoide', 'doppler': 'Doppler', 'enxerto': 'Enxerto renal',
    'biopsia': 'Biópsia', 'gestacao-multipla': 'Gestação múltipla', 'rim-d': 'Rim direito', 'rim-e': 'Rim esquerdo'
  };
  var estrutura = null;    // faixas da máscara atual; refeitas quando a máscara muda
  var abertos = {};        // id da faixa -> true ("mais" expandido; Outros/Limitações abertos)
  var timerDestaque = null;

  function capitalizar(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function rotuloBloco(b, grupos) {
    if (b.nome) return String(b.nome);
    var l0 = (b.linhas || [])[0];
    if (!l0) return '';
    var t = String(l0.texto || '').trim();
    if (M.ehRotulo(t) && t.indexOf('{{') < 0) {           // "Rim direito:", "MAMA DIREITA:"
      t = t.replace(/^-\s*/, '').replace(/:$/, '').trim();
      if (t && t === t.toUpperCase()) t = capitalizar(t.toLowerCase());
      if (t) return t;
    }
    var pre = String(l0.id || '').split('.')[0];
    if (NOMES[pre]) return NOMES[pre];
    var g = grupos.filter(function (x) { return x.id === pre; })[0];
    return g ? g.nome : capitalizar(pre.replace(/-/g, ' '));
  }

  function casaId(id, alvo) { return id === alvo || id.indexOf(alvo + '.') === 0; }

  // Blocos (índices em ordem) atingidos por um lugar: os que têm linha do substitui; senão, os que casam com apos.
  function blocosDoLugar(m, lugar) {
    var r = [];
    var juntar = function (pred) {
      m.blocos.forEach(function (b, bi) { if (r.indexOf(bi) < 0 && (b.linhas || []).some(pred)) r.push(bi); });
    };
    var subs = (lugar && lugar.substitui) || [];
    if (subs.length) juntar(function (l) { return subs.indexOf(l.id) >= 0; });
    if (!r.length && lugar && lugar.apos != null && lugar.apos !== '') juntar(function (l) { return casaId(l.id, lugar.apos); });
    return r;
  }

  function montarEstrutura() {
    var m = laudo.mascara(), chave = cat.id + '|' + m.id;
    if (estrutura && estrutura.chave === chave) return estrutura;
    abertos = {};
    var grupos = laudo.gruposVisiveis();
    var E = { chave: chave, faixas: [], porId: {}, porAchado: {}, linhaFaixa: {} };
    var blocos = m.blocos.map(function (b, bi) { return { id: 'b' + bi, nome: rotuloBloco(b, grupos), itens: [] }; });
    var outros = { id: 'outros', nome: 'Outros achados', itens: [], aux: true };
    var notas = { id: 'notas', nome: 'Limitações e observações', itens: [], aux: true };
    // Achado de formulário com "oculta": os achados antigos que ele substitui não aparecem nas
    // faixas (continuam nos dados e na busca; instâncias já marcadas continuam listadas).
    var ocultos = {};
    grupos.forEach(function (g) {
      g.achados.forEach(function (a) {
        if (M.formularioDe(a) && Array.isArray(a.oculta)) a.oculta.forEach(function (id) { ocultos[g.id + '/' + id] = true; });
      });
    });
    grupos.forEach(function (g) {
      g.achados.forEach(function (a) {
        var info = { padrao: 'outros', pe: null, chaves: null };
        E.porAchado[g.id + '/' + a.id] = info;
        var oculto = !!ocultos[g.id + '/' + a.id];
        var poe = function (f, k) { if (!oculto) f.itens.push({ g: g, a: a, k: k }); }; // oculto: só o lugar
        if (a.tipo === 'nota') { info.padrao = 'notas'; poe(notas, ''); return; }
        var pad = blocosDoLugar(m, a), alvos = [];
        if (a.porEscolha && typeof a.porEscolha === 'object') {
          info.pe = {}; info.chaves = [];
          Object.keys(a.porEscolha).forEach(function (k) {
            var kk = k.trim().toLowerCase();
            info.chaves.push(kk);
            var bs = blocosDoLugar(m, a.porEscolha[k]);
            if (!bs.length) return;
            info.pe[kk] = 'b' + bs[0];
            var ja = alvos.filter(function (x) { return x.b === bs[0]; })[0];
            if (ja) ja.k = '';   // duas opções no mesmo bloco: o lado fica por escolher
            else alvos.push({ b: bs[0], k: kk });
          });
        }
        if (!alvos.length && pad.length) alvos.push({ b: pad[0], k: '' });
        if (!alvos.length) { poe(outros, ''); return; }
        alvos.sort(function (x, y) { return x.b - y.b; });
        var noPad = pad.length && alvos.some(function (x) { return x.b === pad[0]; });
        info.padrao = 'b' + (noPad ? pad[0] : alvos[0].b);
        alvos.forEach(function (x) { poe(blocos[x.b], x.k); });
      });
    });
    // Formulário logo depois de "Normal"; depois os frequentes; depois o resto.
    var freqAntes = function (f) {
      var form = function (x) { return !!M.formularioDe(x.a); };
      f.itens = f.itens.filter(form)
        .concat(f.itens.filter(function (x) { return !form(x) && x.a.frequente; }))
        .concat(f.itens.filter(function (x) { return !form(x) && !x.a.frequente; }));
    };
    blocos.concat([outros, notas]).forEach(function (f) {
      if (!f.itens.length) return;   // bloco sem achado possível (técnica, medidas): fica de fora
      if (!f.aux) freqAntes(f);
      E.faixas.push(f); E.porId[f.id] = f;
    });
    m.blocos.forEach(function (b, bi) {
      (b.linhas || []).forEach(function (l) { if (E.porId['b' + bi]) E.linhaFaixa[l.id] = 'b' + bi; });
    });

  }

  // Lado escolhido numa instância com porEscolha (mesma regra do motor: 1o campo de escolha com valor que é chave).
  function ladoEscolhido(inst, info) {
    var r = laudo.buscar(inst.grupo, inst.achado);
    if (!r || !info || !info.chaves) return '';
    var def = M.formularioDe(r.achado);
    if (def) { // formulário: o dado indicado em "escolha" (ex.: lobo)
      var kf = def.escolha && inst.dados ? String(inst.dados[def.escolha] || '').trim().toLowerCase() : '';
      return info.chaves.indexOf(kf) >= 0 ? kf : '';
    }
    var prep = M.prepararVariante(r.achado.variantes[inst.variante] || r.achado.variantes[0]);
    var fontes = prep.linhas.concat(prep.hd);
    for (var i = 0; i < fontes.length; i++) {
      for (var j = 0; j < fontes[i].segs.length; j++) {
        var s = fontes[i].segs[j];
        if (s.t !== 'campo' || s.tipo !== 'escolha') continue;
        var v = inst.valores[s.chave];
        if (v == null || v === '') continue;
        var k = String(v).trim().toLowerCase();
        if (info.chaves.indexOf(k) >= 0) return k;
      }
    }
    return '';
  }

  function faixaDaInst(inst) {
    var info = montarEstrutura().porAchado[inst.grupo + '/' + inst.achado];
    if (!info) return null;
    var k = ladoEscolhido(inst, info);
    return k && info.pe[k] ? info.pe[k] : info.padrao;
  }

  // Marcado a partir da faixa de um lado: o campo de escolha já entra com a opção daquele lado.
  function preencherLado(uid, k) {
    var inst = uid && k ? laudo.instancia(uid) : null;

    for (var i = 0; i < fontes.length; i++) {

  function idForm(uid) { var i = laudo.instancia(uid), r = i && laudo.buscar(i.grupo, i.achado); return r ? r.achado.formulario : ''; }

      // destaque(dados): opção sugerida (fica marcada à parte; não é escolha)
      var sug = sec.destaque ? sec.destaque(d, inst.valores) : null;
      var attrsDe = function (o, on) {

  function copiarAntigo(html, txt) {
    var ok = false;
    var aoCopiar = function (e) {

      e.preventDefault();
      ok = true;
    };

    try { document.execCommand('copy'); } catch (e) { /* ok */ }
    document.removeEventListener('copy', aoCopiar, true);
    if (ok) return true;
    // último recurso: selecionar uma cópia formatada e copiar a seleção
    var div = document.createElement('div');
    div.setAttribute('contenteditable', 'true');
    div.style.cssText = 'position:fixed;left:-10000px;top:0;white-space:normal;background:#fff;color:#000';
    div.innerHTML = html;

  var timerBotao = null;

  function copiar() {

    if (sincronizar()) curarFolha();
    var c = laudo.compor(), html = M.html(c), txt = M.textoPuro(c);
    var fim = function (ok) {
      if (ok) {
        copiadoEm = hora();
        contarUso();
        botaoCopiar(true);

    }
  }

  function aoDigitarFolha(e) {
    var t = e.target;
    if (t.matches && t.matches('input.campo.valor')) {
      sincronizar();
      laudo.definirValor(t.getAttribute('data-escopo'), t.getAttribute('data-chave'), t.value);
      t.size = tamanho(t.value);
      renderSoFolha();
      return;
    }
    if (t !== $('folha') || e.isComposing || compondoIme) return;
    var tipo = e.inputType || '';
    if (tipo === 'historyUndo') desfazer.desfeitos++;
    else if (tipo === 'historyRedo') desfazer.desfeitos--;
    else { desfazer.bloqueado = false; desfazer.desfeitos = 0; }
    var torta = sincronizar();
    // Ctrl+Z voltou ao último desenho: mais para trás o navegador mexeria em nós que não existem mais.
    if (tipo === 'historyUndo' && linhasDom().every(function (el) { return assin.get(el) === assinDesenho.get(el); })) desfazer.bloqueado = true;
    if (torta) curarFolha();
  }

  // Enter, juntar linhas, apagar ou digitar sobre várias linhas: pelo motor. Dentro de uma linha:
  // o navegador digita (e o Ctrl+Z dele funciona); a sincronização leva ao motor.
  var NATIVOS = /^(insertText|insertReplacementText|insertCompositionText|delete(Content|Word|SoftLine|HardLine)(Backward|Forward)|deleteEntireSoftLine|deleteByCut|historyUndo|historyRedo)$/;
  function aoAntesDeDigitar(e) {
    if (e.target !== $('folha')) return; // campos de digitar cuidam de si
    var tipo = e.inputType || '';
    if (tipo === 'insertCompositionText' || e.isComposing) return;
    if (tipo === 'historyUndo') { if (desfazer.bloqueado) e.preventDefault(); return; }
    if (tipo === 'historyRedo') { if (desfazer.desfeitos <= 0) e.preventDefault(); return; }
    var s = selecao();
    if (!s) { e.preventDefault(); return; }
    var cur;
    if (tipo === 'insertParagraph' || tipo === 'insertLineBreak') {
      e.preventDefault();
      sincronizar();
      cur = s.colapsada ? s.ini : laudo.substituirTrecho(s.ini, s.fim, '');
      redesenharCom((cur && laudo.quebrarLinha(cur.chave, cur.pos)) || cur);
      return;
    }
    if (/^delete/.test(tipo)) {
      if (!s.colapsada) {
        if (!s.nativa) { e.preventDefault(); sincronizar(); redesenharCom(laudo.substituirTrecho(s.ini, s.fim, '')); }
        return;
      }
      var tras = /Backward$/.test(tipo);
      if (tras && s.ini.pos === 0) { e.preventDefault(); juntar(vizinha(s.ini.linha, -1), s.ini.linha); }
      else if (!tras && s.ini.pos >= unidades(s.ini.linha)) { e.preventDefault(); juntar(s.ini.linha, vizinha(s.ini.linha, 1)); }
      else if (!s.nativa) e.preventDefault();
      return;
    }
    if (tipo === 'insertText' || tipo === 'insertReplacementText') {
      var txt = e.data != null ? e.data : (e.dataTransfer ? e.dataTransfer.getData('text/plain') : '');
      if (!s.nativa) {
        e.preventDefault(); sincronizar();
        redesenharCom(laudo.substituirTrecho(s.ini, s.fim, txt || ''));
      }
      return;
    }
    if (!NATIVOS.test(tipo)) e.preventDefault(); // negrito, listas, soltar... (colar passa pelo evento paste)
  }

  function vizinha(linha, dir) {
    var ls = linhasEditaveis(), i = ls.indexOf(linha);
    return i < 0 ? null : ls[i + dir] || null;
  }
  function juntar(cima, baixo) {
    sincronizar();
    if (!cima || !baixo) return;
    var r = laudo.juntarLinhas(cima.getAttribute('data-chave'), baixo.getAttribute('data-chave'));
    if (r) redesenharCom(r);
  }

  // Colar: sempre texto puro; quebras de linha viram linhas.
  function aoColar(e) {
    var folha = $('folha'), t = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentNode);
    if (!t || !folha.contains(t) || t.closest('input, textarea')) return;
    e.preventDefault();
    var txt = ((e.clipboardData && e.clipboardData.getData('text/plain')) || '').replace(/\r\n?/g, '\n').replace(/​/g, '').replace(/\n+$/, '');
    var s = selecao();
    if (!txt || !s) return;
    if (txt.indexOf('\n') < 0 && s.nativa) {
      document.execCommand('insertText', false, txt); // pelo navegador: Ctrl+Z desfaz
      return;
    }
    sincronizar();
    redesenharCom(laudo.substituirTrecho(s.ini, s.fim, txt));
  }

  // Ctrl+C/Ctrl+X de um trecho: texto puro e HTML como a cópia inteira, campos pelos valores.
  function aoCopiarTrecho(e) {
    if (e.defaultPrevented || !cat) return; // "Copiar laudo" usa o próprio evento
    var folha = $('folha'), a = document.activeElement;
    if (a && a !== folha && folha.contains(a) && a.matches('input, textarea')) return;
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed) return;
    var r = sel.getRangeAt(0);
    if (!folha.contains(r.startContainer) || !folha.contains(r.endContainer)) return;
    if (sincronizar()) return;
    var s = selecao();
    if (!s || s.colapsada) return;
    var t = laudo.trecho(s.ini, s.fim);
    if (!t) return;
    e.clipboardData.setData('text/plain', t.texto);
    e.clipboardData.setData('text/html', t.html);
    e.preventDefault();
    if (e.type === 'cut') {
      if (s.nativa) setTimeout(function () { document.execCommand('delete'); }, 0);
      else redesenharCom(laudo.substituirTrecho(s.ini, s.fim, ''));
    }
  }

  function noDoCursor() {
    var s = window.getSelection();
    return s && s.rangeCount && $('folha').contains(s.anchorNode) ? s.anchorNode : null;
  }

  function aoTeclarFolha(e) {
    var t = e.target, folha = $('folha');
    if (e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.metaKey) {
      if (proximoPendente(t === folha ? (noDoCursor() || folha) : t, e.shiftKey)) e.preventDefault();
    } else if (e.key === 'Enter' && t.matches('input.campo.valor') && !e.ctrlKey && !e.metaKey) {
      e.preventDefault(); proximoPendente(t, false);
    } else if (e.key === 'Escape' && escolhaAberta) {
      var fid = escolhaAberta; escolhaAberta = null; renderFolha(); focar('c:' + fid);
    } else if (t === folha && (e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 'a' || e.key === 'A')) {
      e.preventDefault(); // Ctrl+A: só a folha
      var r = document.createRange(), s = window.getSelection();
      r.selectNodeContents(folha); s.removeAllRanges(); s.addRange(r);
    } else if (t === folha && (e.key === 'Backspace' || e.key === 'Delete') && !e.ctrlKey && !e.altKey) {
      // Passa por cima do caractere invisível junto dos campos: uma tecla apaga o que se vê.
      var sel = window.getSelection();
      if (!sel.isCollapsed || !sel.anchorNode || sel.anchorNode.nodeType !== 3) return;
      var n = sel.anchorNode, o = sel.anchorOffset;
      if (e.key === 'Backspace') { while (o > 0 && n.data.charAt(o - 1) === ZW) o--; }
      else { while (o < n.data.length && n.data.charAt(o) === ZW) o++; }
      if (o !== sel.anchorOffset) sel.collapse(n, o);
    }
  }

  function aoTeclarGlobal(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); copiar(); return; }
    var t = e.target, digitando = t && (t.matches('input, textarea, select') || t.isContentEditable);
    if (e.key === '/' && !digitando && !e.ctrlKey && !e.altKey && !e.metaKey) { e.preventDefault(); $('busca').focus(); $('busca').select(); }
  }

  function iniciar() {
    if (DADOS.length) {
      var c0 = DADOS.filter(function (c) { return c.id === prefs.categoria; })[0] || DADOS[0];
      var m0 = prefs.mascaras && prefs.mascaras[c0.id];
      abrirCategoria(c0.id, m0);
    }
    render();

    document.querySelector('.topo').addEventListener('click', aoClicarTopo);
    $('mascaras').addEventListener('click', aoClicarTopo);
    $('achados').addEventListener('click', aoClicarAchados);
    $('marcados').addEventListener('click', aoClicarAchados);
    $('rodape').addEventListener('click', function (e) {
      if (!e.target.closest('[data-acao="prox-pendente"]')) return;
      var r = document.querySelector(PENDENTE);
      if (r) focarCampo(r);
    });
    botaoCopiar(false);
    $('btnNovo').innerHTML = IC('novo', 17) + '<span>Novo laudo</span>';
    document.querySelector('.busca').insertAdjacentHTML('afterbegin', IC('buscar', 16));
    $('paciente').addEventListener('click', aoClicarPaciente);
    // formulário: medidas (campos do laudo, com a mesma conversão de unidade) e opções
    $('achados').addEventListener('input', function (e) {
      var t = e.target;
      if (!t.matches || !t.matches('input.fm-medida')) return;
      sincronizar();
      laudo.definirValor(t.getAttribute('data-uid'), t.getAttribute('data-chave'), t.value);
      renderSoFolha();
    });
    $('achados').addEventListener('change', function (e) {
      var t = e.target;
      if (!t.matches || !t.matches('input[data-acao="fm-config"]')) return;
      var f = t.getAttribute('data-form');
      prefs.formularios = prefs.formularios || {};
      prefs.formularios[f] = prefs.formularios[f] || {};
      prefs.formularios[f][t.getAttribute('data-op')] = t.checked;
      salvarPrefs();
      sincronizar();
      aplicarOpcoes();
      render();
    });
    var folha = $('folha');
    folha.addEventListener('click', aoClicarFolha);
    folha.addEventListener('input', aoDigitarFolha);
    folha.addEventListener('beforeinput', aoAntesDeDigitar);
    folha.addEventListener('keydown', aoTeclarFolha);
    folha.addEventListener('paste', aoColar);
    folha.addEventListener('compositionstart', function () { compondoIme = true; });
    folha.addEventListener('compositionend', function () { compondoIme = false; if (sincronizar()) curarFolha(); });
    // arrastar texto ou campos dentro da folha (ou soltar de fora) não vale: só digitar e colar
    folha.addEventListener('dragstart', function (e) { e.preventDefault(); });
    folha.addEventListener('dragover', function (e) { e.preventDefault(); });
    folha.addEventListener('drop', function (e) { e.preventDefault(); });
    document.addEventListener('copy', aoCopiarTrecho);
    document.addEventListener('cut', aoCopiarTrecho);
    document.addEventListener('keydown', aoTeclarGlobal);

    $('btnCopiar').addEventListener('click', copiar);
    $('btnNovo').addEventListener('click', function () {
      if (!cat) return;
      laudo.limpar(); zerarTela(); render();
    });
    $('busca').addEventListener('input', function () { busca = this.value; renderAchados(); });
    $('busca').addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { if (this.value) { this.value = ''; busca = ''; renderAchados(); } else this.blur(); e.preventDefault(); }
      else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
        var b = document.querySelector('#achados .achado-btn');
        if (b) { e.preventDefault(); b.click(); }
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();

</script>
</body>
</html>
