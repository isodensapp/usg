 segmento inferior do útero. Espessura placentária normal e grau {{*}} de maturidade (Grannum)."},{"id":"placenta.feto2","texto":"Placenta feto 2: de inserção {{*}} não estendendo-se até o segmento inferior do útero. Espessura placentária normal e grau {{*}} de maturidade."},{"id":"placenta.feto3","texto":"Placenta feto 3: de inserção {{*}} não estendendo-se até o segmento inferior do útero. Espessura placentária normal e grau {{*}} de maturidade."}]},{"linhas":[{"id":"liquido","texto":"Líquido amniótico em quantidade normal (ILA = {{*}} / Maior bolsão {{*}} cm)."}]}],"tituloConclusao":"HIPÓTESE DIAGNÓSTICA:\nAchados ultrassonográficos compatíveis com:","conclusaoNormal":["Gestação trigemelar com fetos vivos.","Idade gestacional de {{*}} semanas e {{*}} dia(s) (± {{*}} semanas) pelas biometrias fetais."]}],"grupos":[{"id":"limitacoes","nome":"Limitações e observações","achados":[{"id":"limitacao-subcutaneo","nome":"Limitação técnica (subcutâneo)","frequente":true,"tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Exame realizado com limitações técnicas e com diminuição de sua sensibilidade devido à dificuldade do feixe acústico em transpor satisfatoriamente o plano subcutâneo.","hd":[]}]},{"id":"gestacao-muito-precoce","nome":"Gestação muito precoce","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Gestações muito precoces com menos de 5 semanas podem não ser caracterizadas ao estudo ultrassonográfico, sugiro, a critério clínico, controle evolutivo ultrassonográfico.","hd":[]}]},{"id":"pormenores-anatomicos","nome":"Sem pormenores anatômicos","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: No exame ultrassonográfico obstétrico convencional não é rotina a observância de pormenores anatômicos, nem detalhes da formação fetal. A critério clínico correlacionar com estudo ecográfico e idade gestacional específica.","hd":[]}]},{"id":"objetivo-crescimento-vitalidade","nome":"Objetivo: crescimento e vitalidade","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: O objetivo do ultrassom obstétrico é avaliar o crescimento e vitalidade fetais. Não tem finalidade de rastreamento e diagnóstico de doenças genéticas e/ou malformações fetais.","hd":[]}]},{"id":"bhcg-previo","nome":"b-HCG prévio","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: Necessário b-HCG previamente ao estudo ultrassonográfico para aumentar-se com isso, a acurácia do método.","hd":[]}]},{"id":"urgencia","nome":"Exame de urgência","frequente":true,"tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Exame realizado em caráter de urgência.","hd":[]}]},{"id":"finalidade-obstetrica","nome":"Finalidade da obstétrica","frequente":true,"tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: A ultrassonografia obstétrica tem como finalidade a determinação do posicionamento fetal e da placenta, avaliação quantitativa do líquido amniótico e biometria fetal. O estudo da morfologia fetal é realizado na ultrassonografia morfológica.","hd":[]}]},{"id":"malformacoes-morfologico","nome":"Malformações não detectadas","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Mesmo ao ultrassom morfológico, cerca de 15% das malformações podem não ser detectadas intra-útero.","hd":[]}]},{"id":"correlacao-clinico-laboratorial","nome":"Correlação clínico-laboratorial","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Os achados dependem da adequada correlação clínico-laboratorial.","hd":[]}]},{"id":"migracao-placentaria","nome":"Controle da migração placentária","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Sugiro a critério clínico, controle ultrassonográfico da localização placentária após idade gestacional de 24/28 semanas, para acompanhar o fenômeno de migração placentária.","hd":[]}]}]},{"id":"primeiro-trimestre","nome":"Primeiro trimestre","mascaras":["obstetrica-inicial-tv","obstetrica-inicial-abdominal","gemelar-inicial-tv"],"achados":[{"id":"abortamento-em-curso","nome":"Abortamento em curso","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce"],"apos":"saco-gestacional","variantes":[{"nome":"Com conteúdo hemático","texto":"Cavidade uterina ocupada por material heterogêneo, predominantemente hiperecogênico, sem fluxo ao estudo Doppler, medindo até {{*}} cm de espessura, podendo corresponder a conteúdo hemático/coágulos, caracterizando ainda saco gestacional na cavidade uterina, deslocado, em topografia ístmica, de contornos irregulares, medindo {{*}} cm (diâmetro médio {{*}} cm). Formação ecogênica no interior do saco gestacional, medindo {{*}} cm no maior eixo, sugerindo eco embrionário.","hd":["Sinais ultrassonográficos de abortamento em curso, na dependência de correlação com dados clínicos."]},{"nome":"Com hematoma retrocoriônico","texto":"Saco gestacional na cavidade uterina, deslocado, em topografia ístmica, de contornos irregulares, medindo {{*}} cm (diâmetro médio {{*}} cm ). Nota-se formação laminar, hipoecogênica, de contornos irregulares, sem fluxo ao estudo Doppler, adjacente à parede inferior do saco gestacional, ocupando cerca de {{*}} % do mesmo, sugerindo hematoma retrocoriônico.\nFormação ecogênica no interior do saco gestacional, medindo {{*}} mm no maior eixo, sugerindo eco embrionário. Movimentos embrionários e batimentos cardíacos ausentes. Vesícula vitelina não caracterizada.","hd":["Sinais ultrassonográficos de abortamento em curso, na dependência de correlação com dados clínicos."]}]},{"id":"corpo-luteo","nome":"Corpo lúteo","frequente":true,"substitui":[],"apos":"ovarios","variantes":[{"texto":"Cisto de paredes espessas e {{regulares|anfractuosas}}, apresentando conteúdo hipoecogênico e halo ecogênico, medindo {{*}} x {{*}} cm, que ao estudo complementar com Doppler apresenta vascularização periférica, sendo de provável etiologia funcional (corpo lúteo).","hd":["Formação cística localizada no ovário {{direito|esquerdo}} sugestiva de corpo lúteo."]}]},{"id":"doenca-trofoblastica","nome":"Doença trofoblástica gestacional","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido"],"apos":"utero","variantes":[{"texto":"Cavidade uterina preenchida por material heterogêneo, predominantemente ecogênico com diminutas áreas císticas de permeio, de aspecto vesicular, caracterizando o sinal de \"flocos de neve\", sem sinais de componentes ósseos, medindo {{*}} cm e volume estimado de {{*}} cm³. Planos de clivagem aparentemente bem definidos entre a cavidade endometrial e a parede anterior do miométrio. Parede posterior do miométrio de difícil avaliação ecográfica devido a atenuação dos feixes sonoros posteriores.","hd":["Material heterogêneo na cavidade uterina, podendo corresponder à doença trofoblástica gestacional."]}]},{"id":"ectopica-massa","nome":"Ectópica: massa anexial","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido","fundo-de-saco"],"apos":"ovarios","variantes":[{"texto":"Formação cístico-sólida, na região anexial {{direita|esquerda}}, de contornos lobulados, com septos espessos e moderados debris de permeio, sem fluxo ao estudo complementar com Doppler, medindo {{*}} x {{*}} x {{*}} cm e volume estimado de {{*}} cm³.\nModerada quantidade de líquido livre de aspecto anecóide, com moderados debris e traves de permeio, se estendendo do fundo de saco posterior até espaços hepato e espleno-renais.","hd":["Não foram caracterizados embrião ou saco gestacional na cavidade uterina.","Moderada quantidade de líquido intraperitoneal, sugerindo sangue/coágulos.","Formação heterogênea na região anexial à {{direita|esquerda}}. Considerar possibilidade de gestação ectópica rota."]}]},{"id":"ectopica-rota-ou-cisto-hemorragico","nome":"Ectópica rota ou cisto hemorrágico","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido","fundo-de-saco"],"apos":"ovarios","variantes":[{"texto":"Formação cístico-sólida, na região anexial {{direita|esquerda}}, adjacente ao ovário, impossibilitando a precisa distinção pelo método ecográfico, de contornos irregulares com septos espessos e moderados debris de permeio, sem fluxo ao estudo Doppler, medindo {{*}} x {{*}} x {{*}} cm, e volume estimado de {{*}} cm³. Moderada quantidade de líquido livre de aspecto anecóide, com moderados debris e septações finas de permeio, se estendendo do fundo de saco posterior até espaços hepato e espleno-renais.","hd":["Não foram caracterizados embrião ou saco gestacional na cavidade uterina.","Moderada quantidade de líquido intraperitoneal, sugerindo sangue/coágulos.","Formação heterogênea anexial à {{direita|esquerda}}. Considerar possibilidade de gestação ectópica rota ou cisto hemorrágico roto."]}]},{"id":"ectopica-anel-tubario","nome":"Ectópica: anel tubário","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido"],"apos":"ovarios","variantes":[{"texto":"Na região anexial {{direita|esquerda}}, caracteriza-se formação em \"anel tubário\", arredondada, de contornos bem definidos e regulares, medindo {{*}} x {{*}} x {{*}} cm, com paredes espessas hipoecogênicas e fluxo ao estudo complementar com Doppler, ocupando cerca de 1/3 da circunferência. Apresenta no interior, formação compatível com saco gestacional ectópico, de contornos regulares e medindo {{*}} cm (diâmetro médio {{*}} cm), com vesícula vitelina presente, medindo {{*}} cm. Embrião não caracterizado.","hd":["Não foram caracterizados embrião ou saco gestacional na cavidade uterina.","Gestação ectópica tubária à {{direita|esquerda}}."]}]},{"id":"ectopica-anel-ou-cisto","nome":"Anel tubário ou cisto ovariano","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido"],"apos":"ovarios","variantes":[{"texto":"Na região anexial {{direita|esquerda}}, caracteriza-se formação cística, arredondada, adjacente ao ovário, impossibilitando a precisa distinção pelo método ecográfico, de contornos bem definidos e regulares, com paredes espessas, hipoecogênicas e fluxo ao estudo Doppler ocupando cerca de 1/3 da circunferência, medindo {{*}} x {{*}} x {{*}} cm, e volume estimado de {{*}} cm³. Área cística central mede {{*}} cm (diâmetro médio {{*}} cm). Ausência de sinais de vesícula vitelina ou embrião.","hd":["Não foram caracterizados embrião ou saco gestacional na cavidade uterina.","Formação cística anexial à {{direita|esquerda}}. Considerar possibilidade de gestação ectópica ou cisto ovariano/corpo lúteo."]}]},{"id":"ectopica-bce-positivo","nome":"Ectópica com BCE positivo","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido"],"apos":"ovarios","variantes":[{"texto":"Nota-se na região anexial {{direita|esquerda}}, formação arredondada, de contornos bem definidos e regulares, medindo {{*}} cm, com paredes espessas hipoecogênicas e fluxo ao estudo complementar com Doppler, ocupando cerca de 1/3 da circunferência. Apresenta no interior formação compatível com saco gestacional ectópico de contornos regulares e medindo {{*}} cm (diâmetro médio {{*}} cm), com vesícula vitelina presente, medindo {{*}} cm e embrião único com comprimento cabeça-nádega (CCN) medindo {{*}} mm. Movimentos embrionários e batimentos cardíacos presentes (BCE = {{*}} bpm).","hd":["Não foram caracterizados embrião ou saco gestacional na cavidade uterina.","Gestação ectópica tubária à {{direita|esquerda}} com embrião único e vivo.","Idade gestacional de {{*}} semanas e {{*}} dia(s) (± 5 dias) pelo CCN."]}]},{"id":"gestacao-anembrionada","nome":"Gestação anembrionada","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce"],"apos":"saco-gestacional","variantes":[{"texto":"Saco gestacional tópico, implantado na região fúndica, com contornos irregulares, medindo {{*}} cm (diâmetro médio: {{*}} cm), não sendo caracterizado embrião no presente estudo.","hd":["Achados sugestivos de gestação anembrionada."]}]},{"id":"evolucao-desfavoravel","nome":"Evolução desfavorável","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce"],"apos":"saco-gestacional","variantes":[{"texto":"Saco gestacional tópico, implantado na região fúndica, com contornos irregulares, medindo {{*}} mm (diâmetro médio: {{*}} cm), apresentando vesícula vitelínica hiperecogênica, medindo >6,0 mm (hidrópica), e formação convexa, polipoide, com invaginação de tecido coriônico para o interior da cavidade amniótica \"bump coriônico\". Embrião único com comprimento cabeça-nádega (CCN) medindo {{*}} mm. Movimentos embrionários presentes, associado a bradicardia embrionária (\u003c90/100bpm).","hd":["Gestação tópica, com feto único e vivo, apresentando critérios de evolução desfavorável.","Idade gestacional de {{*}} semanas e {{*}} dia(s) (± 5 dias) pelo CCN."]}]},{"id":"gestacao-ectopica","nome":"Gestação ectópica","substitui":["saco-gestacional","hematoma-retrocorionico","vesicula-vitelina","embriao.ccn","embriao.bce","liquido"],"apos":"ovarios","variantes":[{"texto":"Caracteriza-se na região anexial {{direita|esquerda}}, formação arredondada, de contornos bem definidos e regulares, medindo {{*}} cm, com paredes espessas hipoecogênicas e fluxo ao Doppler ocupando cerca de 1/3 da circunferência. Apresenta no interior formação compatível com saco gestacional ectópico de contornos regulares, medindo {{*}} cm (diâmetro médio {{*}} cm), vesícula vitelina presente medindo {{*}} cm, e embrião único com comprimento cabeça-nádega (CCN) medindo {{*}} mm. Movimentos embrionários e batimentos cardíacos presentes (BCE = {{*}} bpm).","hd":["Não foram caracterizados embrião ou saco gestacional na cavidade uterina.","Gestação ectópica tubária à {{direita|esquerda}} com embrião único e vivo.","Idade gestacional de {{*}} semanas e {{*}} dia(s) (± 5 dias) pelo CCN."]}]},{"id":"hematoma-retro       if (m[1] === '*') segs.push({ t: 'campo', tipo: 'valor' });

  function chaveEscolha(opcoes) { return 'e:' + opcoes.slice().sort().join('|'); }

  function normalizar(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  }

  // Texto de um campo sem valor, como na origem.
  function vazio(seg) { return seg.tipo === 'valor' ? '*' : seg.opcoes.join('/'); }

    var r = '';
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      r += s.t === 'txt' ? s.v : (s.valor != null && s.valor !== '' ? s.valor : vazio(s));

  // Campos de uma variante: {{*}} numerados (v0, v1...) na ordem texto -> hd;

    var alvo = escopo === 'mascara' ? this.estado.valoresMascara : (this.instancia(escopo) || {}).valores;
    if (!alvo) return;
    if (valor == null || valor === '') delete alvo[chave]; else alvo[chave] = String(valor);
    // Lado com gênero diferente no mesmo achado ("direito" no texto, "direita" no hd):
    // escolher num campo preenche os outros que só diferem na terminação.
    var inst = escopo === 'mascara' ? null : this.instancia(escopo), r = inst && this.buscar(inst.grupo, inst.achado);
    if (!r || chave.indexOf('e:') !== 0) return;
    var raiz = function (x) { return normalizar(x).replace(/[oa]s?$/, ''); };
    var conj = function (ops) { return ops.map(raiz).sort().join('|'); };
    var meu = conj(chave.slice(2).split('|')), prep = prepararVariante(r.achado.variantes[inst.variante]);
    prep.linhas.concat(prep.hd).forEach(function (l) {
      l.segs.forEach(function (s) {
        if (s.t !== 'campo' || s.tipo !== 'escolha' || s.chave === chave || conj(s.opcoes) !== meu) return;
        var par = s.opcoes.filter(function (o) { return raiz(o) === raiz(valor); })[0];
        if (valor == null || valor === '') delete alvo[s.chave]; else if (par) alvo[s.chave] = par;
      });
    });
  };

  P.valor = function (escopo, chave) {
    var alvo = escopo === 'mascara' ? this.estado.valoresMascara : (this.instancia(escopo) || {}).valores;
    return alvo && alvo[chave] != null ? alvo[chave] : null;
  };

  // Troca de máscara na mesma categoria: mantém os achados que continuam visíveis.
  P.trocarMascara = function (mascaraId) {
    if (!this.cat.mascaras.some(function (m) { return m.id === mascaraId; })) return;
    this.estado.mascara = mascaraId;
    var self = this;
    this.estado.achados = this.estado.achados.filter(function (i) {
      var r = self.buscar(i.grupo, i.achado);
      return r && grupoVisivel(r.grupo, mascaraId);
    });
    this._podar();
  };

  P.editarLinha = function (chave, texto) {
    var l = this._linhas(false)[chave];
    if (!l || l.editavel === false) return false;
    this.estado.edicoes[chave] = { texto: String(texto), base: l.base };
    return true;
  };

  P.desfazerEdicao = function (chave) { delete this.estado.edicoes[chave]; };

  P.definirTextoExtra = function (s) { this.estado.textoExtra = String(s || ''); };
  P.definirConclusaoExtra = function (s) { this.estado.conclusaoExtra = String(s || ''); };

  // "Novo laudo": limpa tudo, mantém a máscara.
  P.limpar = function () { this.estado = estadoVazio(this.estado.mascara); };

  // Edição de linha vale enquanto a linha existir com o mesmo texto de origem.
  P._podar = function () {
    var linhas = this._linhas(false), ed = this.estado.edicoes;
    Object.keys(ed).forEach(function (k) { if (!linhas[k] || linhas[k].base !== ed[k].base) delete ed[k]; });
  };

  P._linhas = function (comEdicoes) {
    var mapa = {}, c = this._compor(comEdicoes);
    [c.titulo].concat.apply([c.titulo], c.paragrafos.map(function (p) { return p.linhas; })).forEach(function (l) { mapa[l.chave] = l; });
    return mapa;
  };

  P.compor = function () { return this._compor(true); };

  P._compor = function (comEdicoes) {
    var E = this.estado, m = this.mascara(), self = this;

    function linhaMascara(id, texto) {
      return { chave: 'L:' + id, base: texto, segs: segsMascara(texto, id), alterada: false, origem: null, tipo: 'mascara', ocupa: [id] };
    }

    var titulo = { chave: 'T', base: m.titulo, segs: segsMascara(m.titulo, 'titulo'), alterada: false, origem: null, tipo: 'titulo', negrito: true };
    var blocos = m.blocos.map(function (b) { return { tipo: 'corpo', linhas: b.linhas.map(function (l) { return linhaMascara(l.id, l.texto); }) }; });
    var ordem = {};
    var n = 0;
    m.blocos.forEach(function (b) { b.linhas.forEach(function (l) { ordem[l.id] = n++; }); });

    function achar(pred) {
      var r = null;
      blocos.forEach(function (b, bi) { b.linhas.forEach(function (l, li) { if (pred(l)) r = { b: bi, i: li }; }); });
      return r;
    }
    function posicao(entrada) {
      for (var bi = 0; bi < blocos.length; bi++) {
        var li = blocos[bi].linhas.indexOf(entrada);
        if (li >= 0) return { b: bi, i: li };
      }
      return null;
    }
    function inserirApos(p, novas) {
      var args = [p.i + 1, 0].concat(novas);
      Array.prototype.splice.apply(blocos[p.b].linhas, args);
    }

    var ancora = {};   // id de linha da máscara -> última entrada de achado que ocupa esse lugar
    var soltos = [];   // parágrafos próprios (achado sem lugar na máscara)
    var notas = [];
    var hdInst = [];   // instâncias não-nota, na ordem, com hd preparado

    E.achados.forEach(function (inst) {
      var r = self.buscar(inst.grupo, inst.achado);
      if (!r || !grupoVisivel(r.grupo, E.mascara)) return;
      var a = r.achado, v = a.variantes[inst.variante] || a.variantes[0];
      var prep = prepararVariante(v);
      var novas = prep.linhas.map(function (l, i) {
        return { chave: (a.tipo === 'nota' ? 'O:' : 'A:') + inst.uid + ':' + i, base: l.base, segs: escopar(l.segs, inst.uid), alterada: true, origem: inst.uid, tipo: a.tipo === 'nota' ? 'nota' : 'achado', ocupa: [] };
      });
      if (a.tipo === 'nota') { notas.push.apply(notas, novas); return; }
      hdInst.push({ inst: inst, hd: prep.hd });

      var lugar = lugarDe(a, prep, inst);
      var subs = (lugar.substitui || []).filter(function (id) { return id in ordem; })
        .sort(function (x, y) { return ordem[x] - ordem[y]; });
      var ultima = novas[novas.length - 1];
      if (subs.length) {
        var primeiro = subs[0];
        var orig = achar(function (l) { return l.tipo === 'mascara' && l.ocupa[0] === primeiro; });
        var tomadas = [primeiro];
        if (orig) {
          Array.prototype.splice.apply(blocos[orig.b].linhas, [orig.i, 1].concat(novas));
        } else {
          var p = ancora[primeiro] ? posicao(ancora[primeiro]) : null;
          if (p) inserirApos(p, novas); else { soltos.push({ tipo: 'corpo', linhas: novas }); }
        }
        ancora[primeiro] = ultima;
        subs.slice(1).forEach(function (id) {
          var o = achar(function (l) { return l.tipo === 'mascara' && l.ocupa[0] === id; });
          if (o) { blocos[o.b].linhas.splice(o.i, 1); ancora[id] = ultima; tomadas.push(id); }
        });
        novas.forEach(function (x) { x.ocupa = tomadas.slice(); });
      } else if (lugar.apos != null && lugar.apos !== '') {
        var alvo = lugar.apos;
        var casa = function (id) { return id === alvo || id.indexOf(alvo + '.') === 0; };
        var pa = achar(function (l) { return l.ocupa && l.ocupa.some(casa); });
        if (pa) {
          var ocupa = blocos[pa.b].linhas[pa.i].ocupa.slice();
          novas.forEach(function (x) { x.ocupa = ocupa; });
          inserirApos(pa, novas);
        } else soltos.push({ tipo: 'corpo', linhas: novas });
      } else {
        soltos.push({ tipo: 'corpo', linhas: novas });
      }
    });

    var paragrafos = blocos.filter(function (b) { return b.linhas.length; }).concat(soltos);

    if (E.textoExtra.trim()) {
      paragrafos.push({ tipo: 'corpo', linhas: E.textoExtra.replace(/\s+$/, '').split('\n').map(function (t, i) {
        return { chave: 'X:' + i, base: t, segs: [{ t: 'txt', v: t }], alterada: true, origem: null, tipo: 'extra', editavel: false };
      }) });
    }

    // Conclusão
    var conc = [];
    if (m.tituloConclusao) conc.push({ chave: 'CT', base: m.tituloConclusao, segs: segsMascara(m.tituloConclusao, 'conclusao'), alterada: false, origem: null, tipo: 'tituloConclusao', negrito: true });
    var temHd = hdInst.some(function (x) { return x.hd.length; });
    if (temHd) {
      var vistos = {};
      hdInst.forEach(function (x) {
        x.hd.forEach(function (h, j) {
          var segs = escopar(h.segs, x.inst.uid);
          preencher(segs, self);
          var t = textoSegs(segs);
          if (vistos[t]) return;
          vistos[t] = true;
          conc.push({ chave: 'H:' + x.inst.uid + ':' + j, base: '- ' + h.base, segs: [{ t: 'txt', v: '- ' }].concat(segs), alterada: true, origem: x.inst.uid, tipo: 'hd' });
        });
      });
    } else {
      m.conclusaoNormal.forEach(function (t, i) {
        conc.push({ chave: 'N:' + i, base: '- ' + t, segs: [{ t: 'txt', v: '- ' }].concat(segsMascara(t, 'normal' + i)), alterada: false, origem: null, tipo: 'normal' });
      });
    }
    if (E.conclusaoExtra.trim()) {
      E.conclusaoExtra.replace(/\s+$/, '').split('\n').filter(function (t) { return t.trim(); }).forEach(function (t, i) {
        var s = '- ' + t.replace(/^\s*-\s*/, '');
        conc.push({ chave: 'XC:' + i, base: s, segs: [{ t: 'txt', v: s }], alterada: true, origem: null, tipo: 'extra', editavel: false });
      });
    }
    if (conc.length) paragrafos.push({ tipo: 'conclusao', linhas: conc });
    if (notas.length) paragrafos.push({ tipo: 'notas', linhas: notas });

    // Valores, edições, pendências
    var todas = [titulo];
    paragrafos.forEach(function (p) { todas.push.apply(todas, p.linhas); });
    var pend = {}, ordemPend = [];
    todas.forEach(function (l) {
      var ed = comEdicoes && l.editavel !== false && E.edicoes[l.chave];
      if (ed && ed.base === l.base) {
        l.editada = true;
        l.segs = [{ t: 'txt', v: ed.texto }];
        return;
      }
      l.editada = false;
      preencher(l.segs, self);
      l.segs.forEach(function (s) {
        if (s.t === 'campo' && s.pendente) {
          var k = s.escopo + '|' + s.chave;
          if (!pend[k]) { pend[k] = true; ordemPend.push({ escopo: s.escopo, chave: s.chave }); }
        }
      });
    });
    todas.forEach(function (l) {
      delete l.ocupa;
      if (!l.negrito && ehRotulo(textoSegs(l.segs))) { l.negrito = true; l.rotulo = true; }
    });

    return { titulo: titulo, paragrafos: paragrafos, pendencias: ordemPend.length, camposPendentes: ordemPend };
  };

  // porEscolha: o primeiro campo de escolha do texto e depois do hd (na ordem) cujo valor escolhido
  // é chave de porEscolha (sem maiúsculas) define substitui/apos desta instância.
  function lugarDe(a, prep, inst) {
    var padrao = { substitui: a.substitui || [], apos: a.apos };
    var pe = a.porEscolha;
    if (!pe || typeof pe !== 'object') return padrao;
    var chaves = {};
    Object.keys(pe).forEach(function (k) { chaves[k.trim().toLowerCase()] = pe[k]; });
    var fontes = prep.linhas.concat(prep.hd); // campos do texto, depois dos itens do hd
    for (var i = 0; i < fontes.length; i++) {
      var segs = fontes[i].segs;
      for (var j = 0; j < segs.length; j++) {
        var s = segs[j];
        if (s.t !== 'campo' || s.tipo !== 'escolha') continue;
        var v = inst.valores[s.chave];
        if (v == null || v === '') continue;
        var r = chaves[String(v).trim().toLowerCase()];
        if (r) return { substitui: r.substitui || [], apos: r.apos };
      }
    }
    return padrao;
  }

  function escopar(segs, escopo) {
    return segs.map(function (s) {
      return s.t === 'campo' ? { t: 'campo', tipo: s.tipo, opcoes: s.opcoes, chave: s.chave, escopo: escopo } : { t: 'txt', v: s.v };
    });
  }

  function preencher(segs, laudo) {
    segs.forEach(function (s) {
      if (s.t !== 'campo') return;
      if (!s.escopo) s.escopo = 'mascara';
      var v = laudo.valor(s.escopo, s.chave);
      s.valor = v;
      s.pendente = v == null || v === '';
    });
  }

  // ---------- Saídas ----------

  function textoLinha(l) { return textoSegs(l.segs); }

  function textoPuro(c) {
    var partes = [textoLinha(c.titulo)];
    c.paragrafos.forEach(function (p) {
      partes.push(p.linhas.map(textoLinha).filter(function (t) { return t.trim() !== ''; }).join('\n'));
    });
    return partes.filter(function (t) { return t.trim() !== ''; }).join('\n\n');
  }

  var FONTE = 'font-family:Calibri,Carlito,sans-serif;';
  function html(c) {
    function linhaHtml(l) {
      var h = escHtml(textoLinha(l)).replace(/\n/g, '<br>');
      return l.negrito ? '<b>' + h + '</b>' : h;
    }
    // Um bloco só, com <br> entre linhas e linha em branco entre parágrafos: é o que
    // editores de laudo na web preservam (margens de <p> costumam ser descartadas ao colar).
    function par(linhas, tam) {
      var corpo = linhas.filter(function (l) { return textoLinha(l).trim() !== ''; }).map(linhaHtml).join('<br>');
      return corpo ? '<span style="' + FONTE + 'font-size:' + tam + '">' + corpo + '</span>' : '';
    }

    return '<div style="' + FONTE + 'font-size:11pt">' + partes.filter(Boolean).join('<br><br>') + '</div>';
  }

  P.textoPuro = function () { return textoPuro(this.compor()); };
  P.html = function () { return html(this.compor()); };

  return {
    Laudo: Laudo,
    novoLaudo: function (cat, mascaraId) { return new Laudo(cat, mascaraId); },
    parseTemplate: parseTemplate,
    prepararVariante: prepararVariante,
    normalizar: normalizar,
    textoLinha: textoLinha,
    textoSegs: textoSegs,
    textoPuro: textoPuro,
    html: html,
    grupoVisivel: grupoVisivel,
    ehRotulo: ehRotulo,
    escHtml: escHtml
  };
});

<script>
/* Isodens USG - interface. Depende de USGMotor (motor.js) e window.USG_DADOS. */
(function () {
  'use strict';
  var M = window.USGMotor;
  var DADOS = window.USG_DADOS || [];
  var esc = M.escHtml;
  var $ = function (id) { return document.getElementById(id); };
  var CHAVE_PREFS = 'isodens-usg:prefs';
  var LAPIS = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M11.3 2.3a1 1 0 0 1 1.4 0l1 1a1 1 0 0 1 0 1.4L5.5 12.9 2.5 13.5l.6-3z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';

  var prefs = lerPrefs();
  var cat = null, laudo = null;
  var busca = '';
  var escolhaAberta = null; // id do campo de escolha reaberto para troca
  var editando = null;      // { chave, texto }
  var copiadoEm = null;
  var timerAviso = null;

  // ---------- preferências (só preferências; nada do laudo) ----------
  function lerPrefs() {
    try { var p = JSON.parse(localStorage.getItem(CHAVE_PREFS) || '{}'); return p && typeof p === 'object' ? p : {}; }
    catch (e) { return {}; }
  }
  function salvarPrefs() { try { localStorage.setItem(CHAVE_PREFS, JSON.stringify(prefs)); } catch (e) { /* sem armazenamento */ } }
  function recolhidos() {
    prefs.recolhidos = prefs.recolhidos || {};
    if (!Array.isArray(prefs.recolhidos[cat.id])) prefs.recolhidos[cat.id] = [];
    return prefs.recolhidos[cat.id];
  }
  function lembrarMascara() {
    prefs.categoria = cat.id;
    prefs.mascaras = prefs.mascaras || {};
    prefs.mascaras[cat.id] = laudo.estado.mascara;
    salvarPrefs();
  }

  // ---------- estado de tela ----------
  function abrirCategoria(id, mascaraId) {
    cat = DADOS.filter(function (c) { return c.id === id; })[0] || DADOS[0];
    laudo = M.novoLaudo(cat, mascaraId);
    lembrarMascara();
    zerarTela();
  }
  function zerarTela() {
    busca = ''; $('busca').value = '';
    escolhaAberta = null; editando = null; copiadoEm = null;
    $('textoExtra').value = ''; $('conclusaoExtra').value = '';
    $('rolagemFolha').scrollTop = 0; $('achados').scrollTop = 0;
  }

  // ---------- foco preservado entre renderizações ----------
  function acharF(f) {
    var els = document.querySelectorAll('[data-f]');
    for (var i = 0; i < els.length; i++) if (els[i].getAttribute('data-f') === f) return els[i];
    return null;
  }
  function capturarFoco() {
    var a = document.activeElement;
    var f = a && a.getAttribute && a.getAttribute('data-f');
    if (!f) return null;
    var r = { f: f };
    try { if (typeof a.selectionStart === 'number') { r.s = a.selectionStart; r.e = a.selectionEnd; } } catch (e) { /* tipo sem seleção */ }
    return r;
  }
  function restaurarFoco(r) {
    if (!r) return null;
    var el = acharF(r.f);
    if (!el) return null;
    if (el !== document.activeElement) el.focus({ preventScroll: true });
    if (r.s != null && el.setSelectionRange) { try { el.setSelectionRange(r.s, r.e); } catch (e) { /* ok */ } }
    return el;
  }
  function focar(f) {
    var el = acharF(f);
    if (el) el.focus({ preventScroll: true });
    return el && document.activeElement === el ? el : null;
  }
  function focarLinha(chave) { return focar('des:' + chave) || focar('lap:' + chave); }

  function render() {
    var foco = capturarFoco();
    renderCategorias(); renderMascaras(); renderAchados(); renderFolha();
    return restaurarFoco(foco);
  }
  function renderSoFolha() {
    var foco = capturarFoco();
    renderFolha(); renderAchados();
    return restaurarFoco(foco);
  }

  // ---------- barra superior e máscaras ----------
  function renderCategorias() {
    $('categorias').innerHTML = DADOS.map(function (c) {
      return '<button type="button" class="aba" data-acao="categoria" data-id="' + esc(c.id) + '" data-f="cat:' + esc(c.id) + '" aria-pressed="' + (c === cat) + '">' + esc(c.nome) + '</button>';
    }).join('');
  }
  function renderMascaras() {
    $('mascaras').innerHTML = cat ? cat.mascaras.map(function (m) {
      return '<button type="button" class="mascara" data-acao="mascara" data-id="' + esc(m.id) + '" data-f="masc:' + esc(m.id) + '" aria-pressed="' + (m.id === laudo.estado.mascara) + '">' + esc(m.nome) + '</button>';
    }).join('') : '';
  }

  // ---------- achados ----------
  function renderAchados() {
    if (!cat) { $('achados').innerHTML = ''; return; }
    var lim = function (g) { return /^limitac/.test(g.id) ? 1 : 0; };
    // Limitações e observações por último: os achados dos órgãos vêm primeiro.
    var grupos = laudo.gruposVisiveis().slice().sort(function (x, y) { return lim(x) - lim(y); });
    var q = M.normalizar(busca);
    var termos = q ? q.split(/\s+/) : [];
    var casa = function (a) { var n = M.normalizar(a.nome); return termos.every(function (t) { return n.indexOf(t) >= 0; }); };
    var rec = recolhidos();
    var h = '';
    if (!termos.length) {
      var freq = [], nf = 0;
      grupos.forEach(function (g) {
        g.achados.forEach(function (a) {
          if (a.frequente) { freq.push({ g: g, a: a }); nf += laudo.instancias(g.id, a.id).length; }
        });
      });
      if (freq.length) h += secao('__freq', 'Frequentes', freq, rec.indexOf('__freq') >= 0, nf);
    }
    grupos.forEach(function (g) {
      var itens = g.achados.filter(function (a) { return !termos.length || casa(a); }).map(function (a) { return { g: g, a: a }; });
      if (!itens.length) return;
      h += secao(g.id, g.nome, itens, !termos.length && rec.indexOf(g.id) >= 0, laudo.contarMarcados(g.id));
    });
    if (!h) h = '<p class="vazio">Nenhum achado encontrado.</p>';
    $('achados').innerHTML = h;
  }

  function secao(id, nome, itens, fechado, n) {
    var corpo = fechado ? '' : '<div class="itens">' + itens.map(function (x) { return itemAchado(id, x.g, x.a); }).join('') + '</div>';
    return '<section class="grupo' + (fechado ? ' fechado' : '') + '">' +
      '<h3 class="grupo-titulo"><button type="button" class="grupo-cab" data-acao="recolher" data-id="' + esc(id) + '" data-f="cab:' + esc(id) + '" aria-expanded="' + !fechado + '">' +
      '<span class="seta" aria-hidden="true"></span><span class="gnome">' + esc(nome) + '</span>' +
      (n ? '<span class="cont" title="marcados">' + n + '</span>' : '') + '</button></h3>' + corpo + '</section>';
  }

  function itemAchado(sec, g, a) {
    var insts = laudo.instancias(g.id, a.id), on = insts.length > 0;
    var base = sec + '|' + g.id + '/' + a.id;
    var dg = ' data-g="' + esc(g.id) + '" data-a="' + esc(a.id) + '"';
    var h = '<div class="achado' + (on ? ' on' : '') + (a.tipo === 'nota' ? ' nota' : '') + '">' +
      '<button type="button" class="achado-btn" data-acao="alternar"' + dg + ' data-f="ach:' + esc(base) + '" aria-pressed="' + on + '">' +
      '<span class="nome">' + esc(a.nome) + '</span>' + (insts.length > 1 ? '<span class="cont">' + insts.length + '</span>' : '') + '</button>';
    if (on) {
      h += '<div class="insts">';
      insts.forEach(function (inst, k) {
        var du = ' data-uid="' + esc(inst.uid) + '"' + dg;
        h += '<div class="inst">';
        if (insts.length > 1) h += '<span class="inum">' + (k + 1) + '</span>';
        if (a.variantes.length > 1) {
          h += '<span class="vars" role="group" aria-label="Variante">' + a.variantes.map(function (v, i) {
            return '<button type="button" class="mini var" data-acao="variante"' + du + ' data-v="' + i + '" data-f="var:' + esc(base) + ':' + esc(inst.uid) + ':' + i + '" aria-pressed="' + (inst.variante === i) + '">' + esc(v.nome || ('Variante ' + (i + 1))) + '</button>';
          }).join('') + '</span>';
        }
        h += '<button type="button" class="mini sutil" data-acao="remover"' + du + ' data-f="rem:' + esc(base) + ':' + esc(inst.uid) + '">remover</button>';
        if (k === insts.length - 1) h += '<button type="button" class="mini sutil" data-acao="duplicar"' + du + ' data-f="dup:' + esc(base) + '">outro igual</button>';
        h += '</div>';
      });
      h += '</div>';
    }
    return h + '</div>';
  }

  // ---------- folha ----------
  function renderFolha() {
    if (!cat) {
      $('folha').innerHTML = '<p class="aviso-vazio">Nenhum dado de laudo embutido. Rode <b>node montar.js</b> para gerar o programa.</p>';
      $('rodape').innerHTML = '';
      return;
    }
    var c = laudo.compor();
    var h = '<div class="par titulo">' + linhaHtml(c.titulo) + '</div>';
    c.paragrafos.forEach(function (p) { h += '<div class="par ' + p.tipo + '">' + p.linhas.map(linhaHtml).join('') + '</div>'; });
    $('folha').innerHTML = h;
    renderRodape(c);
  }

  function linhaHtml(l) {
    var ch = esc(l.chave);
    var cls = 'linha' + (l.alterada ? ' alterada' : '') + (l.editada ? ' editada' : '') + (l.negrito ? ' negrito' : '') + (l.editavel === false ? ' fixa' : '');
    var attrs = ' data-chave="' + ch + '"' + (l.origem ? ' data-origem="' + esc(l.origem) + '"' : '');
    if (editando && editando.chave === l.chave) {
      return '<div class="' + cls + ' editando"' + attrs + '>' +
        '<textarea class="edicao" rows="1" data-f="ed:' + ch + '" aria-label="Editar linha (Enter salva, Esc cancela)">' + esc(editando.texto) + '</textarea>' +
        '<span class="ed-acoes"><button type="button" class="mini" data-acao="salvar-edicao">Salvar</button>' +
        '<button type="button" class="mini sutil" data-acao="cancelar-edicao">Cancelar</button></span></div>';
    }
    var corpo = l.segs.map(function (s, i) { return segHtml(s, l.chave + ':' + i); }).join('');
    if (!corpo) corpo = '<span class="vazia">(linha apagada)</span>';
    var ferr = '';
    if (l.editavel !== false) {
      ferr = '<span class="ferr">' +
        (l.editada ? '<span class="tag">editada</span><button type="button" class="mini" data-acao="desfazer" data-f="des:' + ch + '" title="Voltar ao texto original">desfazer</button>' : '') +
        '<button type="button" class="lapis" data-acao="editar" data-f="lap:' + ch + '" aria-label="Editar linha" title="Editar linha (duplo clique)">' + LAPIS + '</button></span>';
    }
    return '<div class="' + cls + '"' + attrs + '><span class="lt">' + corpo + '</span>' + ferr + '</div>';
  }

  function tamanho(v) { return Math.max(3, String(v || '').length + 1); }

  function segHtml(s, fid) {
    if (s.t === 'txt') return esc(s.v);
    var dados = ' data-escopo="' + esc(s.escopo) + '" data-chave="' + esc(s.chave) + '" data-fid="' + esc(fid) + '"';
    var pend = s.pendente ? ' pendente' : '';
    if (s.tipo === 'valor') {
      var v = s.valor || '';
      return '<input class="campo valor' + pend + '" type="text"' + dados + ' data-f="c:' + esc(fid) + '" value="' + esc(v) + '" size="' + tamanho(v) + '" autocomplete="off" spellcheck="false" aria-label="Campo a preencher">';
    }
    if (!s.pendente && escolhaAberta !== fid) {
      return '<button type="button" class="campo escolhida"' + dados + ' data-acao="abrir-escolha" data-f="c:' + esc(fid) + '" title="Trocar (' + esc(s.opcoes.join(' / ')) + ')">' + esc(s.valor) + '</button>';
    }
    return '<span class="campo escolha' + pend + '" role="group" aria-label="Escolha" data-escopo="' + esc(s.escopo) + '">' + s.opcoes.map(function (o, k) {
      return '<button type="button" class="opc"' + dados + ' data-acao="escolher" data-valor="' + esc(o) + '" data-f="c:' + esc(fid) + (k ? ':o' + k : '') + '" aria-pressed="' + (s.valor === o) + '">' + esc(o) + '</button>';
    }).join('') + '</span>';
  }

  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }

  function renderRodape(c) {
    var n = c.pendencias;
    var h = n ? '<span class="pend">' + plural(n, 'campo por preencher', 'campos por preencher') + '</span>' : '<span>Nenhum campo por preencher</span>';
    if (copiadoEm) h += '<span class="copiado">Copiado às ' + copiadoEm + '</span>';
    h += '<span class="dicas">Ctrl+Enter copia · / busca · Tab vai ao próximo campo pendente</span>';
    $('rodape').innerHTML = h;
  }

  // ---------- navegação na folha ----------
  function rolarPara(el) {
    var cont = $('rolagemFolha');
    if (!el || !cont.contains(el)) return;
    var rc = cont.getBoundingClientRect(), re = el.getBoundingClientRect();
    if (re.top < rc.top + 16 || re.bottom > rc.bottom - 16) cont.scrollTop += (re.top - rc.top) - rc.height / 3;
  }
  function alvoDoCampo(raiz) { return raiz.matches('input, button') ? raiz : raiz.querySelector('button'); }
  function focarCampo(raiz) { var a = alvoDoCampo(raiz); if (a) { a.focus({ preventScroll: true }); rolarPara(a); } return a; }

  function proximoPendente(de, voltar) {
    var raizes = [].slice.call(document.querySelectorAll('#folha .campo.pendente'));
    if (voltar) raizes.reverse();
    for (var i = 0; i < raizes.length; i++) {
      var r = raizes[i];
      if (r === de || r.contains(de)) continue;
      var pos = de.compareDocumentPosition(r);
      if (voltar ? (pos & Node.DOCUMENT_POSITION_PRECEDING) : (pos & Node.DOCUMENT_POSITION_FOLLOWING)) { focarCampo(r); return true; }
    }
    return false;
  }

  // Ao marcar: rola até o achado e foca o primeiro campo (pendente, se houver).
  function irPara(uid, focarPrimeiro) {
    var sel = '[data-escopo="' + uid + '"]';
    var linha = document.querySelector('#folha .linha[data-origem="' + uid + '"]');
    if (linha) rolarPara(linha);
    if (!focarPrimeiro) return;
    var raiz = document.querySelector('#folha .campo.pendente' + sel) || document.querySelector('#folha .campo' + sel);
    if (raiz) focarCampo(raiz);
  }

  // ---------- edição de linha ----------
  function linhaPorChave(chave) {
    var c = laudo.compor(), todas = [c.titulo];
    c.paragrafos.forEach(function (p) { todas = todas.concat(p.linhas); });
    return todas.filter(function (l) { return l.chave === chave; })[0] || null;
  }
  function abrirEdicao(chave) {
    var l = linhaPorChave(chave);
    if (!l || l.editavel === false) return;
    editando = { chave: chave, texto: M.textoLinha(l) };
    escolhaAberta = null;
    renderFolha();
    var ta = acharF('ed:' + chave);
    if (ta) { ajustarAltura(ta); ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length); rolarPara(ta); }
  }
  function ajustarAltura(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; }
  function salvarEdicao(refocar) {
    var e = editando; if (!e) return;
    editando = null;
    var l = linhaPorChave(e.chave);
    if (l && (l.editada || M.textoLinha(l) !== e.texto)) laudo.editarLinha(e.chave, e.texto);
    renderSoFolha();
    if (refocar) focarLinha(e.chave);
  }
  function cancelarEdicao() {
    var e = editando; if (!e) return;
    editando = null;
    renderSoFolha();
    focarLinha(e.chave);
  }

  // ---------- cópia ----------
  function hora() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

  function avisar(msg, alerta) {
    var el = $('avisoCopia');
    el.textContent = msg;
    el.className = 'aviso-copia visivel' + (alerta ? ' alerta' : '');
    clearTimeout(timerAviso);
    timerAviso = setTimeout(function () { el.className = 'aviso-copia'; }, 4000);
  }

  function copiarAntigo(html, txt) {
    var ok = false;
    var aoCopiar = function (e) {
      e.clipboardData.setData('text/html', html);
      e.clipboardData.setData('text/plain', txt);
      e.preventDefault();
      ok = true;
    };
    document.addEventListener('copy', aoCopiar, true);
    try { document.execCommand('copy'); } catch (e) { /* ok */ }
    document.removeEventListener('copy', aoCopiar, true);
    if (ok) return true;
    // último recurso: selecionar uma cópia formatada e copiar a seleção
    var div = document.createElement('div');
    div.setAttribute('contenteditable', 'true');
    div.style.cssText = 'position:fixed;left:-10000px;top:0;white-space:normal;background:#fff;color:#000';
    div.innerHTML = html;
    document.body.appendChild(div);
    var sel = window.getSelection(), r = document.createRange();
    r.selectNodeContents(div); sel.removeAllRanges(); sel.addRange(r);
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    sel.removeAllRanges();
    document.body.removeChild(div);
    return ok;
  }

  function copiar() {
    if (!cat) return;
    if (editando) salvarEdicao(false);
    var c = laudo.compor(), html = M.html(c), txt = M.textoPuro(c);
    var fim = function (ok) {
      if (ok) {
        copiadoEm = hora();
        avisar('Copiado' + (c.pendencias ? ' · ' + plural(c.pendencias, 'campo sem preencher', 'campos sem preencher') : ''), c.pendencias > 0);
      } else avisar('Não foi possível copiar', true);
      renderRodape(laudo.compor());
    };
    if (navigator.clipboard && navigator.clipboard.write && typeof window.ClipboardItem === 'function') {
      try {
        var item = new window.ClipboardItem({
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([txt], { type: 'text/plain' })
        });
        navigator.clipboard.write([item]).then(function () { fim(true); }, function () { fim(copiarAntigo(html, txt)); });
        return;
      } catch (e) { /* cai para o modo antigo */ }
    }
    fim(copiarAntigo(html, txt));
  }

  // ---------- eventos ----------
  function aoClicarTopo(e) {
    var b = e.target.closest('[data-acao]'); if (!b) return;
    var acao = b.getAttribute('data-acao'), id = b.getAttribute('data-id');
    if (acao === 'categoria' && id !== cat.id) { abrirCategoria(id); render(); focar('cat:' + id); }
    if (acao === 'mascara' && id !== laudo.estado.mascara) {
      laudo.trocarMascara(id); escolhaAberta = null; editando = null; lembrarMascara(); render(); focar('masc:' + id);
    }
  }

  function aoClicarAchados(e) {
    var b = e.target.closest('[data-acao]'); if (!b) return;
    var acao = b.getAttribute('data-acao');
    var g = b.getAttribute('data-g'), a = b.getAttribute('data-a'), uid = b.getAttribute('data-uid');
    if (acao === 'recolher') {
      var id = b.getAttribute('data-id'), rec = recolhidos(), i = rec.indexOf(id);
      if (i >= 0) rec.splice(i, 1); else rec.push(id);
      salvarPrefs(); renderAchados(); focar('cab:' + id);
    } else if (acao === 'alternar') {
      var novo = laudo.alternar(g, a);
      render();
      if (novo) irPara(novo, true);
    } else if (acao === 'variante') {
      laudo.definirVariante(uid, +b.getAttribute('data-v'));
      render(); irPara(uid, false);
    } else if (acao === 'remover') {
      var base = b.getAttribute('data-f').replace(/^rem:/, '').replace(/:[^:]*$/, '');
      laudo.remover(uid);
      render();
      if (!document.activeElement || document.activeElement === document.body) focar('ach:' + base);
    } else if (acao === 'duplicar') {
      var u2 = laudo.duplicar(uid);
      render();
      if (u2) irPara(u2, true);
    }
  }

  function aoClicarFolha(e) {
    var b = e.target.closest('[data-acao]'); if (!b) return;
    var acao = b.getAttribute('data-acao');
    if (acao === 'escolher') {
      var fid = b.getAttribute('data-fid'), uid = b.getAttribute('data-escopo');
      laudo.definirValor(uid, b.getAttribute('data-chave'), b.getAttribute('data-valor'));
      escolhaAberta = null;
      renderSoFolha();
      var el = focar('c:' + fid);
      if (el) rolarPara(el); else if (uid !== 'mascara') irPara(uid, false);
    } else if (acao === 'abrir-escolha') {
      escolhaAberta = b.getAttribute('data-fid');
      renderFolha();
      focar('c:' + escolhaAberta);
    } else if (acao === 'editar') {
      abrirEdicao(b.closest('.linha').getAttribute('data-chave'));
    } else if (acao === 'desfazer') {
      var ch = b.closest('.linha').getAttribute('data-chave');
      laudo.desfazerEdicao(ch);
      renderSoFolha(); focarLinha(ch);
    } else if (acao === 'salvar-edicao') {
      salvarEdicao(true);
    } else if (acao === 'cancelar-edicao') {
      cancelarEdicao();
    }
  }

  function aoDuploClique(e) {
    if (e.target.closest('.campo, button, input, textarea')) return;
    var l = e.target.closest('.linha');
    if (!l || l.classList.contains('fixa') || l.classList.contains('editando')) return;
    var s = window.getSelection(); if (s) s.removeAllRanges();
    abrirEdicao(l.getAttribute('data-chave'));
  }

  function aoDigitarFolha(e) {
    var t = e.target;
    if (t.matches('input.campo.valor')) {
      laudo.definirValor(t.getAttribute('data-escopo'), t.getAttribute('data-chave'), t.value);
      t.size = tamanho(t.value);
      renderSoFolha();
    } else if (t.matches('textarea.edicao') && editando) {
      editando.texto = t.value;
      ajustarAltura(t);
    }
  }

  function aoTeclarFolha(e) {
    var t = e.target;
    if (t.matches('textarea.edicao')) {
      if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) { e.preventDefault(); salvarEdicao(true); }
      else if (e.key === 'Escape') { e.preventDefault(); cancelarEdicao(); }
      return;
    }
    if (e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.metaKey) {
      if (proximoPendente(t, e.shiftKey)) e.preventDefault();
    } else if (e.key === 'Enter' && t.matches('input.campo.valor') && !e.ctrlKey && !e.metaKey) {
      e.preventDefault(); proximoPendente(t, false);
    } else if (e.key === 'Escape' && escolhaAberta) {
      var fid = escolhaAberta; escolhaAberta = null; renderFolha(); focar('c:' + fid);
    }
  }

  function aoSairDaEdicao(e) {
    if (!e.target.matches('textarea.edicao') || !editando) return;
    var para = e.relatedTarget;
    if (para && para.closest && para.closest('.editando')) return; // Salvar/Cancelar cuidam disso
    salvarEdicao(false);
  }

  function aoTeclarGlobal(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); copiar(); return; }
    var t = e.target, digitando = t && (t.matches('input, textarea, select') || t.isContentEditable);
    if (e.key === '/' && !digitando && !e.ctrlKey && !e.altKey && !e.metaKey) { e.preventDefault(); $('busca').focus(); $('busca').select(); }
  }

  function iniciar() {
    if (DADOS.length) {
      var c0 = DADOS.filter(function (c) { return c.id === prefs.categoria; })[0] || DADOS[0];
      var m0 = prefs.mascaras && prefs.mascaras[c0.id];
      abrirCategoria(c0.id, m0);
    }
    render();

    document.querySelector('.topo').addEventListener('click', aoClicarTopo);
    $('mascaras').addEventListener('click', aoClicarTopo);
    $('achados').addEventListener('click', aoClicarAchados);
    var folha = $('folha');
    folha.addEventListener('click', aoClicarFolha);
    folha.addEventListener('dblclick', aoDuploClique);
    folha.addEventListener('input', aoDigitarFolha);
    folha.addEventListener('keydown', aoTeclarFolha);
    folha.addEventListener('focusout', aoSairDaEdicao);
    document.addEventListener('keydown', aoTeclarGlobal);

    $('btnCopiar').addEventListener('click', copiar);
    $('btnNovo').addEventListener('click', function () {
      if (!cat) return;
      laudo.limpar(); zerarTela(); render();
    });
    $('busca').addEventListener('input', function () { busca = this.value; renderAchados(); });
    $('busca').addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { if (this.value) { this.value = ''; busca = ''; renderAchados(); } else this.blur(); e.preventDefault(); }
      else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
        var b = document.querySelector('#achados .achado-btn');
        if (b) { e.preventDefault(); b.click(); }
      }
    });
    $('textoExtra').addEventListener('input', function () { if (!cat) return; laudo.definirTextoExtra(this.value); renderFolha(); });
    $('conclusaoExtra').addEventListener('input', function () { if (!cat) return; laudo.definirConclusaoExtra(this.value); renderFolha(); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();

</script>
