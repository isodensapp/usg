<!doctype html>
<html lang="pt-BR">
<head>
<!-- Isodens USG, montado em 2026-11-26 12:52: abdome, cervical-tireoide, ginecologia, mama, obstetricia, mao, punho, rins-vias-prostata -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Isodens USG</title>
<style>
/* Isodens USG - visual "papel noturno".
   Cores com papel fixo: verde = normal · âmbar = achado marcado (igual ao realce da folha) ·
   violeta = calculadora · azul-petróleo = ação e navegação · vermelho = medida fora da referência. */
:root {
  --fundo: #0C1012;
  --painel: #14191C;
  --painel2: #1C2327;
  --painel3: #242D32;
  --texto: #E3E8E5;
  --texto2: #9BA8AC;
  --texto3: #6F7C80;
  --linha: #2A353A;
  --linha2: #3A474D;
  --destaque: #5FC0CC;
  --btn: #1D7480;
  --btn-hover: #248B99;
  --sel: #263339;
  --ok: #63C28D;
  --ok-fundo: rgba(99, 194, 141, .13);
  --ok-linha: rgba(99, 194, 141, .42);
  --achado: #F0C255;
  --achado-fundo: #4B3A10;
  --achado-fundo2: #5C4814;
  --achado-linha: #A8842A;
  --calc: #B3A6F5;
  --calc-fundo: #2B2850;
  --calc-fundo2: #38346A;
  --calc-linha: #6E63C4;
  --info: #86B9EE;
  --info-fundo: rgba(134, 185, 238, .08);
  --aviso: #F0C255;
  --erro: #F08C7D;
  --papel: #C9C3B5;
  --papel-texto: #1F2226;
  --realce: #EBD48F;
  --realce-texto: #2B2206;
  --foco-papel: #1D7480;
  --raio: 7px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.ic { flex: none; display: block; }
kbd {
  display: inline-block; font: 600 11px/16px "Segoe UI", system-ui, sans-serif; color: var(--texto2);
  background: var(--painel2); border: 1px solid var(--linha2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; min-width: 18px; text-align: center;
}
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb { background: var(--linha2); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: #55656c; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- barra superior ---------- */
.topo {
  display: flex; align-items: center; gap: 18px;
  padding: 0 16px; height: 56px;
  background: var(--painel); border-bottom: 1px solid var(--linha);
  min-width: 0;
}
.logo { display: flex; align-items: center; gap: 9px; color: var(--destaque); white-space: nowrap; font-size: 16px; letter-spacing: .01em; }
.logo span { color: var(--texto); font-weight: 400; }
.logo b { font-weight: 700; color: var(--destaque); }
.categorias { display: flex; align-items: center; gap: 2px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; align-self: stretch; }
.categorias::-webkit-scrollbar { display: none; }
.aba {
  --cor: var(--destaque);
  position: relative; display: inline-flex; align-items: center; gap: 7px; height: 38px;
  background: none; border: 0; border-radius: var(--raio);
  padding: 0 12px; white-space: nowrap; color: var(--texto2); cursor: pointer; font-size: 14px;
  transition: color .12s, background-color .12s;
}
.aba .ic { color: var(--cor); opacity: .75; transition: opacity .12s; }
.aba:hover { color: var(--texto); background: var(--painel2); }
.aba:hover .ic { opacity: 1; }
.aba[aria-pressed="true"] { color: var(--texto); background: var(--painel3); font-weight: 600; }
.aba[aria-pressed="true"] .ic { opacity: 1; }
.aba[aria-pressed="true"]::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -9px; height: 3px; border-radius: 3px 3px 0 0; background: var(--cor); }
.aba:focus-visible { outline-offset: -2px; }
.aba[data-cat="abdome"] { --cor: #F2A65A; }
.aba[data-cat="cervical-tireoide"] { --cor: #5FC0CC; }
.aba[data-cat="ginecologia"] { --cor: #EE8FB3; }
.aba[data-cat="mama"] { --cor: #F08C9B; }
.aba[data-cat="obstetricia"] { --cor: #B3A6F5; }
.aba[data-cat="mao"] { --cor: #86B9EE; }
.aba[data-cat="punho"] { --cor: #7FD1C0; }
.aba[data-cat="rins-vias-prostata"] { --cor: #E6CC62; }
.acoes { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.aviso-copia { color: var(--texto2); font-size: 13px; opacity: 0; transition: opacity .15s; }
.aviso-copia.visivel { opacity: 1; }
.aviso-copia.alerta { color: var(--aviso); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px;
  background: var(--painel2); border: 1px solid var(--linha2); border-radius: var(--raio);
  padding: 0 14px; cursor: pointer; transition: background-color .12s, border-color .12s, transform .06s;
}
.btn:hover { background: var(--sel); border-color: #4a5a61; }
.btn:active { transform: translateY(1px); }
.btn.principal { background: var(--btn); border-color: var(--btn-hover); color: #F1F8F7; font-weight: 600; padding: 0 18px; min-width: 150px; box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 2px 8px rgba(0,0,0,.35); }
.btn.principal:hover { background: var(--btn-hover); }
.btn.principal.feito { background: #2C7D52; border-color: #3B9B68; }

/* ---------- máscaras (qual exame) ---------- */
.mascaras {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 9px 16px; border-bottom: 1px solid var(--linha); background: var(--fundo);
}
.masc-rot { display: inline-flex; align-items: center; gap: 6px; color: var(--texto3); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
.mascara {
  height: 32px; background: var(--painel); border: 1px solid var(--linha); border-radius: 16px;
  padding: 0 14px; cursor: pointer; color: var(--texto2); transition: background-color .12s, color .12s, border-color .12s;
}
.mascara:hover { color: var(--texto); background: var(--painel2); border-color: var(--linha2); }
.mascara[aria-pressed="true"] { background: rgba(95, 192, 204, .14); color: #E9F6F7; border-color: var(--destaque); font-weight: 600; }

/* ---------- área principal ---------- */
.area { display: grid; grid-template-columns: minmax(0, 46fr) minmax(0, 54fr); min-height: 0; }
.col-achados { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--linha); background: var(--painel); }
.col-laudo { display: flex; flex-direction: column; min-height: 0; min-width: 0; }

/* contexto da paciente (não entra no laudo): chips de um clique no topo do painel */
.paciente { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px 11px; border-bottom: 1px solid var(--linha); background: var(--info-fundo); border-left: 3px solid var(--info); }
.paciente[hidden] { display: none; }
.pc-cab { display: flex; align-items: center; gap: 6px; color: var(--info); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.pc-cab span { color: var(--texto3); font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 2px; }
.pc-dado { display: grid; grid-template-columns: 92px minmax(0, 1fr); column-gap: 10px; align-items: start; }
.pc-rot { color: var(--texto2); font-size: 13px; line-height: 30px; }
.pc-ops { display: flex; flex-wrap: wrap; gap: 6px; }
.paciente .chip.on { background: #224668; border-color: var(--info); color: #EAF3FC; }
.paciente .chip.on:hover { background: #2A547C; }
.pc-aviso { display: flex; align-items: center; gap: 6px; color: var(--aviso); font-size: 13px; }

.busca { position: relative; padding: 10px 14px; border-bottom: 1px solid var(--linha); }
.busca .ic { position: absolute; left: 25px; top: 50%; margin-top: -8px; color: var(--texto3); pointer-events: none; }
.busca kbd { position: absolute; right: 24px; top: 50%; margin-top: -10px; pointer-events: none; }
.busca input {
  width: 100%; height: 36px; background: var(--fundo); color: var(--texto);
  border: 1px solid var(--linha2); border-radius: var(--raio); padding: 0 36px 0 34px; font: inherit;
  transition: border-color .12s, box-shadow .12s;
}
.busca input::placeholder { color: var(--texto3); }
.busca input:focus-visible { outline: none; border-color: var(--destaque); box-shadow: 0 0 0 3px rgba(95, 192, 204, .18); }
.busca input:focus ~ kbd, .busca input:not(:placeholder-shown) ~ kbd { display: none; }

/* resumo do que está marcado */
.marcados { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--linha); background: rgba(240, 194, 85, .05); max-height: 104px; overflow-y: auto; }
.marcados[hidden] { display: none; }
.mc-rot { display: inline-flex; align-items: center; gap: 6px; color: var(--achado); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; margin-right: 2px; }
.mc-item { display: inline-flex; align-items: stretch; height: 26px; border: 1px solid var(--achado-linha); border-radius: 13px; overflow: hidden; background: rgba(240, 194, 85, .08); max-width: 100%; }
.mc-item.form { border-color: var(--calc-linha); background: rgba(179, 166, 245, .10); }
.mc-item.nota { border-color: var(--linha2); background: var(--painel2); }
.mc-nome { background: none; border: 0; padding: 0 4px 0 11px; cursor: pointer; font-size: 12.5px; color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.mc-nome:hover { text-decoration: underline; text-underline-offset: 2px; }
.mc-x { display: inline-flex; align-items: center; justify-content: center; width: 26px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--texto2); }
.mc-x:hover { background: rgba(240, 140, 125, .22); color: #FFD9D2; }
.mc-nome:focus-visible, .mc-x:focus-visible { outline-offset: -2px; }

.lista-achados { overflow-y: auto; flex: 1 1 auto; padding: 0 0 28px; scrollbar-color: var(--linha2) transparent; }
.vazio { color: var(--texto2); padding: 14px 16px; }

/* faixas: uma por parágrafo da máscara, na ordem do laudo */
.faixa {
  display: grid; grid-template-columns: 138px minmax(0, 1fr); column-gap: 12px;
  padding: 10px 14px 10px 11px; border-bottom: 1px solid var(--linha); border-left: 3px solid transparent;
  transition: background-color .15s;
}
.faixa:hover { background: rgba(255, 255, 255, .018); }
.faixa.tem { border-left-color: var(--achado); background: rgba(240, 194, 85, .045); }
.faixa.piscar { animation: piscar 1.4s ease-out; }
@keyframes piscar { 0%, 35% { background: rgba(95, 192, 204, .22); } 100% { background: transparent; } }
.fx-rot { display: flex; align-items: flex-start; gap: 7px; color: var(--texto2); font-size: 13.5px; font-weight: 600; line-height: 1.25; padding-top: 7px; min-width: 0; }
.fx-nome { min-width: 0; overflow-wrap: anywhere; }
.fx-estado { color: var(--ok); opacity: .8; margin-top: 0; }
.faixa.tem .fx-rot { color: var(--texto); }
.faixa.tem .fx-estado { color: var(--achado); opacity: 1; }
.fx-corpo { min-width: 0; }
.fx-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 30px;
  background: var(--painel2); border: 1px solid var(--linha2); border-radius: var(--raio);
  padding: 3px 11px; line-height: 1.25; font-size: 13.5px; cursor: pointer; color: var(--texto); text-align: left;
  transition: background-color .12s, border-color .12s, color .12s, transform .06s;
}
.chip:hover { background: var(--painel3); border-color: #51626a; }
.chip:active { transform: translateY(1px); }
/* marcado: âmbar, a mesma cor do realce na folha */
.chip.on { background: var(--achado-fundo); border-color: var(--achado); color: #FFF3D0; font-weight: 600; }
.chip.on:hover { background: var(--achado-fundo2); border-color: var(--achado); }
.chip.on .ic { color: var(--achado); }
.chip.on .cont { background: var(--achado); color: #2B2206; }
/* Normal: verde quando é o estado da faixa; apagado (vira "voltar ao normal") quando há achado */
.chip.normal { background: none; border-color: var(--linha); color: var(--texto2); }
.chip.normal:hover { color: var(--texto); background: var(--painel2); }
.chip.normal[aria-pressed="true"] { color: var(--ok); border-color: var(--ok-linha); background: var(--ok-fundo); font-weight: 600; cursor: default; }
.chip.normal[aria-pressed="true"]:active { transform: none; }
.chip.mais { background: none; border-style: dashed; color: var(--texto2); gap: 4px; }
.chip.mais:hover { color: var(--texto); }
.chip.nota:not(.on) { color: var(--texto2); }
/* calculadora (TI-RADS, BI-RADS): violeta */
.chip.form { font-weight: 600; background: var(--calc-fundo); border-color: var(--calc-linha); color: #ECE8FF; }
.chip.form .ic { color: var(--calc); }
.chip.form:hover, .chip.form.on:hover { background: var(--calc-fundo2); border-color: var(--calc); }
.chip.form.on { background: var(--calc-fundo2); border-color: var(--calc); color: #F4F1FF; }
.chip.form.on .cont { background: var(--calc); color: #1B1840; }
.faixa .insts { margin-top: 8px; }
.inome { color: #FFF3D0; font-size: 13px; font-weight: 600; margin-right: 4px; }

.faixa.aux { display: block; padding: 0; }
.faixa.aux .fx-corpo { padding: 0 14px 12px 14px; }
.qtd { color: var(--texto3); letter-spacing: 0; margin-left: 4px; font-weight: 400; }

.resultados { padding: 6px 8px; }
.achado-btn .gr { color: var(--texto2); font-size: 12px; white-space: nowrap; }
.achado.on .achado-btn .gr { font-weight: normal; }

.grupo-cab {
  display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px;
  background: none; border: 0; text-align: left; cursor: pointer;
  padding: 0 14px; color: var(--texto2); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
}
.grupo-cab:hover { color: var(--texto); background: rgba(255, 255, 255, .025); }
.grupo-cab:focus-visible { outline-offset: -2px; }
.seta { display: inline-flex; transition: transform .12s; flex: none; transform: rotate(90deg); }
.faixa.fechado .seta { transform: none; }
.gnome { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cont {
  display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; text-align: center;
  background: var(--achado); color: #2B2206; font-size: 11.5px; font-weight: 700; letter-spacing: 0; text-transform: none; line-height: 18px;
}

.achado { border-left: 3px solid transparent; border-radius: var(--raio); }
.achado.on { border-left-color: var(--achado); background: rgba(240, 194, 85, .07); margin: 2px 0; }
.achado-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; text-align: left;
  background: none; border: 0; border-radius: var(--raio); padding: 4px 10px; cursor: pointer; color: var(--texto);
  transition: background-color .12s;
}
.achado-btn:hover { background: var(--painel2); }
.achado.on .achado-btn { color: #FFF3D0; font-weight: 600; }
.achado.on .achado-btn:hover { background: rgba(240, 194, 85, .10); }
.achado.nota .achado-btn { color: var(--texto2); }
.achado.nota.on .achado-btn { color: #FFF3D0; }
.achado-btn .nome { flex: 1 1 auto; }
.insts { padding: 0; display: flex; flex-direction: column; gap: 5px; }
.resultados .insts { padding: 2px 8px 8px 12px; }
.inst { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 5px 8px 5px 10px; border-left: 2px solid var(--achado-linha); background: rgba(0, 0, 0, .18); border-radius: 0 var(--raio) var(--raio) 0; }
.inst.form { border-left-color: var(--calc-linha); }
.inum { color: var(--texto2); font-size: 12px; min-width: 12px; }
.vars { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.mini {
  display: inline-flex; align-items: center; gap: 4px; min-height: 26px;
  background: var(--painel2); border: 1px solid var(--linha2); border-radius: 6px;
  padding: 2px 9px; font-size: 12.5px; line-height: 1.2; cursor: pointer; color: var(--texto2); text-align: left;
  transition: background-color .12s, color .12s, border-color .12s;
}
.mini:hover { color: var(--texto); background: var(--painel3); }
.mini[aria-pressed="true"] { color: #FFF3D0; border-color: var(--achado); background: var(--achado-fundo); font-weight: 600; }
.mini.sutil { background: none; border-color: transparent; color: var(--texto2); }
.mini.sutil:hover { color: var(--texto); background: var(--painel3); }
.mini.sutil[data-acao="remover"]:hover, .mini.sutil[data-acao="fm-remover"]:hover { color: #FFD9D2; background: rgba(240, 140, 125, .18); }
.mini.fitem { background: var(--calc-fundo); border-color: var(--calc-linha); color: #ECE8FF; font-weight: 600; }
.mini.fitem .ic { color: var(--calc); }
.mini.fitem:hover { background: var(--calc-fundo2); border-color: var(--calc); }

/* ---------- folha ---------- */
.rolagem { flex: 1 1 auto; overflow-y: auto; padding: 18px 22px 24px; scrollbar-color: var(--linha2) transparent; }
.folha {
  background: var(--papel); color: var(--papel-texto);
  max-width: 880px; margin: 0 auto; padding: 30px 50px 32px 38px; border-radius: 4px;
  box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 10px 30px rgba(0,0,0,.45);
  font-family: Calibri, Carlito, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.42;
}
.folha[contenteditable="true"] { cursor: text; caret-color: #111; }
.folha:focus, .folha:focus-visible { outline: none; }
.folha .aviso-vazio { color: #4a4d50; }
.par { margin: 0 0 15px; }
.par:last-child { margin-bottom: 0; }
.par.titulo { font-size: 17px; }
.linha { position: relative; margin: 0 -5px; padding: 0 5px; border-radius: 3px; white-space: pre-wrap; overflow-wrap: break-word; }
.linha.negrito { font-weight: bold; }
/* o programa mudou (achado): realce amarelo */
.linha.alterada { background: var(--realce); color: var(--realce-texto); }
/* eu mudei (editada ou escrita à mão): fio fino na margem esquerda */
.linha.manual::before {
  content: ''; position: absolute; left: -10px; top: 3px; bottom: 3px; width: 3px; border-radius: 2px;
  background: #2F7F8B; pointer-events: none;
}
/* linha apagada: tracejado discreto no lugar, com "desfazer" na margem */
.linha.removida { height: 8px; margin: 1px -5px; cursor: default; user-select: none; -webkit-user-select: none; }
.linha.removida::after { content: ''; position: absolute; left: 5px; right: 5px; top: 3px; border-top: 1px dashed rgba(58, 52, 40, .4); }
.linha.removida.manual::before { top: 0; bottom: 0; background: #8b8577; }
.marca {
  position: absolute; right: -36px; top: 0; height: 1.42em; display: flex; align-items: center;
  user-select: none; -webkit-user-select: none; font-weight: normal;
}
.linha.removida .marca { top: -8px; }
.desfazer {
  width: 26px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
  background: none; border: 0; border-radius: 4px; padding: 0; cursor: pointer; color: #4f5a5c; opacity: .8;
  transition: opacity .12s, background-color .12s;
}
.desfazer:hover, .desfazer:focus-visible { opacity: 1; background: rgba(0,0,0,.12); color: #1F2226; }
.folha :focus-visible { outline-color: var(--foco-papel); }
.ilha { white-space: nowrap; }

/* campos dentro do texto */
.campo { font: inherit; color: inherit; vertical-align: baseline; }
input.campo.valor {
  background: rgba(255,255,255,.45); border: 0; border-bottom: 1.5px solid #5a5650; border-radius: 3px;
  padding: 0 4px; margin: 0 1px; min-width: 3.4ch; line-height: 1.2; height: 1.4em;
}
input.campo.valor:hover { background: rgba(255,255,255,.62); }
input.campo.valor:focus { background: rgba(255,255,255,.85); box-shadow: 0 0 0 2px var(--foco-papel); border-bottom-color: transparent; }
.campo.pendente { box-shadow: 0 0 0 1px #7a631a, 0 0 0 3px #F0C255; }
input.campo.valor.pendente { border-bottom-color: transparent; }
input.campo.valor.pendente:focus { box-shadow: 0 0 0 2px var(--foco-papel); }
.campo.escolha { display: inline-flex; gap: 3px; padding: 1px; border-radius: 5px; margin: 0 1px; vertical-align: baseline; }
.opc {
  font: 13.5px/1.3 "Segoe UI", system-ui, sans-serif; color: var(--papel-texto);
  background: #DCD7CC; border: 1px solid #77726a; border-radius: 5px; padding: 2px 9px; cursor: pointer;
  transition: background-color .12s, border-color .12s;
}
.opc:hover { background: #F1EEE6; border-color: #1D7480; }
.opc[aria-pressed="true"] { background: #1D7480; color: #F1F8F7; border-color: #1D7480; }
button.campo.escolhida {
  background: none; border: 0; border-bottom: 1px dotted #5a5650; padding: 0; margin: 0; cursor: pointer; border-radius: 0;
}
button.campo.escolhida:hover { background: rgba(255,255,255,.4); }
/* calculado pelo motor: não se digita; marca discreta (fundo leve e sublinhado pontilhado) */
.campo.calc {
  background: rgba(29,116,128,.12); border-bottom: 1px dotted #1D7480; border-radius: 3px; padding: 0 3px; cursor: default;
}
.campo.calc.pendente { background: none; }
/* medida fora do corte de uma regra (só na tela): fundo e sublinhado avermelhados */
input.campo.valor.alerta, .campo.calc.alerta { background: rgba(190, 52, 38, .18); border-bottom: 2px solid #A3402F; }
input.campo.valor.alerta:focus { background: rgba(255, 236, 230, .85); }
.campo.outro { border-bottom: 1px dotted #5a5650; }

/* rodapé */
.rodape {
  display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 16px;
  background: var(--painel); border-top: 1px solid var(--linha); color: var(--texto2); font-size: 13px; white-space: nowrap; overflow: hidden;
}
.rodape .pend {
  display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; cursor: pointer;
  background: rgba(240, 194, 85, .12); border: 1px solid var(--achado-linha); border-radius: 14px; color: var(--achado); font-weight: 600;
  transition: background-color .12s;
}
.rodape .pend:hover { background: rgba(240, 194, 85, .22); }
.rodape .tudo-ok { display: inline-flex; align-items: center; gap: 7px; color: var(--ok); }
.rodape .copiado { display: inline-flex; align-items: center; gap: 5px; color: var(--ok); }
.rodape .dicas { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; color: var(--texto3); font-size: 12px; overflow: hidden; }
.rodape .dicas i { display: inline-block; width: 12px; }
.semjs { padding: 20px; }

/* Busca: achado com lado mostra os botões de lado ao lado do nome */
.res-linha { display: flex; align-items: center; gap: 6px; }
.res-linha .achado-btn { flex: 1 1 auto; min-width: 0; }
.res-linha .mini.lado { flex: none; text-transform: capitalize; min-height: 28px; margin-right: 6px; }
.res-linha .mini.lado.form { text-transform: none; }

/* ---------- formulário (calculadora) no lugar do painel de achados ---------- */
.col-achados.com-form .busca { display: none; }
.inst.form .fitem { color: #ECE8FF; }
.fm-painel { padding-bottom: 12px; }
.fm-topo {
  position: sticky; top: 0; z-index: 2;
  background: var(--painel); border-bottom: 1px solid var(--linha); border-left: 3px solid var(--calc); padding: 9px 14px 11px 11px;
  box-shadow: 0 6px 12px rgba(0,0,0,.25);
}
.fm-barra { display: flex; align-items: center; gap: 12px; min-width: 0; }
.fm-voltar { display: inline-flex; align-items: center; gap: 6px; height: 32px; background: var(--painel2); border: 1px solid var(--linha2); border-radius: var(--raio); padding: 0 12px 0 9px; cursor: pointer; color: var(--texto); font-size: 13.5px; white-space: nowrap; }
.fm-voltar:hover { background: var(--painel3); }
.fm-titulo { margin-left: auto; color: var(--calc); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fm-resumo { display: flex; flex-wrap: wrap; gap: 6px 26px; margin-top: 9px; }
.fm-res { min-width: 0; }
.fm-res .r { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--texto2); }
.fm-res .v { display: block; font-size: 17px; font-weight: 700; color: var(--texto); }
.fm-res.pendente .v { font-size: 13px; font-weight: normal; color: var(--aviso); }
.fm-res.nivel1 .v, .fm-res.nivel2 .v { color: #7FD3A2; }
.fm-res.nivel3 .v { color: #F0C255; }
.fm-res.nivel4 .v { color: #F2A65A; }
.fm-res.nivel5 .v { color: #F08C7D; }
.fm-sec { padding: 13px 14px 3px; }
.fm-rot { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; font-size: 13px; color: var(--texto2); }
.fm-rot .nome { color: var(--texto); font-weight: 600; font-size: 13.5px; }
.fm-rot .dica { font-size: 12px; }
.fm-cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
.cartao {
  position: relative; display: flex; flex-direction: column; gap: 5px; min-width: 0;
  background: var(--painel2); border: 1px solid var(--linha2); border-radius: var(--raio); padding: 5px 5px 7px;
  cursor: pointer; text-align: left; color: var(--texto); transition: background-color .12s, border-color .12s;
}
.cartao:hover { background: var(--painel3); border-color: #51626a; }
.cartao .fig { display: block; width: 100%; max-width: 128px; height: auto; margin: 0 auto; border-radius: 4px; }
.cartao .cn { padding: 0 3px; font-size: 13px; line-height: 1.25; }
.cartao .pts {
  position: absolute; top: 8px; right: 8px; padding: 0 7px; border-radius: 9px;
  background: rgba(0,0,0,.72); color: #eef2f1; font-size: 11.5px; font-weight: 700; line-height: 18px;
}
.cartao[aria-pressed="true"] { background: var(--achado-fundo); border-color: var(--achado); box-shadow: 0 0 0 1px var(--achado); color: #FFF3D0; font-weight: 600; }
.cartao[aria-pressed="true"] .pts { background: var(--achado); color: #2B2206; }
.cartao[aria-pressed="false"] .fig { opacity: .85; }
.cartao:hover .fig { opacity: 1; }
.fm-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fm-chips .pts { color: var(--texto2); font-size: 11.5px; font-weight: 600; }
.fm-chips .chip.on .pts { color: var(--achado); }
.fm-medidas { display: flex; align-items: center; gap: 8px; }
.fm-medida {
  width: 76px; height: 34px; padding: 0 9px; border: 1px solid var(--linha2); border-radius: var(--raio);
  background: var(--fundo); color: var(--texto); font: inherit; font-size: 15px;
}
.fm-medida:focus-visible { outline: none; border-color: var(--destaque); box-shadow: 0 0 0 3px rgba(95, 192, 204, .18); }
.fm-medida.pendente { border-color: var(--achado-linha); }
.fm-x, .fm-un { color: var(--texto2); }
.fm-config { display: flex; align-items: center; gap: 8px; padding: 14px 14px 0; cursor: pointer; color: var(--texto2); }
.fm-config input { margin: 0; width: 16px; height: 16px; accent-color: var(--destaque); }
.fm-acoes { display: flex; align-items: center; gap: 12px; padding: 14px 14px 4px; }

/* formulário: linha de regra no resumo, opção sugerida, mostrador (relógio) */
.fm-res.nota { flex: 1 0 100%; }
.fm-res.nota .v { font-size: 13px; font-weight: normal; color: var(--texto2); }
.chip.sugerida:not(.on), .cartao.sugerida[aria-pressed="false"] { border-color: var(--destaque); border-style: dashed; }
.chip.sugerida:not(.on)::after { content: 'sugestão'; font-size: 11px; color: var(--destaque); }
.fm-relogio { position: relative; width: 264px; height: 231px; margin: 2px 0 6px; }
.fm-relogio .fig-relogio { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.rl-op {
  position: absolute; transform: translate(-50%, -50%);
  background: var(--painel2); border: 1px solid var(--linha2); color: var(--texto); cursor: pointer;
  transition: background-color .12s, border-color .12s;
}
.rl-op.hora { width: 30px; height: 30px; border-radius: 50%; padding: 0; font-size: 13px; line-height: 28px; text-align: center; }
.rl-op.local { border-radius: 12px; padding: 0 8px; font-size: 12px; line-height: 22px; white-space: nowrap; }
.rl-op:hover { background: var(--painel3); border-color: #51626a; }
.rl-op.on { background: var(--achado-fundo); border-color: var(--achado); color: #FFF3D0; box-shadow: 0 0 0 1px var(--achado); font-weight: 600; }
button.campo.escolhida.auto { border-bottom-style: dashed; }

/* Escolha com opções longas (BI-RADS, recomendação) quebra em linhas em vez de estourar a folha */
.campo.escolha { flex-wrap: wrap; max-width: 100%; row-gap: 3px; white-space: normal; }
.campo.escolha button { white-space: normal; text-align: left; }

/* ---------- telas menores ---------- */
@media (max-width: 1480px) {
  .topo { gap: 10px; padding: 0 12px; }
  .aba { padding: 0 8px; gap: 5px; font-size: 13.5px; }
  .aba .ic { width: 16px; height: 16px; }
  .btn.principal { min-width: 0; padding: 0 14px; }
  #btnNovo { padding: 0 11px; }
  #btnNovo span { display: none; }
  .acoes { gap: 8px; }
}
@media (max-width: 1280px) {
  .faixa { grid-template-columns: 122px minmax(0, 1fr); }
}
@media (max-width: 1180px) {
  .logo span { display: none; }
}
@media (max-width: 1100px) {
  .folha { padding: 22px 42px 24px 24px; }
  .aba .ic { display: none; }
  .rodape .dicas { display: none; }
  .faixa { grid-template-columns: 104px minmax(0, 1fr); column-gap: 8px; }
  .fx-estado { display: none; }
}
@media (max-height: 760px) {
  .topo { height: 48px; }
  .aba, .btn { height: 34px; }
  .aba[aria-pressed="true"]::after { bottom: -7px; }
  .mascaras { padding: 6px 16px; }
  .faixa { padding-top: 7px; padding-bottom: 7px; }
}

/* ações da instância (remover, outro igual) encostadas à direita */
.inst [data-acao="remover"] { margin-left: auto; }

/* aviso da cópia: flutua sob os botões, sem empurrar as abas */
.acoes { position: relative; }
.aviso-copia {
  position: absolute; right: 0; top: calc(100% + 10px); z-index: 5; pointer-events: none;
  background: var(--painel3); border: 1px solid var(--ok-linha); border-radius: var(--raio); padding: 7px 13px;
  color: var(--texto); box-shadow: 0 8px 20px rgba(0,0,0,.45); transform: translateY(-4px); transition: opacity .15s, transform .15s;
}
.aviso-copia.visivel { transform: none; }
.aviso-copia.alerta { border-color: var(--achado-linha); color: var(--aviso); }

/* ---------- telas grandes: tudo um pouco maior ---------- */
@media (min-width: 1700px) and (min-height: 900px) {
  body { font-size: 15px; }
  .chip { min-height: 34px; font-size: 14.5px; padding: 4px 13px; }
  .mini { min-height: 29px; font-size: 13.5px; }
  .aba { font-size: 15px; padding: 0 14px; }
  .mascara { height: 35px; padding: 0 16px; }
  .faixa { grid-template-columns: 168px minmax(0, 1fr); padding-top: 12px; padding-bottom: 12px; }
  .fx-rot { font-size: 14.5px; padding-top: 8px; }
  .folha { font-size: 17px; max-width: 940px; }
  .par.titulo { font-size: 18px; }
  .opc { font-size: 14.5px; }
  .fm-cartoes { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}

</style>
