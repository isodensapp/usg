<!doctype html>
<html lang="pt-BR">
<head>
<!-- Isodens USG, montado em 2026-11-25 14:49: abdome, cervical-tireoide, ginecologia, mama, obstetricia, mao, punho, rins-vias-prostata -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Isodens USG</title>
<style>
/* Isodens USG - visual "papel noturno" */
:root {
  --fundo: #0B0E10;
  --painel: #15191B;
  --painel2: #1C2225;
  --texto: #CBD0CC;
  --texto2: #929DA0;
  --linha: #2E383D;
  --destaque: #6FB3BB;
  --btn: #22565E;
  --btn-hover: #2B6972;
  --sel: #2A3438;
  --aviso: #E8C877;
  --papel: #BEB8AB;
  --papel-texto: #23262A;
  --realce: #E6CF8E;
  --realce-texto: #2B2206;
  --foco-papel: #22565E;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--destaque); outline-offset: 1px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--linha); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- barra superior ---------- */
.topo {
  display: flex; align-items: center; gap: 14px;
  padding: 0 12px; height: 44px;
  background: var(--painel); border-bottom: 1px solid var(--linha);
  min-width: 0;
}
.marca { font-weight: 600; letter-spacing: .02em; color: var(--destaque); white-space: nowrap; font-size: 14px; }
.categorias { display: flex; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; align-self: stretch; }
.categorias::-webkit-scrollbar { display: none; }
.aba {
  background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 0 10px; white-space: nowrap; color: var(--texto2); cursor: pointer;
  transition: color .12s, border-color .12s;
}
.aba:hover { color: var(--texto); }
.aba[aria-pressed="true"] { color: var(--texto); border-bottom-color: var(--destaque); }
.aba:focus-visible { outline-offset: -3px; }
.acoes { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.aviso-copia { color: var(--texto2); font-size: 12px; opacity: 0; transition: opacity .15s; }
.aviso-copia.visivel { opacity: 1; }
.aviso-copia.alerta { color: var(--aviso); }

.btn {
  background: var(--painel2); border: 1px solid var(--linha); border-radius: 4px;
  padding: 5px 12px; cursor: pointer; transition: background-color .12s, border-color .12s;
}
.btn:hover { background: var(--sel); }
.btn.principal { background: var(--btn); border-color: var(--btn-hover); color: #E4EEEC; font-weight: 600; }
.btn.principal:hover { background: var(--btn-hover); }

/* ---------- máscaras ---------- */
.mascaras {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 6px 12px; border-bottom: 1px solid var(--linha); background: var(--fundo);
}
.mascara {
  background: var(--painel); border: 1px solid var(--linha); border-radius: 4px;
  padding: 3px 10px; cursor: pointer; color: var(--texto2); transition: background-color .12s, color .12s;
}
.mascara:hover { color: var(--texto); background: var(--painel2); }
.mascara[aria-pressed="true"] { background: var(--sel); color: var(--texto); border-color: var(--destaque); }

/* ---------- área principal ---------- */
.area { display: grid; grid-template-columns: minmax(0, 40fr) minmax(0, 60fr); min-height: 0; }
.col-achados { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--linha); background: var(--painel); }
.col-laudo { display: flex; flex-direction: column; min-height: 0; min-width: 0; }

.busca { padding: 8px 10px; border-bottom: 1px solid var(--linha); }
.busca input {
  width: 100%; background: var(--fundo); color: var(--texto);
  border: 1px solid var(--linha); border-radius: 4px; padding: 5px 8px; font: inherit;
}
.busca input::placeholder { color: var(--texto2); }
.busca input:focus-visible { outline-offset: 0; border-color: var(--destaque); }

.lista-achados { overflow-y: auto; flex: 1 1 auto; padding: 4px 0 24px; scrollbar-color: var(--linha) transparent; }
.vazio { color: var(--texto2); padding: 8px 14px; }

.grupo { border-bottom: 1px solid #20282b; }
.grupo-titulo { margin: 0; font-size: inherit; font-weight: normal; }
.grupo-cab {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: none; border: 0; text-align: left; cursor: pointer;
  padding: 6px 12px 5px; color: var(--texto2); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase;
}
.grupo-cab:hover { color: var(--texto); }
.grupo-cab:focus-visible { outline-offset: -2px; }
.seta { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; transition: transform .12s; flex: none; }
.grupo.fechado .seta { transform: rotate(-90deg); }
.gnome { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cont {
  display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 8px; text-align: center;
  background: var(--btn); color: #E4EEEC; font-size: 11px; letter-spacing: 0; text-transform: none; line-height: 16px;
}
.itens { padding: 0 6px 6px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 4px; align-items: start; }

.achado { border-left: 3px solid transparent; border-radius: 3px; }
.achado.on { border-left-color: var(--destaque); background: var(--sel); margin: 1px 0; }
.achado-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: none; border: 0; border-radius: 3px; padding: 3px 8px; cursor: pointer; color: var(--texto);
  transition: background-color .12s;
}
.achado-btn:hover { background: var(--painel2); }
.achado.on .achado-btn { color: #E6EBE7; font-weight: 600; }
.achado.on .achado-btn:hover { background: #313d42; }
.achado.nota .achado-btn { color: var(--texto2); }
.achado.nota.on .achado-btn { color: #E6EBE7; }
.achado-btn .nome { flex: 1 1 auto; }
.insts { padding: 0 8px 5px 14px; display: flex; flex-direction: column; gap: 3px; }
.inst { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.inum { color: var(--texto2); font-size: 11px; min-width: 12px; }
.vars { display: inline-flex; flex-wrap: wrap; gap: 3px; }
.mini {
  background: var(--painel2); border: 1px solid var(--linha); border-radius: 3px;
  padding: 0 7px; font-size: 12px; line-height: 20px; cursor: pointer; color: var(--texto2);
  transition: background-color .12s, color .12s;
}
.mini:hover { color: var(--texto); background: #263034; }
.mini[aria-pressed="true"] { color: var(--texto); border-color: var(--destaque); background: #1f3b40; }
.mini.sutil { background: none; border-color: transparent; text-decoration: underline; text-decoration-color: var(--linha); text-underline-offset: 2px; }
.mini.sutil:hover { color: var(--texto); }

/* ---------- folha ---------- */
.rolagem { flex: 1 1 auto; overflow-y: auto; padding: 14px 18px 20px; scrollbar-color: var(--linha) transparent; }
.folha {
  background: var(--papel); color: var(--papel-texto);
  max-width: 860px; margin: 0 auto; padding: 26px 46px 28px 34px; border-radius: 2px;
  font-family: Calibri, Carlito, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.38;
}
.folha .aviso-vazio { color: #4a4d50; }
.par { margin: 0 0 14px; }
.par:last-child { margin-bottom: 0; }
.par.titulo { font-size: 16px; }
.linha { position: relative; margin: 0 -4px; padding: 0 4px; border-radius: 2px; }
.linha .lt { white-space: pre-wrap; }
.linha.negrito .lt { font-weight: bold; }
.linha.alterada { background: var(--realce); color: var(--realce-texto); }
.linha.editada { background: var(--realce); color: var(--realce-texto); box-shadow: inset 3px 0 0 #7a6526; }
.linha.fixa { cursor: default; }
.vazia { color: #6a6458; font-style: italic; }

.ferr { position: absolute; right: -42px; top: 0; display: flex; align-items: center; gap: 3px; height: 1.38em; }
.lapis {
  width: 24px; height: 20px; display: inline-flex; align-items: center; justify-content: center;
  background: none; border: 0; border-radius: 3px; padding: 0; cursor: pointer; color: #4c4f52;
  opacity: 0; transition: opacity .12s, background-color .12s;
}
.linha:hover .lapis, .lapis:focus-visible { opacity: 1; }
.lapis:hover { background: rgba(0,0,0,.1); color: #23262A; }
.lapis:focus-visible { outline-color: var(--foco-papel); }
.tag { font: 11px "Segoe UI", system-ui, sans-serif; color: #5b4a12; }
.linha.editada .ferr { position: static; display: inline-flex; margin-left: 6px; vertical-align: baseline; height: auto; }
.linha.editada .lapis { display: none; }
.ferr .mini { font-family: "Segoe UI", system-ui, sans-serif; background: rgba(255,255,255,.35); border-color: #9a8a55; color: #3a2f0c; line-height: 16px; font-size: 11px; }
.ferr .mini:hover { background: rgba(255,255,255,.6); }
.folha :focus-visible { outline-color: var(--foco-papel); }

/* campos dentro do texto */
.campo { font: inherit; color: inherit; vertical-align: baseline; }
input.campo.valor {
  background: rgba(255,255,255,.38); border: 0; border-bottom: 1px solid #5a5650; border-radius: 2px;
  padding: 0 3px; margin: 0 1px; min-width: 3ch; line-height: 1.2; height: 1.3em;
}
input.campo.valor:focus { background: rgba(255,255,255,.7); }
.campo.pendente { box-shadow: 0 0 0 1px #6d5a1c, 0 0 0 3px var(--aviso); }
input.campo.valor.pendente { border-bottom-color: transparent; }
.campo.escolha { display: inline-flex; gap: 2px; padding: 0 1px; border-radius: 3px; margin: 0 1px; vertical-align: baseline; }
.opc {
  font: 12.5px/1.25 "Segoe UI", system-ui, sans-serif; color: var(--papel-texto);
  background: #D3CEC3; border: 1px solid #7d786e; border-radius: 3px; padding: 0 6px; cursor: pointer;
  transition: background-color .12s;
}
.opc:hover { background: #E2DED4; }
.opc[aria-pressed="true"] { background: #22565E; color: #EEF4F3; border-color: #22565E; }
button.campo.escolhida {
  background: none; border: 0; border-bottom: 1px dotted #5a5650; padding: 0; margin: 0; cursor: pointer; border-radius: 0;
}
button.campo.escolhida:hover { background: rgba(255,255,255,.3); }

.edicao {
  width: 100%; font: inherit; color: var(--papel-texto); background: #EDE8DC;
  border: 1px solid #22565E; border-radius: 2px; padding: 1px 4px; resize: none; overflow: hidden; display: block;
}
.ed-acoes { display: flex; gap: 4px; padding: 3px 0 4px; }
.ed-acoes .mini { font-family: "Segoe UI", system-ui, sans-serif; background: #D3CEC3; color: var(--papel-texto); border-color: #7d786e; }
.ed-acoes .mini.sutil { background: none; border-color: transparent; }

/* extras */
.extras { max-width: 860px; margin: 12px auto 0; display: grid; grid-template-columns: 3fr 2fr; gap: 10px; }
.extra { display: flex; flex-direction: column; gap: 3px; color: var(--texto2); font-size: 12px; }
.extra small { color: #6f7a7d; font-size: 11px; }
.extra textarea, .extra input {
  font: 13px/1.35 "Segoe UI", system-ui, sans-serif; color: var(--texto);
  background: var(--painel); border: 1px solid var(--linha); border-radius: 4px; padding: 5px 7px; resize: vertical; min-height: 30px;
}
.extra textarea:focus-visible, .extra input:focus-visible { outline-offset: 0; border-color: var(--destaque); }

/* rodapé */
.rodape {
  display: flex; align-items: center; gap: 16px; height: 30px; padding: 0 14px;
  background: var(--painel); border-top: 1px solid var(--linha); color: var(--texto2); font-size: 12px; white-space: nowrap; overflow: hidden;
}
.rodape .pend { color: var(--aviso); }
.rodape .copiado { color: var(--destaque); }
.rodape .dicas { margin-left: auto; color: #6f7a7d; overflow: hidden; text-overflow: ellipsis; }
.semjs { padding: 20px; }

@media (max-width: 1100px) {
  .folha { padding: 20px 40px 22px 22px; }
  .extras { grid-template-columns: 1fr; }
}

</style>
</head>

<header class="topo">
  <div class="marca">Isodens USG</div>
  <nav class="categorias" id="categorias" aria-label="Categorias"></nav>
  <div class="acoes">
    <span class="aviso-copia" id="avisoCopia" aria-live="polite"></span>

</header>
<div class="mascaras" id="mascaras" role="group" aria-label="Máscaras"></div>
<main class="area">

  </section>
  <section class="col-laudo" aria-label="Laudo">

      <article class="folha" id="folha" aria-label="Laudo"></article>
      <div class="extras">
        <label class="extra">
          <span>Acrescentar texto <small>(parágrafo livre antes da conclusão)</small></span>
          <textarea id="textoExtra" rows="2" spellcheck="true"></textarea>
        </label>
        <label class="extra">
          <span>Item extra de conclusão</span>
          <input id="conclusaoExtra" type="text" autocomplete="off">
        </label>
      </div>
    </div>
    <footer class="rodape" id="rodape" aria-live="polite"></footer>
  </section>
</main>

)."}]},{"linhas":[{"id":"tronco-celiaco","texto":"Tronco Celíaco pérvio, de calibre e trajeto normais. Fluxo de direção aorto-alça."}]},{"linhas":[{"id":"arteria-mesenterica","texto":"Artéria Mesentérica Superior pérvia, de trajeto e calibre normais, medindo {{*}} cm (VR \u003c 0,7 cm). Fluxo de direção aorto-alça. Distância entre a parede anterior da aorta e a Artéria Mesentérica Superior mede {{*}} cm (VR = 1,1 cm)."}]},{"linhas":[{"id":"veia-cava","texto":"Veia Cava Inferior trajeto e calibre normais, medindo {{*}} cm (VR \u003c 3,7 cm), pérvia com fluxo fásico e boa compressibilidade as manobras de compressão distal e Valsalva. Paredes finas e regulares. Ausência de trombose venosa aguda ou antiga."}]},{"linhas":[{"id":"colaterais","texto":"Não visibilizado veias colaterais, à v. gástrica esquerda, ázigos, esplênica, gástricas curtas, esofágicas, hemorroidárias, retroperitoneais, renal esquerda, paraumbilicais e epigástrica."}]},{"linhas":[{"id":"vesicula","texto":"Vesícula biliar de volume normal, sem cálculos no seu interior. Paredes de espessura normal."}]},{"linhas":[{"id":"vias-biliares","texto":"Não há evidência de dilatação das vias biliares intra-hepática. Hepatocolédoco foi visualizado na maior parte do seu trajeto e apresentou calibre normal."}]},{"linhas":[{"id":"pancreas-baco-rins","texto":"Pâncreas, baço e rins com forma, dimensões e demais aspectos morfológicos normais ao método."}]}],"tituloConclusao":"HIPÓTESE DIAGNÓSTICA:","conclusaoNormal":["Estudo ultrassonográfico sem evidentes anormalidades apreciáveis ao método."]},{"id":"abdome-fast","nome":"Abdome total FAST","titulo":"ULTRASSONOGRAFIA DO ABDOME TOTAL (FAST)","blocos":[{"linhas":[{"id":"fast","texto":"Realizado USG de abdome em caráter de emergência, para avaliação de trauma abdominal fechado, direcionado para pesquisa de líquido livre na cavidade abdominal, através do protocolo Focused Assessment with Sonography for Trauma (FAST), que demonstrou ausência de líquido livre intraperitoneal. devido à sobreposição gasosa.","hd":[]}]},{"id":"cauda-pancreas-nao-visibilizada","nome":"Cauda pancreática não visibilizada","substitui":[],"apos":"pancreas","variantes":[{"texto":"Cauda pancreática não visibilizada devido à sobreposição gasosa.","hd":[]}]},{"id":"aorta-parcial","nome":"Aorta parcialmente caracterizada","substitui":["aorta"],"apos":"aorta","variantes":[{"texto":"Aorta parcialmente caracterizada devido à interposição gasosa intestinal, apresentando trajeto e calibre habituais nos segmentos acessíveis.","hd":[]}]},{"id":"vesicula-hipodistendida-jejum","nome":"Vesícula hipodistendida – jejum inadequado","substitui":["vesicula.paredes"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar hipodistendida e de avaliação limitada, provavelmente relacionado ao jejum inadequado, determinando redução da sensibilidade do método.","hd":[]}]},{"id":"nota-retroperitonio-jejum","nome":"Nota – retroperitônio sem jejum","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: O estudo ultrassonográfico apresenta baixa sensibilidade na detecção de patologias do retroperitônio na ausência de preparo com jejum apropriado.","hd":[]}]},{"id":"bexiga-vazia","nome":"Bexiga vazia","frequente":true,"substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga urinária vazia, limitando sua adequada avaliação ecográfica.","hd":[]}]},{"id":"bexiga-baixa-replecao","nome":"Bexiga de baixa repleção","frequente":true,"substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga urinária com conteúdo anecóide de baixa repleção, limitando sua adequada avaliação ecográfica.","hd":[]}]},{"id":"bexiga-media-replecao","nome":"Bexiga de média repleção","frequente":true,"substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga urinária de média repleção, com conteúdo anecoide e parede de espessura normal.","hd":[]}]},{"id":"nota-grande-dificuldade","nome":"Nota – grande dificuldade técnica","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Exame de grande dificuldade técnica devido às condições clínicas do paciente.","hd":[]}]},{"id":"nota-condicoes-clinicas","nome":"Nota – condições clínicas","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Exame realizado com limitações técnicas devido às condições clínicas do paciente.","hd":[]}]},{"id":"nota-queixa-algica","nome":"Nota – queixa álgica","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Exame tecnicamente prejudicado devido à queixa álgica do paciente.","hd":[]}]},{"id":"obs-trato-gastrointestinal","nome":"Obs. – trato gastrointestinal","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: O método ultrassonográfico apresenta baixa sensibilidade para detecção de patologias do trato gastrointestinal.","hd":[]}]},{"id":"obs-apendicite","nome":"Obs. – apendicite precoce","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: O método ultrassonográfico apresenta baixa sensibilidade na detecção de apendicite aguda em fase muito precoce. Sugiro correlação clínico-laboratorial e, a critério, complementação diagnóstica com tomografia computadorizada do abdome e pelve, salvo contraindicações ao método.","hd":[]}]},{"id":"obs-apendicite-mascara","nome":"Obs. – apendicite precoce (máscara)","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: O método ultrassonográfico apresenta baixa sensibilidade na detecção de apendicite aguda em fase muito precoce. Sugiro correlação clínico-laboratorial e complementação diagnóstica com tomografia computadorizada de abdome e pelve, salvo contraindicações inerentes ao método.","hd":[]}]},{"id":"obs-interposicao-alcas","nome":"Obs. – interposição de alças","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: Exame dificultado devido a não penetração adequada de ondas sonoras para definição ecográfica de órgãos abdominais (interposição de alças intestinais).","hd":[]}]},{"id":"obs-urgencia","nome":"Obs. – caráter de urgência","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: Exame realizado em caráter de urgência.","hd":[]}]}]},{"id":"adrenal","nome":"Adrenal","achados":[{"id":"adenoma","nome":"Adenoma de adrenal","substitui":[],"apos":"baco","variantes":[{"texto":"Caracteriza-se formação nodular hipoecogênica, bem delimitada, localizada entre o baço e o rim esquerdo, sem planos de clivagem definidos, na topografia da glândula adrenal esquerda, que ao estudo complementar com Doppler não foi observado vascularização, medindo {{*}} x {{*}} x {{*}} cm, que conforme exame prévio corresponde à nódulo na glândula adrenal esquerda, sugestivo de adenoma.","hd":["Achados sugestivos de adenoma de glândula adrenal {{direita|esquerda}}."]}]},{"id":"adrenais-nao-caracterizadas","nome":"Adrenais não caracterizadas","substitui":[],"apos":"baco","variantes":[{"texto":"As glândulas adrenais não foram individualizadas no presente estudo ultrassonográfico, entretanto, a exclusão de doença relacionada às mesmas não pode ser descartada devido à limitação intrínseca do método. A critério clínico, caso haja indicação de seguimento, sugere-se continuação da avaliação com estudo específico por Tomografia Computadorizada.","hd":["Conveniente prosseguir seguimento por Tomografia com protocolo específico de adrenal, salvo contraindicações."]}]}]},{"id":"alcas-intestinais","nome":"Alças intestinais","achados":[{"id":"apendagite-epiploica","nome":"Apendagite epiplóica","substitui":["alcas"],"apos":"alcas","variantes":[{"texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, evidencia-se estrutura ovalada, na fossa ilíaca esquerda, na borda anti-mesentérica, hiperecogênica com halo hipoecogênico, medindo {{*}} cm, associado a borramento dos planos gordurosos adjacentes. Alças intestinais com peristalse preservada.","hd":["Achados ultrassonográficos que favorecem à possibilidade de apendagite epiplóica, sendo conveniente complementar com estudo tomográfico."]}]},{"id":"apendice-nao-caracterizado","nome":"Apendicite – não caracterizada","substitui":["alcas"],"apos":"alcas","variantes":[{"texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, apresenta-se alças intestinais com peristalse habitual, ecogenicidade da gordura mesentérica preservada, não sendo caracterizado ecograficamente o apêndice cecal. Tais achados não excluem a possibilidade de processo inflamatório/infeccioso do mesmo, caso persista interesse clínico e não haja contra-indicações, um estudo por tomografia poderá trazer maiores informações.","hd":[]}]},{"id":"apendicite-borderline","nome":"Apendicite – borderline","substitui":[],"apos":"alcas","variantes":[{"texto":"Apêndice cecal localizado na topografia da fossa ilíaca direita, {{lateral|medial}} ao ceco, com diâmetro no limite superior da normalidade, medindo até 0,6 mm (VR \u003c6 mm), discreto aumento da vascularização ao estudo complementar Doppler, apresentando paredes finas e compressível em quase toda sua totalidade. Não há resposta álgica referida pelo paciente às manobras compressivas sobre o mesmo. Ressalta-se que o método ultrassonográfico apresenta baixa sensibilidade na detecção de apendicite aguda em fase muito precoce. Sugiro correlação com exames complementares.","hd":[]}]},{"id":"apendicite","nome":"Apendicite","substitui":["alcas"],"apos":"alcas","variantes":[{"nome":"Com apendicolito","texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, evidencia-se estrutura tubular em fundo cego, com paredes espessadas, medindo {{*}} cm (VR ≤0,3 cm), e diâmetro transverso de {{*}} cm (VR ≤0,6 cm), não compressível, associado à formação nodular intraluminal, provida de sombra acústica posterior, medindo {{*}} cm, compatível com apendicolito. Caracteriza-se ainda na região da fossa ilíaca direita alteração da ecogenicidade dos planos adiposos, proeminência dos linfonodos regionais, redução da peristalse das alças intestinais e pequena quantidade de líquido adjacente.","hd":["Achados ultrassonográficos que favorecem à hipótese diagnóstica de apendicite aguda, caso haja um contexto clínico-laboratorial compatível."]},{"nome":"Com apendicolito e hiperemia","texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, evidencia-se estrutura tubular em fundo cego, em topografia medial ao ceco, apresentando paredes espessadas, medindo {{*}} cm (VR \u003c0,3 cm), e diâmetro transverso de {{*}} cm (VR \u003c0,6 cm), ao estudo complementar com Doppler apresenta hiperemia, não compressível e com importante resposta álgica às manobras pressão. Associa-se formação nodular intraluminal, provida de sombra acústica posterior, medindo {{*}} cm, compatível com apendicolito. Caracteriza-se ainda na região da FID alteração da ecogenicidade dos planos adiposos, proeminência dos linfonodos regionais, redução da peristalse das alças intestinais e pequena quantidade de líquido adjacente.","hd":["Achados ultrassonográficos que favorecem à hipótese diagnóstica de apendicite aguda, caso haja um contexto clínico-laboratorial compatível."]},{"nome":"Conteúdo líquido espesso","texto":"Na projeção da fossa ilíaca direita caracteriza-se formação tubuliforme fixa, terminando em fundo cego, localizada medialmente ao ceco, apresentando paredes espessadas e calibre de {{*}} cm, contendo material líquido ecogênico espesso no seu lúmen, associado a hiperecogenicidade da gordura mesentérica adjacente e pequena quantidade de líquido livre. Presença de aumento da vascularização parietal deste segmento de alça.","hd":["Achados ultrassonográficos que favorecem à hipótese diagnóstica de apendicite aguda, caso haja um contexto clínico-laboratorial compatível."]},{"nome":"Paredes pouco espessadas","texto":"Na projeção da fossa ilíaca direita caracteriza-se formação tubuliforme fixa, em fundo cego, localizada medialmente ao ceco, apresentando paredes pouco espessadas, com preservação dos planos parietais e calibre de até {{*}} cm, com conteúdo hipoecóico. Presença de aumento da vascularização parietal deste segmento de alça. Observa-se alça de delgado parética próxima à estrutura supramencionada.","hd":["Achados ultrassonográficos que favorecem à hipótese diagnóstica de apendicite aguda, caso haja um contexto clínico-laboratorial compatível."]}]},{"id":"colite","nome":"Colite – espessamento de alça colônica","substitui":["alcas"],"apos":"alcas","variantes":[{"texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, na topografia da fossa ilíaca {{direita|esquerda}}, evidencia-se, espessamento parietal difuso de alça colônica, medindo até {{*}} cm (VR ≤0,3 cm), associado a borramento dos planos gordurosos e pequena quantidade de líquido adjacente, proeminência de linfonodos regionais, de aspecto reacional, medindo até {{*}} cm, e redução difusa da peristalse das segmentos intestinais.","hd":["Espessamento parietal difuso de alça colônica na fossa ilíaca {{direita|esquerda}}, que dentre os diferenciais, considerar à possibilidade de processo inflamatório/infeccioso, sendo conveniente complementar com estudo tomográfico."]}]},{"id":"constipacao-cronica","nome":"Constipação crônica","substitui":[],"apos":"alcas","variantes":[{"texto":"Acentuado aumento do conteúdo intraluminal das alças intestinais.","hd":["Achados ultrassonográficos sugestivos de constipação crônica, na dependência de correlação clínica."]}]},{"id":"diverticulite","nome":"Diverticulite","substitui":[],"apos":"alcas","variantes":[{"texto":"Caracteriza-se espessamento segmentar circunferencial colônico na transição entre os cólons descendente e sigmoide, medindo {{*}} cm de extensão, associado a formações saculares compatíveis com divertículos, apresentando paredes espessadas e conteúdo gasoso em seu interior. Associa-se hiperecogenicidade da gordura pericólica e pequena quantidade de líquido livre adjacente.","hd":["O conjunto de achados ultrassonográficos favorecem a possibilidade de processo inflamatório/infeccioso, que dentre os diferenciais, sugere doença diverticular aguda, sendo conveniente complementar com estudo tomográfico."]}]},{"id":"doenca-de-crohn","nome":"Doença de Crohn","substitui":[],"apos":"alcas","variantes":[{"texto":"Caracterizam-se espessamentos da submucosa parietal em alças intestinais na fossa ilíaca direita, flanco direito, cólon ascendente/íleo terminal, associado a hiperecogenicidade da gordura pericólica e pequena quantidade de líquido livre adjacente.","hd":["Espessamento da submucosa de alças intestinais, associado a hiperecogenicidade da gordura pericólica, de aspecto compatível com o relato clínico de acometimento por Doença de Crohn."]}]},{"id":"enterite","nome":"Enterite","substitui":["alcas"],"apos":"alcas","variantes":[{"texto":"Nas regiões de mesogástrio e hipogástrio são visualizadas alças intestinais com paredes discretamente espessadas, e distendidas por conteúdo líquido com moderados ecos em suspensão (debris) de permeio, associado a aumento da peristalse. Associam-se ainda alguns linfonodos mesentéricos de dimensões aumentadas e globosos, medindo até {{*}} cm. O conjunto de achados é sugestivo de processo inflamatório/infeccioso.","hd":["Dentre as hipóteses diagnósticas considerar a possibilidade de processo inflamatório/infeccioso da mucosa intestinal."]}]},{"id":"estenose-hipertrofica-piloro","nome":"Estenose hipertrófica do piloro","substitui":[],"apos":"alcas","variantes":[{"texto":"Na região epigástrica intraperitoneal, medialmente à vesícula biliar, caracteriza-se estrutura hipoecogênica e tuboliforme, compatível com piloro, apresentando aumento da espessura da camada muscular, que mede {{*}} cm (VR ≤0,3 cm), aumento do comprimento longitudinal, medindo {{*}} cm (VR ≤1,7 cm), aumento do diâmetro transversal, medindo {{*}} cm (VR ≤1,3 cm), e aumento do volume estimado, medindo {{*}} cm³ (VR ≤1,4 cm³), sem sinais de abertura significativa da luz. Observa-se ainda peristalse gástrica exagerada que cessa de modo abrupto na margem da região antro-pilórica, associado à ondas peristálticas retrógradas e ausência de relaxamento habitual do piloro, que determina redução da passagem do conteúdo gástrico para o duodeno, levando a retardo no esvaziamento gástrico.","hd":["Alterações sugestivas de estenose hipertrófica do piloro."]}]},{"id":"fecaloma","nome":"Fecaloma","substitui":[],"apos":"alcas","variantes":[{"texto":"Formação linear hiperrefringente, de morfologia convexa, produtora de exuberante sombra acústica posterior, localizada na topografia do hipogástrio, sugestiva de abundante conteúdo fecalóide no {{sigmóide|ampola retal}} (fecaloma?).","hd":["Alterações sugestivas de abundante conteúdo fecal no {{sigmóide|ampola retal}} (Fecaloma?)."]}]},{"id":"gastroenterite","nome":"Gastroenterite (GECA)","substitui":["alcas"],"apos":"alcas","variantes":[{"texto":"Nas regiões de mesogástrio, hipogástrio e fossas ilíacas são visualizadas alças intestinais com paredes discretamente espessadas e distendidas por conteúdo líquido com moderados debris e peristalse {{preservada|acentuada}}.","hd":["Dentre as hipóteses diagnósticas considerar a possibilidade de processo inflamatório/infeccioso da mucosa gastrointestinal (gastroenterite)."]}]},{"id":"ileite","nome":"Ileíte – espessamento do íleo terminal","substitui":[],"apos":"alcas","variantes":[{"texto":"Espessamento parietal concêntrico e simétrico segmentar do íleo terminal, determinando redução de sua luz, associado à perda parcial da estratificação dos planos parietais, caracterizando-se ainda espessamento parietal do ceco. Proeminência de linfonodos mesentéricos regionais, medindo até {{*}} cm, de aspecto reacional.","hd":["Espessamento parietal difuso do íleo terminal e do ceco, que dentre os diferenciais, considerar à possibilidade de processo inflamatório/infeccioso, sendo conveniente complementar com estudo tomográfico."]}]},{"id":"intussuscepcao","nome":"Intussuscepção / invaginação intestinal","substitui":[],"apos":"alcas","variantes":[{"nome":"Pesquisa negativa","texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, não evidenciou formação sugestiva de intussuscepção intestinal. Ecogenicidade da gordura mesentérica e peristalse de alças intestinais preservadas.","hd":[]},{"nome":"Lesão em alvo","texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, evidencia-se formação em aspecto de \"lesão em alvo\", na topografia do {{*}}, medindo {{*}} x {{*}} cm, com camada externa de {{*}} cm de espessura, sem caracterização de causa secundária pelo método ecográfico.","hd":["Alterações sugestivas de intussuscepção intestinal."]}]},{"id":"intussuscepcao-dii","nome":"Intussuscepção + doença inflamatória intestinal","substitui":["liquido-livre","alcas"],"apos":"alcas","variantes":[{"texto":"Moderada quantidade de líquido livre na cavidade abdominal e acentuada distensão de alças intestinais.\nNo flanco direito evidencia-se alça intestinal com espessamento parietal concêntrico, medindo {{*}} cm (VR ≤0,3 cm), múltiplas camadas ecogênicas concêntricas com halo hipoecogênico, assumindo aspecto de \"lesão em alvo\", espessamento do meso adjacente e ausência de peristalse. Ao estudo complementar com Doppler, caracteriza-se fluxo apenas no intussuscepto (segmento invaginado).","hd":["Alterações sugestivas de intussuscepção intestinal e doença inflamatório intestinal."]}]},{"id":"fossas-iliacas-normal","nome":"Fossas ilíacas sem alterações (sonda linear)","frequente":true,"substitui":[],"apos":"liquido-livre","variantes":[{"texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido em fossas ilíacas, não evidenciou aumento da ecogenicidade da gordura mesentérica e não caracterizou o apêndice cecal.","hd":[]}]}]},{"id":"cavidade-abdominal","nome":"Cavidade abdominal","achados":[{"id":"adenite-mesenterica","nome":"Adenite mesentérica","substitui":["alcas"],"apos":"alcas","variantes":[{"texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, na topografia das fossas ilíacas e região peri-umbilical, evidencia-se linfonodos levemente aumentados, com preservação da relação cortico-hilar, medindo até {{*}} cm, com ecogenicidade da gordura mesentérica preservada, alças intestinais com peristalse habitual, não sendo caracterizado ecograficamente o apêndice cecal.","hd":["Linfonodos intraperitoneais levemente aumentados, sugestivo de adenite mesentérica."]}]},{"id":"ascite","nome":"Ascite / líquido livre","substitui":["liquido-livre"],"apos":"liquido-livre","variantes":[{"nome":"Espaço hepatorrenal","texto":"Presença de líquido livre no espaço hepatorrenal com {{*}} cm de espessura.","hd":["Ascite em {{pequeno|moderado|acentuado}} volume."]},{"nome":"Espaço esplenorrenal","texto":"Presença de líquido livre no espaço esplenorrenal com {{*}} cm de espessura.","hd":["Ascite em {{pequeno|moderado|acentuado}} volume."]},{"nome":"Pelve","texto":"Presença de líquido livre na pelve com {{*}} cm de espessura.","hd":["Ascite em {{pequeno|moderado|acentuado}} volume."]},{"nome":"Cavidade e retroperitônio","texto":"Liquido livre cavidade peritoneal e no retroperitônio.","hd":["Ascite em {{pequeno|moderado|acentuado}} volume."]},{"nome":"Por volume","texto":"Presença de líquido livre anecóide e homogêneo intraperitoneal em {{pequeno|moderado|acentuado}} volume.","hd":["Ascite em {{pequeno|moderado|acentuado}} volume."]},{"nome":"Difuso","texto":"Caracteriza-se líquido intraperitoneal com aspecto anecóide e homogêneo, estendendo-se do fundo de saco posterior e goteiras parietocólicas até os espaços hepato e esplenorrenais.","hd":["Ascite em {{pequeno|moderado|acentuado}} volume."]}]},{"id":"aderencias","nome":"Aderências abdominais","substitui":[],"apos":"alcas","variantes":[{"nome":"Envolvendo alças","texto":"Formações envolvendo às alças intestinais sugestivas de aderências.","hd":["Formações sugestivas de aderências em cavidade abdominal."]},{"nome":"Sítio de colecistectomia","texto":"Presença de formações sugestivas de aderências em cavidade abdominal, mais evidente ao redor do sítio cirúrgico da colecistectomia.","hd":["Formações sugestivas de aderências em cavidade abdominal."]}]},{"id":"colecao-hematica","nome":"Coleção hemática","substitui":[],"apos":"liquido-livre","variantes":[{"texto":"Formação expansiva heterogênea, predominantemente hipoecóica e com finas septações, medindo aproximadamente {{*}} x {{*}} x {{*}} cm, e volume estimado em {{*}} cm³, localizada na região anterior uterina, na interface com a bexiga, podendo corresponder à coleção de origem hemática.","hd":["Achados sugestivos de coleção hemática intraperitoneal."]}]},{"id":"carcinomatose-peritoneal","nome":"Carcinomatose peritoneal","substitui":["liquido-livre"],"apos":"liquido-livre","variantes":[{"texto":"{{Pequena|Moderada|Acentuada}} quantidade de líquido livre intraperitoneal, de aspecto anecóide e com finos ecos em suspensão (debris), podendo corresponder a celularidade dentro deste contexto, associado a espessamento peritoneal e múltiplas formações nodulares sólidas e heterogêneas aderidas, sem calcificações de permeio, com margens irregulares, esparsas por toda a cavidade, a maior localizada na topografia {{*}}, medindo até {{*}} cm. Caracteriza-se ainda espessamento, nodulações e hiperrefringência omental (cake omental), e centralização \"em bloco\" das alças intestinais na linha mediana, inferindo infiltração mesentérica. O conjunto destes achados é sugestivo de carcinomatose peritoneal.","hd":["Achados ultrassonográficos sugestivos de carcinomatose peritoneal. A critério clínico sugiro prosseguir propedêutica diagnóstica."]}]},{"id":"cateter-dvp","nome":"Cateter de DVP","substitui":[],"apos":"liquido-livre","variantes":[{"texto":"Cateter de derivação ventrículo peritoneal com extremidade distal na região mesogástrica à esquerda, identificando-se pequena quantidade de líquido adjacente.","hd":["Catéter de DVP intraperitoneal."]}]}]},{"id":"baco","nome":"Baço","achados":[{"id":"baco-acessorio","nome":"Baço acessório","substitui":[],"apos":"baco","variantes":[{"texto":"Formação nodular sólida, de contornos bem definidos e regulares, isoecogênica ao parênquima esplênico, localizada infero-medialmente ao baço, medindo {{*}} cm, compatível com baço acessório (variante anatômica).","hd":["Formação nodular sugestiva de baço acessório"]}]},{"id":"calcificacao-esplenica","nome":"Calcificação esplênica","substitui":["baco"],"apos":"baco","variantes":[{"texto":"Baço com dimensões conservadas, morfologia habitual e ecotextura homogênea, exceto por pequenos granulomas residuais calcificados esparsos pelo parênquima.","hd":["Pequenas calcificações no parênquima esplênico, de aspecto sequelar."]}]},{"id":"cisto-esplenico","nome":"Cisto esplênico","substitui":["baco"],"apos":"baco","variantes":[{"texto":"Baço de dimensões normais, morfologia habitual e ecotextura homogênea, exceto por formação anecóica, de paredes finas e regulares, com reforço acústico posterior, medindo {{*}} x {{*}} cm, localizado {{*}}.","hd":["Formação sugestiva de cisto esplênico."]}]},{"id":"esplenectomia","nome":"Esplenectomia","substitui":["baco"],"apos":"baco","variantes":[{"nome":"Pós-operatório","texto":"Baço não caracterizado (status pós-operatório).","hd":["Esplenectomia total."]},{"nome":"Auto-esplenectomia","texto":"Baço não caracterizado, podendo corresponder à auto-esplenectomia.","hd":["Achado sugestivo de auto-esplenectomia."]}]},{"id":"esplenose","nome":"Esplenectomia com esplenose","substitui":["baco"],"apos":"baco","variantes":[{"texto":"Baço não caracterizado (status pós-operatório). Notam-se na loja esplênica algumas formações nodulares sólidas, de contornos arredondados, com ecotextura semelhante à esplênica, medindo até {{*}} cm.","hd":["Esplenectomia, com nodulações na loja esplênica, sugestivas de esplenose / remanescentes esplênicos."]}]},{"id":"esplenomegalia","nome":"Esplenomegalia","substitui":["baco"],"apos":"baco","variantes":[{"nome":"Leve","texto":"Baço de morfologia, contornos e ecotextura normais, com dimensões aumentadas, medindo {{*}} cm em seu maior eixo longitudinal (VR ≤12,0 cm).","hd":["Esplenomegalia homogênea leve."]},{"nome":"Volumosa","texto":"Baço de dimensões acentuadamente aumentadas, medindo cerca de {{*}} cm em seu maior eixo longitudinal (VR ≤12,0 cm), ultrapassando a linha média e estendendo-se para a fossa ilíaca esquerda, determinando compressão de estruturas adjacentes.","hd":["Esplenomegalia volumosa."]}]},{"id":"hemangioma-esplenico","nome":"Hemangioma esplênico","substitui":[],"apos":"baco","variantes":[{"texto":"Formação nodular sólida, no terço {{superior|médio|inferior}} esplênico, de contornos bem definidos e lobulados, hiperecogênica e homogênea, desprovida de sombra acústica posterior, sem fluxo ao estudo complementar com Doppler, medindo {{*}} cm.","hd":["Formação nodular esplênica sugestiva de hemangioma."]}]},{"id":"trauma-esplenico","nome":"Trauma esplênico","substitui":["baco"],"apos":"baco","variantes":[{"texto":"Baço com dimensões aumentadas e ecogenicidade difusamente heterogênea, podendo corresponder lesão esplênica. A critério clínico um estudo por Tomografia Computadorizada com contraste poderá trazer informações adicionais, salvo contraindicações.","hd":["Achados sugestivos de trauma esplênico."]}]}]},{"id":"figado","nome":"Fígado","achados":[{"id":"avaliacao-limitada","nome":"Avaliação limitada","substitui":["figado.parenquima"],"apos":"figado","variantes":[{"texto":"Parênquima hepático aparentemente homogêneo, com ecotextura e ecogenicidade habituais, entretanto, de avaliação limitada ao método devido à elevação diafragmática, e limitação do paciente em realizar e manter a inspiração forçada.","hd":[]}]},{"id":"abscesso-hepatico","nome":"Abscesso hepático","substitui":[],"apos":"figado","variantes":[{"texto":"Formação cística, de paredes espessas e irregulares, conteúdo anecóide com moderados debris e traves de permeio (cístico-espesso), com fluxo periférico ao estudo complementar com Doppler, ocupando o segmento hepático {{*}}, medindo cerca de {{*}} cm (AP x LL x CC) e volume estimado de {{*}} cm³, distando {{*}} cm da superfície hepática.","hd":["Formação cístico-espessa, sugestiva de abscesso hepático."]}]},{"id":"aerobilia","nome":"Aerobilia / pneumobilia","substitui":[],"apos":"vias-biliares","variantes":[{"texto":"Formações lineares hiperrefringentes e produtoras de reverberações proeminentes do feixe acústico posterior, com distribuição predominantemente central e que acompanha a tríade portal, sugestivo de aerobilia.","hd":["Achados ultrassonográficos sugestivos de aerobilia/pneumobilia."]}]},{"id":"lobo-de-riedel","nome":"Alongamento hepático / lobo de Riedel","substitui":["figado.morfologia"],"apos":"figado","variantes":[{"texto":"Fígado de morfologia e contornos normais, apresentando alongamento vertical do lobo hepático direito, medindo {{*}} cm longitudinal (VR ≤15,0 cm).","hd":["Achados sugestivos de Lobo de Riedel (variante anatômica)."]}]},{"id":"calcificacao-hepatica","nome":"Calcificação hepática","substitui":[],"apos":"figado","variantes":[{"texto":"Foco hiperecogênico, irregular, provido de sombra acústica posterior, localizada no segmento hepático {{*}}, medindo aproximadamente {{*}} cm.","hd":["Calcificação hepática de aspecto sequelar."]}]},{"id":"cisto-hepatico","nome":"Cisto hepático","frequente":true,"substitui":[],"apos":"figado","variantes":[{"nome":"Único","texto":"Caracteriza-se formação cística, de paredes finas e regulares, conteúdo anecóide e homogêneo, localizada no segmento hepático {{*}}, medindo {{*}} cm.","hd":["Cisto(s) hepático(s)."]},{"nome":"Múltiplos","texto":"Caracteizam-se formações císticas, de paredes finas e regulares, conteúdo anecóide homogêneo, medindo até {{*}} cm, no segmento hepático {{*}}.","hd":["Cisto(s) hepático(s)."]}]},{"id":"esteatose-difusa","nome":"Esteatose hepática difusa","frequente":true,"substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"nome":"Leve","texto":"Fígado de morfologia, contornos e dimensões normais, apresentando leve aumento difuso da ecogenicidade.","hd":["Alterações sugestivas de leve infiltração gordurosa hepática."]},{"nome":"Moderada/acentuada","texto":"Fígado de morfologia, contornos e dimensões normais, apresentando {{moderado|acentuado}} aumento difuso da ecogenicidade com atenuação do feixe acústico posterior, o que limita a identificação de eventuais alterações parenquimatosas focais.","hd":["Alterações sugestivas de {{moderada|acentuada}} infiltração gordurosa hepática."]}]},{"id":"esteatose-preservacao-focal","nome":"Esteatose + preservação focal","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"nome":"Leve","texto":"Fígado de morfologia, contornos e dimensões normais, apresentando leve aumento difuso de sua ecogenicidade com área hipoecogênica de permeio, mal definida, no segmento hepático {{*}}, medindo cerca de {{*}} cm, notando-se vasos hepáticos transpondo referida área, sem distorções ou deslocamentos, sugerindo área de preservação focal.","hd":["Achados sugestivos de leve infiltração gordurosa hepática, associado à área de preservação focal."]},{"nome":"Moderada/acentuada com hepatomegalia","texto":"Fígado de morfologia e contornos normais, com dimensões aumentadas, medindo o lobo esquerdo {{*}} cm (VR ≤10,0 cm) e o lobo direito {{*}} cm (VR ≤15,0 cm), apresentando {{moderado|acentuado}} aumento difuso da ecogenicidade, com área hipoecogênica de permeio, mal definida, no segmento hepático {{*}}, medindo cerca de {{*}} cm, notando-se vasos hepáticos transpondo referida área, sem distorções ou deslocamentos, sugerindo área de preservação focal.","hd":["Achados sugestivos de {{moderada|acentuada}} infiltração gordurosa hepática, associado à área de preservação focal e hepatomegalia."]}]},{"id":"figado-policistico","nome":"Fígado policístico","substitui":["figado.parenquima"],"apos":"figado","variantes":[{"texto":"Caracteriza-se múltiplas formações císticas esparsas pelo parênquima hepático, sem evidências de hemorragias ou debris em seu interior.","hd":["Achados ultrassonográficos sugestivos de fígado policístico."]}]},{"id":"hamartomas-biliares","nome":"Hamartomas biliares","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de morfologia, contornos e dimensões habituais, com ecotextura normal, exceto por apresentar múltiplas pequenas formações ecogênicas esparsas, acompanhando a tríade portal, medindo até {{*}} cm, sugestivas de hamartomas biliares.","hd":["Alterações sugestivas de hamartomas biliares."]}]},{"id":"hepatomegalia","nome":"Hepatomegalia","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de morfologia, contornos e ecotextura normais, apresentando dimensões aumentadas. Medindo nos eixos longitudinais, o lobo esquerdo {{*}} cm (VR ≤10 cm) e lobo direito {{*}} cm (VR ≤15 cm).","hd":["Alterações sugestivas de hepatomegalia homogênea {{leve|moderada|acentuada}}."]}]},{"id":"hemangioma-hepatico","nome":"Hemangioma hepático","substitui":[],"apos":"figado","variantes":[{"texto":"Formação nodular sólida, de contornos bem definidos e lobulados, hiperecogênica e homogênea, desprovido de sombra acústica posterior, sem fluxo ao estudo complementar com Doppler, no segmento hepático {{*}}, medindo {{*}} cm.","hd":["Nódulo hepático sugestivo de hemangioma. A critério clínico sugiro complementar estudo com tomografia contrastada para melhor avaliação."]}]},{"id":"hemangiotelioma","nome":"Hemangiotelioma","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de dimensões aumentadas e textura parenquimatosa heterogênea, devido à formação expansiva ovalada, parcialmente exofítica, de limites bem definidos, heterogênea, com áreas hipercogenicas de permeio e sombra acústica posterior, compatíveis com calcificações, localizada nos segmentos VI/VII, caracterizando importante vascularização ao estudo complementar com Doppler, predominantemente periférica, medindo {{*}} x {{*}} x {{*}} cm, e volume estimado de {{*}} cm³.","hd":["Achados ultrassonográficos sugestivos de hemangiotelioma. A critério clínico sugiro complementar estudo com tomografia contrastada para melhor avaliação."]}]},{"id":"hepatite-aguda","nome":"Hepatite aguda","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de dimensões discretamente aumentadas, medindo {{*}} cm (VR ≤15,0 cm), com redução difusa da ecogenicidade hepática, associado a leve aumento da refringência peri-portal, assumindo aspecto em \"céu estrelado\".","hd":["Alterações sugestivas de doença hepática parenquimatosa aguda (hepatite)."]}]},{"id":"hepatimetria","nome":"Hepatimetria","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de volume, contornos regulares, ecotextura e ecogenicidade normais.\nLobo direito medindo {{*}} cm e lobo esquerdo medindo {{*}} cm abaixo das respectivas cúpulas diafragmáticas (normal: lobo direito até 15 cm e lobo esquerdo até 10 cm).","hd":[]}]},{"id":"hepatopatia-cronica","nome":"Hepatopatia crônica / cirrose","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de dimensões reduzidas, com sinais de hipertrofia compensatória dos lobos caudado e esquerdo. Apresenta bordos rombos e contornos serrilhados, com ecotextura difusamente heterogênea, sem a caracterização de lesões focais bem definidas.","hd":["Alterações sugestivas de hepatopatia crônica."]}]},{"id":"hepatopatia-cronica-2","nome":"Hepatopatia crônica / cirrose 2","substitui":["figado.morfologia","figado.parenquima","figado","vasos-hepaticos"],"apos":"figado","variantes":[{"texto":"Fígado de contornos serrilhados, bordas rombas, com lobo direito de dimensões reduzidas e lobo caudado aumentado e globoso, associado a espessamento dos ligamentos hepáticos e ecotextura parenquimatosa difusamente grosseira e heterogênea. Relação dos diâmetros transversos do lobo caudado/lobo direito de {{*}} (VR ≤0,65).\nVeia porta de trajeto e calibre normais, medindo {{*}} cm (VR ≤1,3 cm), com fluxo hepatopetal.","hd":["Alterações sugestivas de hepatopatia crônica."]}]},{"id":"hepatopatia-hipertensao-portal","nome":"Cirrose + hipertensão portal","substitui":["figado.morfologia","figado.parenquima","figado","vasos-hepaticos"],"apos":"figado","variantes":[{"texto":"Fígado de contornos serrilhados, bordas rombas, com lobo direito de dimensões reduzidas e lobo caudado aumentado e globoso, associado a espessamento dos ligamentos hepáticos e ecotextura parenquimatosa difusamente grosseira e heterogênea. Relação dos diâmetros transversos do lobo caudado/lobo direito de {{*}} (VR ≤0,65).\nVeia porta de trajeto habitual apresentando calibre aumentado, medindo {{*}} cm (VR ≤1,3 cm), com fluxo hepatofugal.\nDilatação e tortuosidade de vasos peri-esofágicos, peri-gástricos, peri-hepáticos e peri-esplênicos, medindo até {{*}} cm.","hd":["Alterações sugestivas de hepatopatia crônica com hipertensão portal."]}]},{"id":"hepatopatia-nodulos","nome":"Cirrose + múltiplos nódulos","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de contornos serrilhados, bordas rombas, com lobo direito de dimensões reduzidas e lobo caudado aumentado e globoso, associado a espessamento dos ligamentos hepáticos. Parênquima de ecotextura grosseiramente heterogêneo com múltiplos nódulos sólidos, esparsos, hipoecogênicos, de contornos parcialmente obscurecidos, medindo até {{*}} cm no segmento {{*}}. Lobo esquerdo mede {{*}} cm (VR ≤10,0 cm) e o lobo direito mede {{*}} cm (VR ≤15,0 cm).","hd":["Alterações sugestivas de hepatopatia parenquimatosa crônica com múltiplos nódulos hepáticos."]}]},{"id":"fibrose-periportal","nome":"Fibrose peri-portal / esquistossomose","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de contornos discretamente serrilhados e dimensões reduzidas, associado a espessamento dos ligamentos hepáticos e aumento da refringência peri-portal.","hd":["Alterações sugestivas de hepatopatia parenquimatosa com sinais de fibrose peri-portal, que dentre os diferenciais, há possibilidade de corresponder à esquistossomose."]}]},{"id":"massa-hepatica","nome":"Massa hepática","substitui":["figado.morfologia","figado"],"apos":"figado","variantes":[{"texto":"Fígado com contorno lobulado e dimensões aumentadas, à custa de volumosa massa, sólida, de contornos irregulares, conteúdo heterogêneo, com calcificações de permeio, fluxo central e periférico ao estudo complementar com Doppler, ocupando os segmentos hepáticos {{*}}, medindo aproximadamente {{*}} cm. Placa hilar e ramos portais principais preservados.","hd":["Volumosa massa hepática. Conveniente prosseguir investigação diagnóstica, um estudo tomográfico poderá trazer maiores informações."]}]},{"id":"portograma-aereo","nome":"Portograma aéreo","substitui":[],"apos":"figado","variantes":[{"texto":"Formações lineares hiperrefringentes e produtoras de reverberações proeminentes do feixe acústico posterior, com distribuição que se estende até a periferia hepática acompanhando a tríade portal, sugestivo de portograma aéreo.","hd":["Achados ultrassonográficos sugestivos de portograma aéreo."]}]},{"id":"metastases","nome":"Nódulos hepáticos secundários / metástases","substitui":["figado.parenquima"],"apos":"figado","variantes":[{"texto":"Parênquima hepático homogêneo, com ecotextura e ecogenicidade preservadas, exceto por formações nodulares sólidas, com contornos bem definidos e arredondados, apresentando conteúdo hipoecogênico e com halo hipoecóico periférico, que determinam efeito de massa, deslocando as estruturas vasculares adjacentes, assim dispostos: - segmento {{*}}, medindo {{*}} cm; - segmento {{*}}, medindo {{*}} cm.","hd":["Múltiplos nódulos hepáticos, que dentre os diferenciais, há possibilidade de acometimento de natureza secundária, sendo conveniente prosseguir investigação diagnóstica."]}]},{"id":"tumor-de-klatskin","nome":"Tumor de Klatskin / colangiocarcinoma","substitui":["vias-biliares.intra"],"apos":"vias-biliares","variantes":[{"texto":"Vias biliares intra-hepáticas dilatadas, medindo até {{*}} cm à esquerda e {{*}} cm à direita (VR ≤0,25 cm), com aparente amputação ao nível da placa hilar.","hd":["Dilatação das vias biliares intra-hepáticas com sinais de amputação ao nível da placa hilar, que dentre os diferenciais, há possibilidade de corrresponder à Tumor de Klatskin. Conveniente prosseguir investigação diagnóstica."]}]},{"id":"esteatose-leve","nome":"Esteatose leve","frequente":true,"substitui":["figado.parenquima"],"apos":"figado","variantes":[{"texto":"Parênquima hepático apresentando discreto aumento difuso e homogêneo da ecogenicidade. Tal achado não é específico, porém pode corresponder mais frequentemente a sinais de discreta deposição gordurosa hepática (esteatose).","hd":["Sinais de discreta deposição gordurosa hepática (esteatose)."]}]},{"id":"esteatose-moderada-acentuada","nome":"Esteatose moderada/acentuada","frequente":true,"substitui":["figado.parenquima"],"apos":"figado","variantes":[{"texto":"Parênquima hepático apresentando {{moderado|acentuado}} aumento difuso da ecogenicidade, com atenuação do feixe acústico posterior, o que limita a identificação de eventuais alterações parenquimatosas focais. Tal achado não é específico, porém pode corresponder mais frequentemente a sinais de {{moderada|acentuada}} deposição gordurosa hepática (esteatose).","hd":["Sinais de {{moderada|acentuada}} deposição gordurosa hepática (esteatose)."]}]}]},{"id":"pancreas","nome":"Pâncreas","achados":[{"id":"adenoma-microcistico","nome":"Adenoma microcístico","substitui":[],"apos":"pancreas","variantes":[{"texto":"Caracteriza-se formação nodular sólido-cística, apresentando pequenas formações císticas em seu interior, com margens mal definidas, localizada na transição do corpo com a cauda pancreática, medindo {{*}} x {{*}} cm. Ao estudo complementar com Doppler não foi observado vascularização significativa. Estes achados são de etiologia não específica pelo método, devendo-se considerar entre os diagnósticos diferenciais a possibilidade de adenoma microcístico.","hd":["Formação nodular na transição do corpo com cauda pancreática, de etiologia inespecífica pelo método, devendo se considerar entre os diagnósticos diferenciais adenoma microcístico. A critério clínico conveniente prosseguir investigação diagnóstica com ressonância magnética."]}]},{"id":"cisto-pancreatico","nome":"Cisto pancreático","substitui":["pancreas"],"apos":"pancreas","variantes":[{"texto":"Pâncreas visibilizado segmentos da cabeça e corpo, com dimensões normais, limites precisos e ecotextura típica, exceto por formação anecóica, de limites precisos e contornos regulares, com reforço acústico posterior, medindo {{*}} x {{*}} cm, localizado na {{cabeça|corpo}}.","hd":["Achados ultrassonográficos sugestivos de cisto pancreático."]}]},{"id":"dilatacao-wirsung","nome":"Dilatação do ducto pancreático principal","substitui":["pancreas"],"apos":"pancreas","variantes":[{"texto":"Os segmentos visibilizados do pâncreas são de topografia, dimensões e ecogenicidade habituais. Caracterizando dilatação do ducto pancreático principal (Wirsung), medindo {{*}} cm (VR Cabeça ≤ 3,0mm / Corpo ≤ 2,1mm / Cauda ≤1,6mm) sem identificar o fator causal ao método. Caso haja indicação clínica, prosseguir investigação com TC/RM.","hd":["Dilatação do ducto pancreático, sem identificar o fator causal ao método."]}]},{"id":"pancreatite-aguda","nome":"Pancreatite aguda","substitui":["pancreas"],"apos":"pancreas","variantes":[{"texto":"Pâncreas de contornos irregulares e parcialmente obscurecidos, com hipoecogenicidade textural difusa e dimensões aumentadas, medindo a cabeça {{*}} cm (VR ≤3,0 cm), corpo {{*}} cm (VR ≤2,0 cm) e cauda {{*}} cm (VR ≤1,5 cm). Ducto de Wirsung de calibre preservado.","hd":["Alterações parenquimatosas pancreática sugestivas de processo inflamatório agudo (pancreatite)."]}]},{"id":"pancreatopatia-cronica","nome":"Pancreatopatia crônica","substitui":["pancreas"],"apos":"pancreas","variantes":[{"texto":"Pâncreas de dimensões normais, com contornos lobulados e focos irregulares de calcificações, medindo até {{*}} cm, localizadas nas regiões da cabeça e corpo. Ducto de Wirsung ectasiado, com calibre de {{*}} cm (VR Cabeça ≤ 3,0mm / Corpo ≤ 2,1mm / Cauda ≤1,6mm) e aspecto levemente tortuoso.","hd":["Alterações sugestivas de pancreatopatia crônica."]}]},{"id":"pancreas-gorduroso","nome":"Pâncreas gorduroso / lipossubstituído","substitui":["pancreas"],"apos":"pancreas","variantes":[{"texto":"Pâncreas de morfologia, contornos e dimensões normais, com aumento difuso de sua ecogenicidade, sugerindo infiltração gordurosa.","hd":["Alterações sugestivas de infiltração gordurosa pancreática (senilidade? diabetes?)."]}]},{"id":"tumor-cabeca-pancreas","nome":"Tumor de cabeça de pâncreas","substitui":["vias-biliares.intra","vias-biliares.coledoco","vias-biliares","pancreas","vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vias-biliares","variantes":[{"texto":"Vias biliares intra-hepáticas de calibres aumentados, medindo {{*}} cm à esquerda e {{*}} cm à direita (VR ≤0,25 cm).\nHepatocolédoco de calibre aumentado, medindo {{*}} cm (VR ≤ 0,6 cm), notando-se à cerca de {{*}} cm da porta hepatis afilamento gradual, assumindo aspecto em \"bico de pássaro\", à medida que se relaciona com uma massa sólida, hipoecogênica, localizada na topografia da cabeça pancreática, de contornos regulares e parcialmente obscurecidos, heterogênea, com fluxo periférico ao estudo complementar com Doppler, medindo {{*}} cm (AP x LL x CC). Ducto de Wirsung de calibre aumentado, medindo {{*}} cm (VR Cabeça ≤ 3,0mm / Corpo ≤ 2,1mm / Cauda ≤1,6mm).\nVesícula biliar hiperdistendida, medindo {{*}} cm, com paredes finas e lisas. O conteúdo vesicular apresenta-se anecóide, sem cálculos no interior. Sinal de Murphy ultrassonográfico negativo.","hd":["Massa sólida na topografia da cabeça pancreática, determinando dilatação das vias biliares intra e extra-hepáticas, sendo conveniente prosseguir investigação diagnóstica."]}]},{"id":"pancreas-parcial","nome":"Pâncreas parcialmente visibilizado","frequente":true,"substitui":["pancreas","aorta"],"apos":"pancreas","variantes":[{"texto":"Cabeça e corpo pancreático de morfologia, contornos, dimensões e ecotextura habituais. Restante do pâncreas e demais estruturas do retroperitônio não visualizados devido à sobreposição gasosa de alças intestinais.","hd":[]}]}]},{"id":"retroperitoneo","nome":"Retroperitônio","achados":[{"id":"ateromatose-aortica","nome":"Ateromatose aórtica","substitui":["aorta"],"apos":"aorta","variantes":[{"nome":"Placas calcificadas esparsas","texto":"Aorta com trajeto e calibre habituais. Caracterizando pequenas placas ateromatosas calcificadas esparsas.","hd":["Ateromatose aórtica."]},{"nome":"Placas em todo o trajeto","texto":"Aorta de calibre habitual e paredes irregulares, apresentando placas hiperecogênicas em todo o seu trajeto, sem evidências de obstrução luminal, com pulsatilidade diminuída.","hd":["Ateromatose aórtica."]},{"nome":"Formações aderidas às paredes","texto":"Aorta abdominal apresentando formações hiperecogênicas aderidas às suas paredes, sugerindo alterações ateromatosas.","hd":["Ateromatose aórtica."]}]},{"id":"aneurisma-aorta","nome":"Aneurisma de aorta abdominal","substitui":["aorta"],"apos":"aorta","variantes":[{"texto":"Aorta abdominal pérvia, com calcificações parietais ateromatosas {{leves|grosseiras}} associado à dilatação aneurismática {{fusiforme|sacular}} em seu segmento {{supra|infra}}-renal, distando {{*}} cm da emergência das artérias renais, medindo {{*}} cm (AP x T) e extensão de {{*}} cm, com trombos murais semi-circunferenciais laminares, que determinam redução da luz efetiva em cerca de {{*}} %, com fluxo turbilhonado ao estudo complementar com Doppler. O colo proximal do aneurisma tem calibre transverso de {{*}} cm.\nDiâmetro aórticos:\n- Transição tóraco-abdominal: {{*}} cm (VR ≤2,5 cm);\n- Nível da artéria mesentérica superior: {{*}} cm (VR ≤2,5 cm);\n- Nível da bifurcação das ilíacas: {{*}} cm (VR ≤3,0 cm);\n- Artérias ilíacas comuns apresentam-se pérvias, com calibre e contornos normais, medindo até {{*}} cm à direita e {{*}} cm à esquerda.","hd":["Achados ultrassonográficos compatíveis com dilatação aneurismática da aorta abdominal."]}]},{"id":"endoprotese-aorto-biiliaca","nome":"Endoprótese aorto-biilíaca","substitui":["aorta"],"apos":"aorta","variantes":[{"texto":"Presença de endoprótese aorto bi-ilíaca.","hd":["Endoprótese aorto bi-ilíaca."]}]},{"id":"linfonodomegalia","nome":"Linfonodomegalia","substitui":["linfonodos"],"apos":"linfonodos","variantes":[{"texto":"Linfonodomegalias de contornos bem definidos, hiperecogênicas, com perda da relação córtico-hilar, algumas confluentes, {{sem|com}} sinais de degeneração cístico-necrótica, medindo até {{*}} cm na cadeia {{*}}.","hd":["Achados ultrassonográficos que favorecem a possibilidade de doença linfoproliferativa, conveniente prosseguir investigação diagnóstica."]}]}]},{"id":"vesicula-biliar","nome":"Vesícula biliar","achados":[{"id":"adenomiomatose-colesterolose","nome":"Adenomiomatose + colesterolose","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar normodistendida, com paredes difusamente espessas e irregulares, medindo até {{*}} cm (VR ≤0,3 cm), associado a áreas hipoecogênicas de invaginação intraparietal da mucosa para a camada muscular vesicular (seios de Rokitansky-Aschoff), podendo corresponder a adenomiomatose. Observa-se ainda pequenos focos hiperecogênicos de artefatos em \"cauda de cometa\", medindo até 0,2 cm, podendo corresponder a colesterolose. O conteúdo vesicular apresenta-se anecóide, sem cálculos no interior. Sinal de Murphy ultrassonográfico negativo.","hd":["Achados sugestivos de adenomiomatose associado à colesterolose da vesícula biliar."]}]},{"id":"barro-biliar","nome":"Barro / lama biliar","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar normodistendida, com paredes finas e lisas, apresentando conteúdo hipoecogênico com nível formação de nível líquido-líquido, correspondendo a barro biliar. Sinal de Murphy ultrassonográfico negativo.","hd":["Alterações sugestivas de barro/lama biliar."]}]},{"id":"barrete-frigio","nome":"Barrete frígio","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar normodistendida, com paredes finas e lisas, conteúdo anecóide, apresentando uma dobra na transição do terço {{médio|distal}}, assumindo aspecto em \"barrete frígio\" (variante anatômica).","hd":[]}]},{"id":"colecistectomia","nome":"Colecistectomia","frequente":true,"substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"nome":"Sem dilatação das vias biliares","texto":"Vesícula biliar não caracterizada (status pós-operatório).","hd":["Colecistectomia."]},{"nome":"Com discreta dilatação das vias biliares","texto":"Vesícula biliar não caracterizada (status pós-operatório).\nNota-se discreta dilatação das vias biliares intra e extra-hepáticas, habitualmente observada em pacientes colecistectomizados.","hd":["Colecistectomia."]}]},{"id":"colelitiase","nome":"Colelitíase","frequente":true,"substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"nome":"Múltiplos/alguns cálculos","texto":"Vesícula biliar normodistendida, com paredes finas e lisas, apresentando conteúdo anecóide com {{múltiplas|algumas}} formações nodulares, hiperecogênicas, providas de sombra acústica posterior, móveis à mudança de decúbito, que medem entre {{*}} e {{*}} cm, correspondendo a cálculos. Sinal de Murphy ultrassonográfico negativo.","hd":["Alterações sugestivas de colecistopatia calculosa."]},{"nome":"Cálculo único","texto":"Vesícula biliar normodistendida e com paredes finas e lisas, apresentando no seu interior formação nodular, hiperecogênica, produtora de sombra acústica posterior, móvel à mudança de decúbito, compatível com cálculo, medindo cerca de {{*}} mm.","hd":["Alterações sugestivas de colecistopatia calculosa."]}]},{"id":"colelitiase-barro","nome":"Colelitíase + barro biliar","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar normodistendida, de paredes finas e lisas, apresentando conteúdo hipoecogênico com formação de nível líquido-líquido, correspondendo a barro biliar, associado a formações nodulares, hiperecogênicas, providas de sombras acústicas posteriores, que medem entre {{*}} e {{*}} cm, correspondendo a cálculos. Sinal de Murphy ultrassonográfico negativo.","hd":["Alterações sugestivas de colecistopatia calculosa associado a barro/lama biliar."]}]},{"id":"vesicula-escleroatrofica","nome":"Colelitíase + vesícula escleroatrófica","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar hipodistendida, de paredes aparentemente finas, com seu interior ocupado por formação hiperecogênica, provida de sombra acústica posterior, medindo aproximadamente {{*}} cm, podendo corresponder a {{cálculo|microcálculo}}. Sinal de Murphy ultrassonográfico negativo.","hd":["Alterações sugestivas de vesícula escleroatrófica e colecistopatia calculosa."]}]},{"id":"coledocolitiase","nome":"Colelitíase + coledocolitíase","substitui":["vias-biliares.intra","vias-biliares.coledoco","vias-biliares","vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vias-biliares","variantes":[{"texto":"Vias biliares intra-hepáticas levemente dilatadas, medindo {{*}} cm à esquerda e {{*}} cm à direita (VR ≤0,25 cm). Caracteriza-se formação nodular, hiperecogênica no interior do hepatocolédoco, medindo {{*}} cm, distando {{*}} cm da porta hepatis, correspondendo a cálculo impactado, determinando dilatação a montante, com hepatocolédoco medindo {{*}} cm de calibre.\nVesícula biliar hiperdistendida, medindo {{*}} cm, com paredes finas e lisas, apresentando conteúdo anecóide com múltiplas pequenas formações nodulares, hiperecogênicas, produtoras de sombra acústica posterior, que medem entre {{*}} e {{*}} cm, correspondendo a {{cálculos|microcálculos}}. Sinal de Murphy ultrassonográfico positivo.","hd":["Alterações sugestivas de colecistopatia calculosa e coledocolitíase, associado a dilatação das vias intra e extra-hepáticas."]}]},{"id":"complexo-parede-eco-sombra","nome":"Colelitíase – complexo parede-eco-sombra","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar apresentando fino halo hipoecóico entre a sua parede anterior e a hiperrefringência interna, caracterizando a formação do complexo \"parede-eco-sombra\", podendo estar relacionado a cálculo vultoso e/ou repleção por cálculos, no qual limita à adequada avaliação da sua parede posterior.","hd":["Achados sugestivos de colecistopatia calculosa."]}]},{"id":"colelitiase-ou-porcelana","nome":"Colelitíase ou vesícula em porcelana","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"No leito da vesícula biliar caracteriza-se área hiperrefringente, associado à extensa sombra acústica posterior, no qual limita a adequada avaliação do seu conteúdo e da parede posterior, podendo estar relacionado a cálculo vultoso, repleção por cálculos e/ou vesícula em porcelana.","hd":["Achados sugestivos de colecistopatia calculosa e/ou vesícula em porcelana."]}]},{"id":"colecistite-inicial","nome":"Colecistite litiásica inicial","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar discretamente hiperdistendida, medindo {{*}} cm (VR ≤10,0 x 4,0 cm), com paredes de espessura limítrofe, medindo 0,4 cm (VR ≤0,4 cm), apresentando conteúdo anecóide com {{múltiplas|algumas}} formações nodulares, hiperecogênicas, providas de sombra acústica posterior, que medem entre {{*}} e {{*}} cm, correspondendo a cálculos. Sinal de Murphy ultrassonográfico positivo.","hd":["Achados sugestivos de colecistite em estágio inicial na dependência de estreita correlação clínico-laboratorial."]}]},{"id":"colecistite","nome":"Colecistite litiásica","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar hiperdistendida, medindo {{*}} cm (VR ≤10,0 x 4,0 cm), com paredes espessadas e delaminadas, com halo anecóide de edema, medindo {{*}} cm (VR ≤0,4 cm), apresentando conteúdo hipoecogênico com formação de nível líquido-líquido, correspondendo a barro biliar, associado a {{múltiplos|alguns}} cálculos providos de sombra acústica posterior, sem significativa mobilidade às mudanças de decúbito, que medem entre {{*}} e {{*}} cm. Sinal de Murphy ultrassonográfico positivo.","hd":["Achados sugestivos de colecistite aguda."]}]},{"id":"colesterolose","nome":"Colesterolose","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar normodistendida, de paredes finas com pequenos focos hiperecogênicos de artefatos em \"cauda de cometa\", medindo até 0,2 cm, podendo corresponder à colesterolose. O conteúdo vesicular apresenta-se anecóide sem cálculos no interior.","hd":["Achados sugestivos de colesterolose da vesícula biliar."]}]},{"id":"discinesia-biliar","nome":"Discinesia biliar","substitui":[],"apos":"vesicula","variantes":[{"texto":"Realizado estudo ultrassonográfico de controle após 30 e 60 minutos da ingesta de alimento colecistocinético, caracterizando discreta redução do volume da vesícula biliar (VR >50%) em relação ao volume pré-prandial, sugerindo discinesia biliar.","hd":["Achados sugestivos de discinesia biliar."]}]},{"id":"espessamento-ascite","nome":"Espessamento reacional por ascite","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"A vesícula biliar apresenta espessamento das suas paredes, medindo {{*}} cm (VR ≤0,4 cm), conteúdo anecóide e homogêneo, achado que pode estar relacionado ao quadro de {{ascite|edema}}, na dependência de correlação com dados clínicos.","hd":["Espessamento parietal vesicular, podendo estar relacionado ao quadro de {{ascite|edema}}."]}]},{"id":"sindrome-de-mirizzi","nome":"Síndrome de Mirizzi","substitui":["vias-biliares.intra","vias-biliares.coledoco","vias-biliares","vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vias-biliares","variantes":[{"texto":"Vesícula biliar normodistendida com paredes finas e lisas, apresentando no seu interior múltiplas formações nodulares, hiperecogênicas, produtoras de sombras acústicas posteriores, algumas móveis à mudança de decúbito, e outra impactada na região infundibular, esta última medindo aproximadamente {{*}} cm, determinando aparente compressão extrínseca da via biliar extra-hepática, que mede até {{*}} cm (VR ≤0,6 cm), associado a {{discreta|moderada|acentuada}} dilatação das vias biliares intra-hepáticas. O conjunto de achados favorecem a possibilidade de Síndrome de Mirizzi dentre os diferenciais. A critério clínico um estudo por ColangioRM, poderá fornecer informações adicionais.","hd":["Colecistopatia calculosa, associado a achados que favorecem a possibilidade de Síndrome de Mirizzi dentre os diferenciais. A critério clínico um estudo por ColangioRM, poderá fornecer informações adicionais."]}]},{"id":"polipo-vesicular","nome":"Pólipo vesicular","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar normodistendida e com paredes finas, apresentando na região fúndica formação nodular sólida, hiperecogênica, de aspecto polipóide, medindo {{*}} cm e contornos regulares, imóvel à mudança de decúbito, com pedículo vascularizado ao estudo complementar com Doppler. O conteúdo vesicular apresenta-se anecóide, sem cálculos no interior.","hd":["Formação nodular intra-vesicular, sugestiva de pólipo vesicular."]}]},{"id":"vesicula-porcelana","nome":"Vesícula em porcelana","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar apresentando hiperrefringência difusa e linear da sua parede anterior, não sendo caracteriza o complexo \"parede-eco-sombra\", associado à extensa sombra acústica posterior, no qual limita a adequada avaliação do seu conteúdo e da parede posterior.","hd":["Achados ultrassonográficos sugestivos de vesícula em porcelana."]}]},{"id":"vesicula-hipodistendida","nome":"Vesícula hipodistendida","frequente":true,"substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar hipodistendida, limitando a adequada avaliação ecográfica das suas paredes. Apresenta conteúdo anecoide, aparentemente sem cálculos.","hd":[]}]},{"id":"vesicula-nao-caracterizada","nome":"Vesícula não caracterizada","frequente":true,"substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar não caracterizada (vazia? Interposição gasosa?).","hd":[]}]}]},{"id":"fast","nome":"FAST","mascaras":["abdome-fast"],"achados":[{"id":"derrame-pleural","nome":"Derrame pleural","substitui":[],"apos":"fast","variantes":[{"texto":"Presença de derrame pleural {{direito|esquerdo|bilateral}}","hd":[]}]},{"id":"derrame-pericardico","nome":"Derrame pericárdico","substitui":[],"apos":"fast","variantes":[{"texto":"Presença de derrame pericárdico.","hd":[]
