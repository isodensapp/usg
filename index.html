 DO ABDOME SUPERIOR PARA REALIZAÇÃO DA PROVA DE BOYDEN","blocos":[{"nome":"Técnica","linhas":[{"id":"tecnica","texto":"Exame ultrassonográfico realizado utilizando sonda convexa de 3,5 MHz, dirigido para região do abdome superior para realização da prova de Boyden, que evidenciou:"}]},{"nome":"Vesícula biliar","linhas":[{"id":"vesicula.paredes","texto":"Vesícula biliar normodistendida e com paredes finas e lisas."},{"id":"vesicula.conteudo","texto":"Conteúdo vesicular anecoide e não apresentando cálculos."}]},{"nome":"Vias biliares","linhas":[{"id":"vias-biliares.coledoco","texto":"Hepatocolédoco visibilizado de calibre normal."}]},{"nome":"Prova de Boyden","linhas":[{"id":"boyden","texto":"Medidas da vesícula biliar:"},{"id":"boyden.jejum","texto":"Jejum\n{{*:jej_a}} x {{*:jej_b}} x {{*:jej_c}} cm, vol {{=elipsoide(jej_a,jej_b,jej_c)}} cm³."},{"id":"boyden.30min","texto":"30 minutos\n{{*:m30_a}} x {{*:m30_b}} x {{*:m30_c}} cm, vol {{=elipsoide(m30_a,m30_b,m30_c)}} cm³."},{"id":"boyden.60min","texto":"60 minutos\n{{*:m60_a}} x {{*:m60_b}} x {{*:m60_c}} cm, vol {{=elipsoide(m60_a,m60_b,m60_c)}} cm³."}]}],"tituloConclusao":"HIPÓTESE DIAGNÓSTICA:","conclusaoNormal":["Estudo ultrassonográfico com Prova de Boyden dentro dos limites normais."]},{"id":"drge","nome":"Pesquisa de DRGE","titulo":"ULTRASSONOGRAFIA PARA PESQUISA DE DRGE","blocos":[{"nome":"Técnica","linhas":[{"id":"tecnica","texto":"Exame ultrassonográfico realizado utilizando sonda convexa de 3,5 MHz, dirigido para região gastroesofágica para pesquisa de doença do refluxo gastroesofágico (DRGE), evidenciou:"}]},{"nome":"Posicionamento","linhas":[{"id":"posicionamento","texto":"Criança posicionada em decúbito dorsal, após repleção gástrica habitual e estando no período pós-prandial imediato, com boa visibilização da junção gastroesofágica."}]},{"nome":"Tempo de observação","linhas":[{"id":"tempo-observacao","texto":"Tempo de observação ultrassonográfica de 10 minutos."}]},{"nome":"Esôfago e cárdia","linhas":[{"id":"esofago.intra-abdominal","texto":"Esôfago intra-abdominal medindo: {{*}} cm (VR: 2,0 cm RN / 3,0-3,5 cm 2-4 anos)."},{"id":"esofago.diametro","texto":"Diâmetro esofágico de {{*}} cm."},{"id":"angulo-his","texto":"Ângulo de His: {{*}}º."},{"id":"cardia","texto":"A maior abertura da cárdia foi de {{*}} cm."}]},{"nome":"Episódios de RGE","linhas":[{"id":"rge.episodios","texto":"Identificado {{*}} episódios de regurgitamento de conteúdo gástrico para o segmento esofágico retrocardíaco."}]},{"nome":"Duração do RGE","linhas":[{"id":"rge.duracao","texto":"Tempo de duração de cada episódio isolado de RGE, foi de {{*}} segundos."},{"id":"rge.duracao-total","texto":"Tempo de duração total dos episódios de RGE foram de {{*}} segundos."}]}],"tituloConclusao":"HIPÓTESE DIAGNÓSTICA:","conclusaoNormal":["Achados sugestivos de patologia de refluxo gastroesofágico:","disfunção {{leve (1 a 3 episódios)|moderada (4 a 5 episódios)|acentuada (6 ou mais episódios)}}."]}],"grupos":[{"id":"limitacoes","nome":"Limitações e observações","achados":[{"id":"nota-subcutaneo","nome":"Limitação – plano subcutâneo","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Exame realizado com limitações técnicas e com diminuição de sua sensibilidade devido à dificuldade do feixe acústico em transpor satisfatoriamente o plano subcutâneo.","hd":[]}]},{"id":"nota-decubito","nome":"Limitação – decúbito dorsal","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Exame realizado com limitações técnicas devido à dificuldade do paciente em manter-se no decúbito dorsal estático.","hd":[]}]},{"id":"pancreas-nao-visibilizado","nome":"Pâncreas e retroperitônio não visibilizados","frequente":true,"substitui":["pancreas","aorta"],"apos":"pancreas","variantes":[{"texto":"Pâncreas e demais estruturas do retroperitônio não visibilizados devido à intensa sobreposição gasosa.","hd":[]}]},{"id":"corpo-cauda-pancreas-nao-visibilizados","nome":"Corpo e cauda pancreáticos não visibilizados","substitui":[],"apos":"pancreas","variantes":[{"texto":"Cauda e corpo pancreático não visibilizados devido à sobreposição gasosa.","hd":[]}]},{"id":"cauda-pancreas-nao-visibilizada","nome":"Cauda pancreática não visibilizada","substitui":[],"apos":"pancreas","variantes":[{"texto":"Cauda pancreática não visibilizada devido à sobreposição gasosa.","hd":[]}]},{"id":"aorta-parcial","nome":"Aorta parcialmente caracterizada","substitui":["aorta"],"apos":"aorta","variantes":[{"texto":"Aorta parcialmente caracterizada devido à interposição gasosa intestinal, apresentando trajeto e calibre habituais nos segmentos acessíveis.","hd":[]}]},{"id":"vesicula-hipodistendida-jejum","nome":"Vesícula hipodistendida – jejum inadequado","substitui":["vesicula.paredes"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar hipodistendida e de avaliação limitada, provavelmente relacionado ao jejum inadequado, determinando redução da sensibilidade do método.","hd":[]}]},{"id":"nota-retroperitonio-jejum","nome":"Nota – retroperitônio sem jejum","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: O estudo ultrassonográfico apresenta baixa sensibilidade na detecção de patologias do retroperitônio na ausência de preparo com jejum apropriado.","hd":[]}]},{"id":"bexiga-vazia","nome":"Bexiga vazia","frequente":true,"substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga urinária vazia, limitando sua adequada avaliação ecográfica.","hd":[]}]},{"id":"bexiga-baixa-replecao","nome":"Bexiga de baixa repleção","frequente":true,"substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga urinária com conteúdo anecoide de baixa repleção, limitando sua adequada avaliação ecográfica.","hd":[]}]},{"id":"bexiga-media-replecao","nome":"Bexiga de média repleção","frequente":true,"substitui":["bexiga"],"apos":"bexiga","variantes":[{"texto":"Bexiga urinária de média repleção, com conteúdo anecoide e parede de espessura normal.","hd":[]}]},{"id":"nota-grande-dificuldade","nome":"Nota – grande dificuldade técnica","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Exame de grande dificuldade técnica devido às condições clínicas do paciente.","hd":[]}]},{"id":"nota-condicoes-clinicas","nome":"Nota – condições clínicas","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Exame realizado com limitações técnicas devido às condições clínicas do paciente.","hd":[]}]},{"id":"nota-queixa-algica","nome":"Nota – queixa álgica","tipo":"nota","substitui":[],"variantes":[{"texto":"Nota: Exame tecnicamente prejudicado devido à queixa álgica do paciente.","hd":[]}]},{"id":"obs-trato-gastrointestinal","nome":"Obs. – trato gastrointestinal","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: O método ultrassonográfico apresenta baixa sensibilidade para detecção de patologias do trato gastrointestinal.","hd":[]}]},{"id":"obs-apendicite","nome":"Obs. – apendicite precoce","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: O método ultrassonográfico apresenta baixa sensibilidade na detecção de apendicite aguda em fase muito precoce. Sugiro correlação clínico-laboratorial e, a critério, complementação diagnóstica com tomografia computadorizada do abdome e pelve, salvo contraindicações ao método.","hd":[]}]},{"id":"obs-apendicite-mascara","nome":"Obs. – apendicite precoce (máscara)","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: O método ultrassonográfico apresenta baixa sensibilidade na detecção de apendicite aguda em fase muito precoce. Sugiro correlação clínico-laboratorial e complementação diagnóstica com tomografia computadorizada de abdome e pelve, salvo contraindicações inerentes ao método.","hd":[]}]},{"id":"obs-interposicao-alcas","nome":"Obs. – interposição de alças","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: Exame dificultado devido a não penetração adequada de ondas sonoras para definição ecográfica de órgãos abdominais (interposição de alças intestinais).","hd":[]}]},{"id":"obs-urgencia","nome":"Obs. – caráter de urgência","tipo":"nota","substitui":[],"variantes":[{"texto":"Obs.: Exame realizado em caráter de urgência.","hd":[]}]}]},{"id":"adrenal","nome":"Adrenal","achados":[{"id":"adenoma","nome":"Adenoma de adrenal","substitui":[],"apos":"baco","variantes":[{"texto":"Caracteriza-se formação nodular hipoecogênica, bem delimitada, localizada entre o baço e o rim esquerdo, sem planos de clivagem definidos, na topografia da glândula adrenal esquerda, que ao estudo complementar com Doppler não foi observado vascularização, medindo {{*}} x {{*}} x {{*}} cm, que conforme exame prévio corresponde a nódulo na glândula adrenal esquerda, sugestivo de adenoma.","hd":["Achados sugestivos de adenoma de glândula adrenal {{direita|esquerda}}."]}]},{"id":"adrenais-nao-caracterizadas","nome":"Adrenais não caracterizadas","substitui":[],"apos":"baco","variantes":[{"texto":"As glândulas adrenais não foram individualizadas no presente estudo ultrassonográfico, entretanto, a exclusão de doença relacionada às mesmas não pode ser descartada devido à limitação intrínseca do método. A critério clínico, caso haja indicação de seguimento, sugere-se continuação da avaliação com estudo específico por Tomografia Computadorizada.","hd":["Conveniente prosseguir seguimento por Tomografia com protocolo específico de adrenal, salvo contraindicações."]}]}]},{"id":"alcas-intestinais","nome":"Alças intestinais","achados":[{"id":"apendagite-epiploica","nome":"Apendagite epiploica","substitui":["alcas"],"apos":"alcas","variantes":[{"texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, evidencia-se estrutura ovalada, na fossa ilíaca esquerda, na borda antimesentérica, hiperecogênica com halo hipoecogênico, medindo {{*}} cm, associado a borramento dos planos gordurosos adjacentes. Alças intestinais com peristalse preservada.","hd":["Achados ultrassonográficos que favorecem a possibilidade de apendagite epiploica, sendo conveniente complementar com estudo tomográfico."]}]},{"id":"apendice-nao-caracterizado","nome":"Apendicite – não caracterizada","substitui":["alcas"],"apos":"alcas","variantes":[{"texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, apresenta-se alças intestinais com peristalse habitual, ecogenicidade da gordura mesentérica preservada, não sendo caracterizado ecograficamente o apêndice cecal. Tais achados não excluem a possibilidade de processo inflamatório/infeccioso do mesmo, caso persista interesse clínico e não haja contraindicações, um estudo por tomografia poderá trazer maiores informações.","hd":[]}]},{"id":"apendicite-borderline","nome":"Apendicite – borderline","substitui":[],"apos":"alcas","variantes":[{"texto":"Apêndice cecal localizado na topografia da fossa ilíaca direita, {{lateral|medial}} ao ceco, com diâmetro no limite superior da normalidade, medindo até 0,6 cm (VR \u003c0,6 cm), discreto aumento da vascularização ao estudo complementar Doppler, apresentando paredes finas e compressível em quase toda sua totalidade. Não há resposta álgica referida pelo paciente às manobras compressivas sobre o mesmo. Ressalta-se que o método ultrassonográfico apresenta baixa sensibilidade na detecção de apendicite aguda em fase muito precoce. Sugiro correlação com exames complementares.","hd":[]}]},{"id":"apendicite","nome":"Apendicite","substitui":["alcas"],"apos":"alcas","variantes":[{"nome":"Com apendicolito","texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, evidencia-se estrutura tubular em fundo cego, com paredes espessadas, medindo {{*}} cm (VR ≤0,3 cm), e diâmetro transverso de {{*}} cm (VR ≤0,6 cm), não compressível, associado à formação nodular intraluminal, provida de sombra acústica posterior, medindo {{*}} cm, compatível com apendicolito. Caracteriza-se ainda na região da fossa ilíaca direita alteração da ecogenicidade dos planos adiposos, proeminência dos linfonodos regionais, redução da peristalse das alças intestinais e pequena quantidade de líquido adjacente.","hd":["Achados ultrassonográficos que favorecem a hipótese diagnóstica de apendicite aguda, caso haja um contexto clínico-laboratorial compatível."]},{"nome":"Com apendicolito e hiperemia","texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, evidencia-se estrutura tubular em fundo cego, em topografia medial ao ceco, apresentando paredes espessadas, medindo {{*}} cm (VR \u003c0,3 cm), e diâmetro transverso de {{*}} cm (VR \u003c0,6 cm), ao estudo complementar com Doppler apresenta hiperemia, não compressível e com importante resposta álgica às manobras de pressão. Associa-se formação nodular intraluminal, provida de sombra acústica posterior, medindo {{*}} cm, compatível com apendicolito. Caracteriza-se ainda na região da FID alteração da ecogenicidade dos planos adiposos, proeminência dos linfonodos regionais, redução da peristalse das alças intestinais e pequena quantidade de líquido adjacente.","hd":["Achados ultrassonográficos que favorecem a hipótese diagnóstica de apendicite aguda, caso haja um contexto clínico-laboratorial compatível."]},{"nome":"Conteúdo líquido espesso","texto":"Na projeção da fossa ilíaca direita caracteriza-se formação tubuliforme fixa, terminando em fundo cego, localizada medialmente ao ceco, apresentando paredes espessadas e calibre de {{*}} cm, contendo material líquido ecogênico espesso no seu lúmen, associado a hiperecogenicidade da gordura mesentérica adjacente e pequena quantidade de líquido livre. Presença de aumento da vascularização parietal deste segmento de alça.","hd":["Achados ultrassonográficos que favorecem a hipótese diagnóstica de apendicite aguda, caso haja um contexto clínico-laboratorial compatível."]},{"nome":"Paredes pouco espessadas","texto":"Na projeção da fossa ilíaca direita caracteriza-se formação tubuliforme fixa, em fundo cego, localizada medialmente ao ceco, apresentando paredes pouco espessadas, com preservação dos planos parietais e calibre de até {{*}} cm, com conteúdo hipoecoico. Presença de aumento da vascularização parietal deste segmento de alça. Observa-se alça de delgado parética próxima à estrutura supramencionada.","hd":["Achados ultrassonográficos que favorecem a hipótese diagnóstica de apendicite aguda, caso haja um contexto clínico-laboratorial compatível."]}],"frequente":true},{"id":"colite","nome":"Colite – espessamento de alça colônica","substitui":["alcas"],"apos":"alcas","variantes":[{"texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, na topografia da fossa ilíaca {{direita|esquerda}}, evidencia-se, espessamento parietal difuso de alça colônica, medindo até {{*}} cm (VR ≤0,3 cm), associado a borramento dos planos gordurosos e pequena quantidade de líquido adjacente, proeminência de linfonodos regionais, de aspecto reacional, medindo até {{*}} cm, e redução difusa da peristalse dos segmentos intestinais.","hd":["Espessamento parietal difuso de alça colônica na fossa ilíaca {{direita|esquerda}}, que dentre os diferenciais, considerar a possibilidade de processo inflamatório/infeccioso, sendo conveniente complementar com estudo tomográfico."]}]},{"id":"constipacao-cronica","nome":"Constipação crônica","substitui":[],"apos":"alcas","variantes":[{"texto":"Acentuado aumento do conteúdo intraluminal das alças intestinais.","hd":["Achados ultrassonográficos sugestivos de constipação crônica, na dependência de correlação clínica."]}]},{"id":"diverticulite","nome":"Diverticulite","substitui":[],"apos":"alcas","variantes":[{"texto":"Caracteriza-se espessamento segmentar circunferencial colônico na transição entre os cólons descendente e sigmoide, medindo {{*}} cm de extensão, associado a formações saculares compatíveis com divertículos, apresentando paredes espessadas e conteúdo gasoso em seu interior. Associa-se hiperecogenicidade da gordura pericólica e pequena quantidade de líquido livre adjacente.","hd":["O conjunto de achados ultrassonográficos favorecem a possibilidade de processo inflamatório/infeccioso, que dentre os diferenciais, sugere doença diverticular aguda, sendo conveniente complementar com estudo tomográfico."]}],"frequente":true},{"id":"doenca-de-crohn","nome":"Doença de Crohn","substitui":[],"apos":"alcas","variantes":[{"texto":"Caracterizam-se espessamentos da submucosa parietal em alças intestinais na fossa ilíaca direita, flanco direito, cólon ascendente/íleo terminal, associado a hiperecogenicidade da gordura pericólica e pequena quantidade de líquido livre adjacente.","hd":["Espessamento da submucosa de alças intestinais, associado a hiperecogenicidade da gordura pericólica, de aspecto compatível com o relato clínico de acometimento por Doença de Crohn."]}]},{"id":"enterite","nome":"Enterite","substitui":["alcas"],"apos":"alcas","variantes":[{"texto":"Nas regiões de mesogástrio e hipogástrio são visualizadas alças intestinais com paredes discretamente espessadas, e distendidas por conteúdo líquido com moderados ecos em suspensão (debris) de permeio, associado a aumento da peristalse. Associam-se ainda alguns linfonodos mesentéricos de dimensões aumentadas e globosos, medindo até {{*}} cm. O conjunto de achados é sugestivo de processo inflamatório/infeccioso.","hd":["Dentre as hipóteses diagnósticas considerar a possibilidade de processo inflamatório/infeccioso da mucosa intestinal."]}]},{"id":"estenose-hipertrofica-piloro","nome":"Estenose hipertrófica do piloro","substitui":[],"apos":"alcas","variantes":[{"texto":"Na região epigástrica intraperitoneal, medialmente à vesícula biliar, caracteriza-se estrutura hipoecogênica e tubuliforme, compatível com piloro, apresentando aumento da espessura da camada muscular, que mede {{*}} cm (VR ≤0,3 cm), aumento do comprimento longitudinal, medindo {{*}} cm (VR ≤1,7 cm), aumento do diâmetro transversal, medindo {{*}} cm (VR ≤1,3 cm), e aumento do volume estimado, medindo {{*}} cm³ (VR ≤1,4 cm³), sem sinais de abertura significativa da luz. Observa-se ainda peristalse gástrica exagerada que cessa de modo abrupto na margem da região antropilórica, associado a ondas peristálticas retrógradas e ausência de relaxamento habitual do piloro, que determina redução da passagem do conteúdo gástrico para o duodeno, levando a retardo no esvaziamento gástrico.","hd":["Alterações sugestivas de estenose hipertrófica do piloro."]}]},{"id":"fecaloma","nome":"Fecaloma","substitui":[],"apos":"alcas","variantes":[{"texto":"Formação linear hiperrefringente, de morfologia convexa, produtora de exuberante sombra acústica posterior, localizada na topografia do hipogástrio, sugestiva de abundante conteúdo fecaloide no {{sigmoide|ampola retal}} (fecaloma?).","hd":["Alterações sugestivas de abundante conteúdo fecal no {{sigmoide|ampola retal}} (Fecaloma?)."]}]},{"id":"gastroenterite","nome":"Gastroenterite (GECA)","substitui":["alcas"],"apos":"alcas","variantes":[{"texto":"Nas regiões de mesogástrio, hipogástrio e fossas ilíacas são visualizadas alças intestinais com paredes discretamente espessadas e distendidas por conteúdo líquido com moderados debris e peristalse {{preservada|acentuada}}.","hd":["Dentre as hipóteses diagnósticas considerar a possibilidade de processo inflamatório/infeccioso da mucosa gastrointestinal (gastroenterite)."]}]},{"id":"ileite","nome":"Ileíte – espessamento do íleo terminal","substitui":[],"apos":"alcas","variantes":[{"texto":"Espessamento parietal concêntrico e simétrico segmentar do íleo terminal, determinando redução de sua luz, associado à perda parcial da estratificação dos planos parietais, caracterizando-se ainda espessamento parietal do ceco. Proeminência de linfonodos mesentéricos regionais, medindo até {{*}} cm, de aspecto reacional.","hd":["Espessamento parietal difuso do íleo terminal e do ceco, que dentre os diferenciais, considerar a possibilidade de processo inflamatório/infeccioso, sendo conveniente complementar com estudo tomográfico."]}]},{"id":"intussuscepcao","nome":"Intussuscepção / invaginação intestinal","substitui":[],"apos":"alcas","variantes":[{"nome":"Pesquisa negativa","texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, não evidenciou formação sugestiva de intussuscepção intestinal. Ecogenicidade da gordura mesentérica e peristalse de alças intestinais preservadas.","hd":[]},{"nome":"Lesão em alvo","texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, evidencia-se formação em aspecto de \"lesão em alvo\", na topografia do {{*}}, medindo {{*}} x {{*}} cm, com camada externa de {{*}} cm de espessura, sem caracterização de causa secundária pelo método ecográfico.","hd":["Alterações sugestivas de intussuscepção intestinal."]}]},{"id":"intussuscepcao-dii","nome":"Intussuscepção + doença inflamatória intestinal","substitui":["liquido-livre","alcas"],"apos":"alcas","variantes":[{"texto":"Moderada quantidade de líquido livre na cavidade abdominal e acentuada distensão de alças intestinais.\nNo flanco direito evidencia-se alça intestinal com espessamento parietal concêntrico, medindo {{*}} cm (VR ≤0,3 cm), múltiplas camadas ecogênicas concêntricas com halo hipoecogênico, assumindo aspecto de \"lesão em alvo\", espessamento do meso adjacente e ausência de peristalse. Ao estudo complementar com Doppler, caracteriza-se fluxo apenas no intussuscepto (segmento invaginado).","hd":["Alterações sugestivas de intussuscepção intestinal e doença inflamatória intestinal."]}]},{"id":"fossas-iliacas-normal","nome":"Fossas ilíacas sem alterações (sonda linear)","frequente":true,"substitui":[],"apos":"liquido-livre","variantes":[{"texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido em fossas ilíacas, não evidenciou aumento da ecogenicidade da gordura mesentérica e não caracterizou o apêndice cecal.","hd":[]}]}]},{"id":"cavidade-abdominal","nome":"Cavidade abdominal","achados":[{"id":"adenite-mesenterica","nome":"Adenite mesentérica","substitui":["alcas"],"apos":"alcas","variantes":[{"texto":"Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, na topografia das fossas ilíacas e região periumbilical, evidencia-se linfonodos levemente aumentados, com preservação da relação cortico-hilar, medindo até {{*}} cm, com ecogenicidade da gordura mesentérica preservada, alças intestinais com peristalse habitual, não sendo caracterizado ecograficamente o apêndice cecal.","hd":["Linfonodos intraperitoneais levemente aumentados, sugestivo de adenite mesentérica."]}]},{"id":"ascite","nome":"Ascite / líquido livre","substitui":["liquido-livre"],"apos":"liquido-livre","variantes":[{"nome":"Espaço hepatorrenal","texto":"Presença de líquido livre no espaço hepatorrenal com {{*}} cm de espessura.","hd":["Ascite em {{pequeno|moderado|acentuado}} volume."]},{"nome":"Espaço esplenorrenal","texto":"Presença de líquido livre no espaço esplenorrenal com {{*}} cm de espessura.","hd":["Ascite em {{pequeno|moderado|acentuado}} volume."]},{"nome":"Pelve","texto":"Presença de líquido livre na pelve com {{*}} cm de espessura.","hd":["Ascite em {{pequeno|moderado|acentuado}} volume."]},{"nome":"Cavidade e retroperitônio","texto":"Líquido livre na cavidade peritoneal e no retroperitônio.","hd":["Ascite em {{pequeno|moderado|acentuado}} volume."]},{"nome":"Por volume","texto":"Presença de líquido livre anecoide e homogêneo intraperitoneal em {{pequeno|moderado|acentuado}} volume.","hd":["Ascite em {{pequeno|moderado|acentuado}} volume."]},{"nome":"Difuso","texto":"Caracteriza-se líquido intraperitoneal com aspecto anecoide e homogêneo, estendendo-se do fundo de saco posterior e goteiras parietocólicas até os espaços hepato e esplenorrenais.","hd":["Ascite em {{pequeno|moderado|acentuado}} volume."]}],"frequente":true},{"id":"aderencias","nome":"Aderências abdominais","substitui":[],"apos":"alcas","variantes":[{"nome":"Envolvendo alças","texto":"Formações envolvendo as alças intestinais sugestivas de aderências.","hd":["Formações sugestivas de aderências em cavidade abdominal."]},{"nome":"Sítio de colecistectomia","texto":"Presença de formações sugestivas de aderências em cavidade abdominal, mais evidente ao redor do sítio cirúrgico da colecistectomia.","hd":["Formações sugestivas de aderências em cavidade abdominal."]}]},{"id":"colecao-hematica","nome":"Coleção hemática","substitui":[],"apos":"liquido-livre","variantes":[{"texto":"Formação expansiva heterogênea, predominantemente hipoecoica e com finas septações, medindo aproximadamente {{*:a}} x {{*:b}} x {{*:c}} cm, e volume estimado em {{=elipsoide(a,b,c)}} cm³, localizada na região anterior uterina, na interface com a bexiga, podendo corresponder à coleção de origem hemática.","hd":["Achados sugestivos de coleção hemática intraperitoneal."]}]},{"id":"carcinomatose-peritoneal","nome":"Carcinomatose peritoneal","substitui":["liquido-livre"],"apos":"liquido-livre","variantes":[{"texto":"{{Pequena|Moderada|Acentuada}} quantidade de líquido livre intraperitoneal, de aspecto anecoide e com finos ecos em suspensão (debris), podendo corresponder a celularidade dentro deste contexto, associado a espessamento peritoneal e múltiplas formações nodulares sólidas e heterogêneas aderidas, sem calcificações de permeio, com margens irregulares, esparsas por toda a cavidade, a maior localizada na topografia {{*}}, medindo até {{*}} cm. Caracteriza-se ainda espessamento, nodulações e hiperrefringência omental (cake omental), e centralização \"em bloco\" das alças intestinais na linha mediana, inferindo infiltração mesentérica. O conjunto destes achados é sugestivo de carcinomatose peritoneal.","hd":["Achados ultrassonográficos sugestivos de carcinomatose peritoneal. A critério clínico sugiro prosseguir propedêutica diagnóstica."]}]},{"id":"cateter-dvp","nome":"Cateter de DVP","substitui":[],"apos":"liquido-livre","variantes":[{"texto":"Cateter de derivação ventrículo peritoneal com extremidade distal na região mesogástrica à esquerda, identificando-se pequena quantidade de líquido adjacente.","hd":["Cateter de DVP intraperitoneal."]}]}]},{"id":"baco","nome":"Baço","achados":[{"id":"baco-acessorio","nome":"Baço acessório","substitui":[],"apos":"baco","variantes":[{"texto":"Formação nodular sólida, de contornos bem definidos e regulares, isoecogênica ao parênquima esplênico, localizada inferomedialmente ao baço, medindo {{*}} cm, compatível com baço acessório (variante anatômica).","hd":["Formação nodular sugestiva de baço acessório"]}]},{"id":"calcificacao-esplenica","nome":"Calcificação esplênica","substitui":["baco"],"apos":"baco","variantes":[{"texto":"Baço com dimensões conservadas, morfologia habitual e ecotextura homogênea, exceto por pequenos granulomas residuais calcificados esparsos pelo parênquima.","hd":["Pequenas calcificações no parênquima esplênico, de aspecto sequelar."]}]},{"id":"cisto-esplenico","nome":"Cisto esplênico","substitui":["baco"],"apos":"baco","variantes":[{"texto":"Baço de dimensões normais, morfologia habitual e ecotextura homogênea, exceto por formação anecoica, de paredes finas e regulares, com reforço acústico posterior, medindo {{*}} x {{*}} cm, localizado {{*}}.","hd":["Formação sugestiva de cisto esplênico."]}]},{"id":"esplenectomia","nome":"Esplenectomia","substitui":["baco"],"apos":"baco","variantes":[{"nome":"Pós-operatório","texto":"Baço não caracterizado (status pós-operatório).","hd":["Esplenectomia total."]},{"nome":"Autoesplenectomia","texto":"Baço não caracterizado, podendo corresponder à autoesplenectomia.","hd":["Achado sugestivo de autoesplenectomia."]}]},{"id":"esplenose","nome":"Esplenectomia com esplenose","substitui":["baco"],"apos":"baco","variantes":[{"texto":"Baço não caracterizado (status pós-operatório). Notam-se na loja esplênica algumas formações nodulares sólidas, de contornos arredondados, com ecotextura semelhante à esplênica, medindo até {{*}} cm.","hd":["Esplenectomia, com nodulações na loja esplênica, sugestivas de esplenose / remanescentes esplênicos."]}]},{"id":"esplenomegalia","nome":"Esplenomegalia","substitui":["baco"],"apos":"baco","variantes":[{"nome":"Leve","texto":"Baço de morfologia, contornos e ecotextura normais, com dimensões aumentadas, medindo {{*}} cm em seu maior eixo longitudinal (VR ≤12,0 cm).","hd":["Esplenomegalia homogênea leve."]},{"nome":"Volumosa","texto":"Baço de dimensões acentuadamente aumentadas, medindo cerca de {{*}} cm em seu maior eixo longitudinal (VR ≤12,0 cm), ultrapassando a linha média e estendendo-se para a fossa ilíaca esquerda, determinando compressão de estruturas adjacentes.","hd":["Esplenomegalia volumosa."]}],"frequente":true},{"id":"hemangioma-esplenico","nome":"Hemangioma esplênico","substitui":[],"apos":"baco","variantes":[{"texto":"Formação nodular sólida, no terço {{superior|médio|inferior}} esplênico, de contornos bem definidos e lobulados, hiperecogênica e homogênea, desprovida de sombra acústica posterior, sem fluxo ao estudo complementar com Doppler, medindo {{*}} cm.","hd":["Formação nodular esplênica sugestiva de hemangioma."]}]},{"id":"trauma-esplenico","nome":"Trauma esplênico","substitui":["baco"],"apos":"baco","variantes":[{"texto":"Baço com dimensões aumentadas e ecogenicidade difusamente heterogênea, podendo corresponder lesão esplênica. A critério clínico um estudo por Tomografia Computadorizada com contraste poderá trazer informações adicionais, salvo contraindicações.","hd":["Achados sugestivos de trauma esplênico."]}]}]},{"id":"figado","nome":"Fígado","achados":[{"id":"avaliacao-limitada","nome":"Avaliação limitada","substitui":["figado.parenquima"],"apos":"figado","variantes":[{"texto":"Parênquima hepático aparentemente homogêneo, com ecotextura e ecogenicidade habituais, entretanto, de avaliação limitada ao método devido à elevação diafragmática, e limitação do paciente em realizar e manter a inspiração forçada.","hd":[]}]},{"id":"abscesso-hepatico","nome":"Abscesso hepático","substitui":[],"apos":"figado","variantes":[{"texto":"Formação cística, de paredes espessas e irregulares, conteúdo anecoide com moderados debris e traves de permeio (cístico-espesso), com fluxo periférico ao estudo complementar com Doppler, ocupando o segmento hepático {{*}}, medindo cerca de {{*:ap}} x {{*:ll}} x {{*:cc}} cm (AP x LL x CC) e volume estimado de {{=elipsoide(ap,ll,cc)}} cm³, distando {{*}} cm da superfície hepática.","hd":["Formação cístico-espessa, sugestiva de abscesso hepático."]}]},{"id":"aerobilia","nome":"Aerobilia / pneumobilia","substitui":[],"apos":"vias-biliares","variantes":[{"texto":"Formações lineares hiperrefringentes e produtoras de reverberações proeminentes do feixe acústico posterior, com distribuição predominantemente central e que acompanha a tríade portal, sugestivo de aerobilia.","hd":["Achados ultrassonográficos sugestivos de aerobilia/pneumobilia."]}]},{"id":"lobo-de-riedel","nome":"Alongamento hepático / lobo de Riedel","substitui":["figado.morfologia"],"apos":"figado","variantes":[{"texto":"Fígado de morfologia e contornos normais, apresentando alongamento vertical do lobo hepático direito, medindo {{*}} cm longitudinal (VR ≤15,0 cm).","hd":["Achados sugestivos de Lobo de Riedel (variante anatômica)."]}]},{"id":"calcificacao-hepatica","nome":"Calcificação hepática","substitui":[],"apos":"figado","variantes":[{"texto":"Foco hiperecogênico, irregular, provido de sombra acústica posterior, localizado no segmento hepático {{*}}, medindo aproximadamente {{*}} cm.","hd":["Calcificação hepática de aspecto sequelar."]}]},{"id":"cisto-hepatico","nome":"Cisto hepático","frequente":true,"substitui":[],"apos":"figado","variantes":[{"nome":"Único","texto":"Caracteriza-se formação cística, de paredes finas e regulares, conteúdo anecoide e homogêneo, localizada no segmento hepático {{*}}, medindo {{*}} cm.","hd":["Cisto(s) hepático(s)."]},{"nome":"Múltiplos","texto":"Caracterizam-se formações císticas, de paredes finas e regulares, conteúdo anecoide homogêneo, medindo até {{*}} cm, no segmento hepático {{*}}.","hd":["Cisto(s) hepático(s)."]}]},{"id":"esteatose-difusa","nome":"Esteatose hepática difusa","frequente":true,"substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"nome":"Leve","texto":"Fígado de morfologia, contornos e dimensões normais, apresentando leve aumento difuso da ecogenicidade.","hd":["Alterações sugestivas de leve infiltração gordurosa hepática."]},{"nome":"Moderada/acentuada","texto":"Fígado de morfologia, contornos e dimensões normais, apresentando {{moderado|acentuado}} aumento difuso da ecogenicidade com atenuação do feixe acústico posterior, o que limita a identificação de eventuais alterações parenquimatosas focais.","hd":["Alterações sugestivas de {{moderada|acentuada}} infiltração gordurosa hepática."]}]},{"id":"esteatose-preservacao-focal","nome":"Esteatose + preservação focal","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"nome":"Leve","texto":"Fígado de morfologia, contornos e dimensões normais, apresentando leve aumento difuso de sua ecogenicidade com área hipoecogênica de permeio, mal definida, no segmento hepático {{*}}, medindo cerca de {{*}} cm, notando-se vasos hepáticos transpondo referida área, sem distorções ou deslocamentos, sugerindo área de preservação focal.","hd":["Achados sugestivos de leve infiltração gordurosa hepática, associado à área de preservação focal."]},{"nome":"Moderada/acentuada com hepatomegalia","texto":"Fígado de morfologia e contornos normais, com dimensões aumentadas, medindo o lobo esquerdo {{*}} cm (VR ≤10,0 cm) e o lobo direito {{*}} cm (VR ≤15,0 cm), apresentando {{moderado|acentuado}} aumento difuso da ecogenicidade, com área hipoecogênica de permeio, mal definida, no segmento hepático {{*}}, medindo cerca de {{*}} cm, notando-se vasos hepáticos transpondo referida área, sem distorções ou deslocamentos, sugerindo área de preservação focal.","hd":["Achados sugestivos de {{moderada|acentuada}} infiltração gordurosa hepática, associado à área de preservação focal e hepatomegalia."]}]},{"id":"figado-policistico","nome":"Fígado policístico","substitui":["figado.parenquima"],"apos":"figado","variantes":[{"texto":"Caracteriza-se múltiplas formações císticas esparsas pelo parênquima hepático, sem evidências de hemorragias ou debris em seu interior.","hd":["Achados ultrassonográficos sugestivos de fígado policístico."]}]},{"id":"hamartomas-biliares","nome":"Hamartomas biliares","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de morfologia, contornos e dimensões habituais, com ecotextura normal, exceto por apresentar múltiplas pequenas formações ecogênicas esparsas, acompanhando a tríade portal, medindo até {{*}} cm, sugestivas de hamartomas biliares.","hd":["Alterações sugestivas de hamartomas biliares."]}]},{"id":"hepatomegalia","nome":"Hepatomegalia","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de morfologia, contornos e ecotextura normais, apresentando dimensões aumentadas. Medindo nos eixos longitudinais, o lobo esquerdo {{*}} cm (VR ≤10 cm) e lobo direito {{*}} cm (VR ≤15 cm).","hd":["Alterações sugestivas de hepatomegalia homogênea {{leve|moderada|acentuada}}."]}],"frequente":true},{"id":"hemangioma-hepatico","nome":"Hemangioma hepático","substitui":[],"apos":"figado","variantes":[{"texto":"Formação nodular sólida, de contornos bem definidos e lobulados, hiperecogênica e homogênea, desprovida de sombra acústica posterior, sem fluxo ao estudo complementar com Doppler, no segmento hepático {{*}}, medindo {{*}} cm.","hd":["Nódulo hepático sugestivo de hemangioma. A critério clínico sugiro complementar estudo com tomografia contrastada para melhor avaliação."]}],"frequente":true},{"id":"hemangiotelioma","nome":"Hemangiotelioma","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de dimensões aumentadas e textura parenquimatosa heterogênea, devido à formação expansiva ovalada, parcialmente exofítica, de limites bem definidos, heterogênea, com áreas hiperecogênicas de permeio e sombra acústica posterior, compatíveis com calcificações, localizada nos segmentos VI/VII, caracterizando importante vascularização ao estudo complementar com Doppler, predominantemente periférica, medindo {{*:a}} x {{*:b}} x {{*:c}} cm, e volume estimado de {{=elipsoide(a,b,c)}} cm³.","hd":["Achados ultrassonográficos sugestivos de hemangiotelioma. A critério clínico sugiro complementar estudo com tomografia contrastada para melhor avaliação."]}]},{"id":"hepatite-aguda","nome":"Hepatite aguda","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de dimensões discretamente aumentadas, medindo {{*}} cm (VR ≤15,0 cm), com redução difusa da ecogenicidade hepática, associado a leve aumento da refringência periportal, assumindo aspecto em \"céu estrelado\".","hd":["Alterações sugestivas de doença hepática parenquimatosa aguda (hepatite)."]}]},{"id":"hepatimetria","nome":"Hepatimetria","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de volume, contornos regulares, ecotextura e ecogenicidade normais.\nLobo direito medindo {{*}} cm e lobo esquerdo medindo {{*}} cm abaixo das respectivas cúpulas diafragmáticas (normal: lobo direito até 15 cm e lobo esquerdo até 10 cm).","hd":[]}]},{"id":"hepatopatia-cronica","nome":"Hepatopatia crônica / cirrose","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de dimensões reduzidas, com sinais de hipertrofia compensatória dos lobos caudado e esquerdo. Apresenta bordos rombos e contornos serrilhados, com ecotextura difusamente heterogênea, sem a caracterização de lesões focais bem definidas.","hd":["Alterações sugestivas de hepatopatia crônica."]}],"frequente":true},{"id":"hepatopatia-cronica-2","nome":"Hepatopatia crônica / cirrose 2","substitui":["figado.morfologia","figado.parenquima","figado","vasos-hepaticos"],"apos":"figado","variantes":[{"texto":"Fígado de contornos serrilhados, bordas rombas, com lobo direito de dimensões reduzidas e lobo caudado aumentado e globoso, associado a espessamento dos ligamentos hepáticos e ecotextura parenquimatosa difusamente grosseira e heterogênea. Relação dos diâmetros transversos do lobo caudado/lobo direito de {{*}} (VR ≤0,65).\nVeia porta de trajeto e calibre normais, medindo {{*}} cm (VR ≤1,3 cm), com fluxo hepatopetal.","hd":["Alterações sugestivas de hepatopatia crônica."]}]},{"id":"hepatopatia-hipertensao-portal","nome":"Cirrose + hipertensão portal","substitui":["figado.morfologia","figado.parenquima","figado","vasos-hepaticos"],"apos":"figado","variantes":[{"texto":"Fígado de contornos serrilhados, bordas rombas, com lobo direito de dimensões reduzidas e lobo caudado aumentado e globoso, associado a espessamento dos ligamentos hepáticos e ecotextura parenquimatosa difusamente grosseira e heterogênea. Relação dos diâmetros transversos do lobo caudado/lobo direito de {{*}} (VR ≤0,65).\nVeia porta de trajeto habitual apresentando calibre aumentado, medindo {{*}} cm (VR ≤1,3 cm), com fluxo hepatofugal.\nDilatação e tortuosidade de vasos periesofágicos, perigástricos, peri-hepáticos e periesplênicos, medindo até {{*}} cm.","hd":["Alterações sugestivas de hepatopatia crônica com hipertensão portal."]}]},{"id":"hepatopatia-nodulos","nome":"Cirrose + múltiplos nódulos","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de contornos serrilhados, bordas rombas, com lobo direito de dimensões reduzidas e lobo caudado aumentado e globoso, associado a espessamento dos ligamentos hepáticos. Parênquima de ecotextura grosseiramente heterogênea com múltiplos nódulos sólidos, esparsos, hipoecogênicos, de contornos parcialmente obscurecidos, medindo até {{*}} cm no segmento {{*}}. Lobo esquerdo mede {{*}} cm (VR ≤10,0 cm) e o lobo direito mede {{*}} cm (VR ≤15,0 cm).","hd":["Alterações sugestivas de hepatopatia parenquimatosa crônica com múltiplos nódulos hepáticos."]}]},{"id":"fibrose-periportal","nome":"Fibrose periportal / esquistossomose","substitui":["figado.morfologia","figado.parenquima","figado"],"apos":"figado","variantes":[{"texto":"Fígado de contornos discretamente serrilhados e dimensões reduzidas, associado a espessamento dos ligamentos hepáticos e aumento da refringência periportal.","hd":["Alterações sugestivas de hepatopatia parenquimatosa com sinais de fibrose periportal, que dentre os diferenciais, há possibilidade de corresponder à esquistossomose."]}]},{"id":"massa-hepatica","nome":"Massa hepática","substitui":["figado.morfologia","figado"],"apos":"figado","variantes":[{"texto":"Fígado com contorno lobulado e dimensões aumentadas, à custa de volumosa massa, sólida, de contornos irregulares, conteúdo heterogêneo, com calcificações de permeio, fluxo central e periférico ao estudo complementar com Doppler, ocupando os segmentos hepáticos {{*}}, medindo aproximadamente {{*}} cm. Placa hilar e ramos portais principais preservados.","hd":["Volumosa massa hepática. Conveniente prosseguir investigação diagnóstica, um estudo tomográfico poderá trazer maiores informações."]}]},{"id":"portograma-aereo","nome":"Portograma aéreo","substitui":[],"apos":"figado","variantes":[{"texto":"Formações lineares hiperrefringentes e produtoras de reverberações proeminentes do feixe acústico posterior, com distribuição que se estende até a periferia hepática acompanhando a tríade portal, sugestivo de portograma aéreo.","hd":["Achados ultrassonográficos sugestivos de portograma aéreo."]}]},{"id":"metastases","nome":"Nódulos hepáticos secundários / metástases","substitui":["figado.parenquima"],"apos":"figado","variantes":[{"texto":"Parênquima hepático homogêneo, com ecotextura e ecogenicidade preservadas, exceto por formações nodulares sólidas, com contornos bem definidos e arredondados, apresentando conteúdo hipoecogênico e com halo hipoecoico periférico, que determinam efeito de massa, deslocando as estruturas vasculares adjacentes, assim dispostos: - segmento {{*}}, medindo {{*}} cm; - segmento {{*}}, medindo {{*}} cm.","hd":["Múltiplos nódulos hepáticos, que dentre os diferenciais, há possibilidade de acometimento de natureza secundária, sendo conveniente prosseguir investigação diagnóstica."]}]},{"id":"tumor-de-klatskin","nome":"Tumor de Klatskin / colangiocarcinoma","substitui":["vias-biliares.intra"],"apos":"vias-biliares","variantes":[{"texto":"Vias biliares intra-hepáticas dilatadas, medindo até {{*}} cm à esquerda e {{*}} cm à direita (VR ≤0,25 cm), com aparente amputação ao nível da placa hilar.","hd":["Dilatação das vias biliares intra-hepáticas com sinais de amputação ao nível da placa hilar, que dentre os diferenciais, há possibilidade de corresponder a Tumor de Klatskin. Conveniente prosseguir investigação diagnóstica."]}]},{"id":"esteatose-leve","nome":"Esteatose leve","frequente":true,"substitui":["figado.parenquima"],"apos":"figado","variantes":[{"texto":"Parênquima hepático apresentando discreto aumento difuso e homogêneo da ecogenicidade. Tal achado não é específico, porém pode corresponder mais frequentemente a sinais de discreta deposição gordurosa hepática (esteatose).","hd":["Sinais de discreta deposição gordurosa hepática (esteatose)."]}]},{"id":"esteatose-moderada-acentuada","nome":"Esteatose moderada/acentuada","frequente":true,"substitui":["figado.parenquima"],"apos":"figado","variantes":[{"texto":"Parênquima hepático apresentando {{moderado|acentuado}} aumento difuso da ecogenicidade, com atenuação do feixe acústico posterior, o que limita a identificação de eventuais alterações parenquimatosas focais. Tal achado não é específico, porém pode corresponder mais frequentemente a sinais de {{moderada|acentuada}} deposição gordurosa hepática (esteatose).","hd":["Sinais de {{moderada|acentuada}} deposição gordurosa hepática (esteatose)."]}]}]},{"id":"pancreas","nome":"Pâncreas","achados":[{"id":"adenoma-microcistico","nome":"Adenoma microcístico","substitui":[],"apos":"pancreas","variantes":[{"texto":"Caracteriza-se formação nodular sólido-cística, apresentando pequenas formações císticas em seu interior, com margens mal definidas, localizada na transição do corpo com a cauda pancreática, medindo {{*}} x {{*}} cm. Ao estudo complementar com Doppler não foi observado vascularização significativa. Estes achados são de etiologia não específica pelo método, devendo-se considerar entre os diagnósticos diferenciais a possibilidade de adenoma microcístico.","hd":["Formação nodular na transição do corpo com cauda pancreática, de etiologia inespecífica pelo método, devendo se considerar entre os diagnósticos diferenciais adenoma microcístico. A critério clínico conveniente prosseguir investigação diagnóstica com ressonância magnética."]}]},{"id":"cisto-pancreatico","nome":"Cisto pancreático","substitui":["pancreas"],"apos":"pancreas","variantes":[{"texto":"Pâncreas visibilizado segmentos da cabeça e corpo, com dimensões normais, limites precisos e ecotextura típica, exceto por formação anecoica, de limites precisos e contornos regulares, com reforço acústico posterior, medindo {{*}} x {{*}} cm, localizado na {{cabeça|corpo}}.","hd":["Achados ultrassonográficos sugestivos de cisto pancreático."]}]},{"id":"dilatacao-wirsung","nome":"Dilatação do ducto pancreático principal","substitui":["pancreas"],"apos":"pancreas","variantes":[{"texto":"Os segmentos visibilizados do pâncreas são de topografia, dimensões e ecogenicidade habituais. Caracterizando dilatação do ducto pancreático principal (Wirsung), medindo {{*}} cm (VR Cabeça ≤ 0,3 cm / Corpo ≤ 0,21 cm / Cauda ≤ 0,16 cm) sem identificar o fator causal ao método. Caso haja indicação clínica, prosseguir investigação com TC/RM.","hd":["Dilatação do ducto pancreático, sem identificar o fator causal ao método."]}]},{"id":"pancreatite-aguda","nome":"Pancreatite aguda","substitui":["pancreas"],"apos":"pancreas","variantes":[{"texto":"Pâncreas de contornos irregulares e parcialmente obscurecidos, com hipoecogenicidade textural difusa e dimensões aumentadas, medindo a cabeça {{*}} cm (VR ≤3,0 cm), corpo {{*}} cm (VR ≤2,0 cm) e cauda {{*}} cm (VR ≤1,5 cm). Ducto de Wirsung de calibre preservado.","hd":["Alterações parenquimatosas pancreáticas sugestivas de processo inflamatório agudo (pancreatite)."]}]},{"id":"pancreatopatia-cronica","nome":"Pancreatopatia crônica","substitui":["pancreas"],"apos":"pancreas","variantes":[{"texto":"Pâncreas de dimensões normais, com contornos lobulados e focos irregulares de calcificações, medindo até {{*}} cm, localizadas nas regiões da cabeça e corpo. Ducto de Wirsung ectasiado, com calibre de {{*}} cm (VR Cabeça ≤ 0,3 cm / Corpo ≤ 0,21 cm / Cauda ≤ 0,16 cm) e aspecto levemente tortuoso.","hd":["Alterações sugestivas de pancreatopatia crônica."]}]},{"id":"pancreas-gorduroso","nome":"Pâncreas gorduroso / lipossubstituído","substitui":["pancreas"],"apos":"pancreas","variantes":[{"texto":"Pâncreas de morfologia, contornos e dimensões normais, com aumento difuso de sua ecogenicidade, sugerindo infiltração gordurosa.","hd":["Alterações sugestivas de infiltração gordurosa pancreática (senilidade? diabetes?)."]}]},{"id":"tumor-cabeca-pancreas","nome":"Tumor de cabeça de pâncreas","substitui":["vias-biliares.intra","vias-biliares.coledoco","vias-biliares","pancreas","vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vias-biliares","variantes":[{"texto":"Vias biliares intra-hepáticas de calibres aumentados, medindo {{*}} cm à esquerda e {{*}} cm à direita (VR ≤0,25 cm).\nHepatocolédoco de calibre aumentado, medindo {{*}} cm (VR ≤ 0,6 cm), notando-se a cerca de {{*}} cm da porta hepatis afilamento gradual, assumindo aspecto em \"bico de pássaro\", à medida que se relaciona com uma massa sólida, hipoecogênica, localizada na topografia da cabeça pancreática, de contornos regulares e parcialmente obscurecidos, heterogênea, com fluxo periférico ao estudo complementar com Doppler, medindo {{*}} cm (AP x LL x CC). Ducto de Wirsung de calibre aumentado, medindo {{*}} cm (VR Cabeça ≤ 0,3 cm / Corpo ≤ 0,21 cm / Cauda ≤ 0,16 cm).\nVesícula biliar hiperdistendida, medindo {{*}} cm, com paredes finas e lisas. O conteúdo vesicular apresenta-se anecoide, sem cálculos no interior. Sinal de Murphy ultrassonográfico negativo.","hd":["Massa sólida na topografia da cabeça pancreática, determinando dilatação das vias biliares intra e extra-hepáticas, sendo conveniente prosseguir investigação diagnóstica."]}]},{"id":"pancreas-parcial","nome":"Pâncreas parcialmente visibilizado","frequente":true,"substitui":["pancreas","aorta"],"apos":"pancreas","variantes":[{"texto":"Cabeça e corpo pancreático de morfologia, contornos, dimensões e ecotextura habituais. Restante do pâncreas e demais estruturas do retroperitônio não visualizados devido à sobreposição gasosa de alças intestinais.","hd":[]}]}]},{"id":"retroperitoneo","nome":"Retroperitônio","achados":[{"id":"ateromatose-aortica","nome":"Ateromatose aórtica","substitui":["aorta"],"apos":"aorta","variantes":[{"nome":"Placas calcificadas esparsas","texto":"Aorta com trajeto e calibre habituais. Caracterizando pequenas placas ateromatosas calcificadas esparsas.","hd":["Ateromatose aórtica."]},{"nome":"Placas em todo o trajeto","texto":"Aorta de calibre habitual e paredes irregulares, apresentando placas hiperecogênicas em todo o seu trajeto, sem evidências de obstrução luminal, com pulsatilidade diminuída.","hd":["Ateromatose aórtica."]},{"nome":"Formações aderidas às paredes","texto":"Aorta abdominal apresentando formações hiperecogênicas aderidas às suas paredes, sugerindo alterações ateromatosas.","hd":["Ateromatose aórtica."]}]},{"id":"aneurisma-aorta","nome":"Aneurisma de aorta abdominal","substitui":["aorta"],"apos":"aorta","variantes":[{"texto":"Aorta abdominal pérvia, com calcificações parietais ateromatosas {{leves|grosseiras}} associado à dilatação aneurismática {{fusiforme|sacular}} em seu segmento {{supra|infra}}-renal, distando {{*}} cm da emergência das artérias renais, medindo {{*}} cm (AP x T) e extensão de {{*}} cm, com trombos murais semicircunferenciais laminares, que determinam redução da luz efetiva em cerca de {{*}} %, com fluxo turbilhonado ao estudo complementar com Doppler. O colo proximal do aneurisma tem calibre transverso de {{*}} cm.\nDiâmetros aórticos:\n- Transição toracoabdominal: {{*}} cm (VR ≤2,5 cm);\n- Nível da artéria mesentérica superior: {{*}} cm (VR ≤2,5 cm);\n- Nível da bifurcação das ilíacas: {{*}} cm (VR ≤3,0 cm);\n- Artérias ilíacas comuns apresentam-se pérvias, com calibre e contornos normais, medindo até {{*}} cm à direita e {{*}} cm à esquerda.","hd":["Achados ultrassonográficos compatíveis com dilatação aneurismática da aorta abdominal."]}]},{"id":"endoprotese-aorto-biiliaca","nome":"Endoprótese aorto-biilíaca","substitui":["aorta"],"apos":"aorta","variantes":[{"texto":"Presença de endoprótese aorto bi-ilíaca.","hd":["Endoprótese aorto bi-ilíaca."]}]},{"id":"linfonodomegalia","nome":"Linfonodomegalia","substitui":["linfonodos"],"apos":"linfonodos","variantes":[{"texto":"Linfonodomegalias de contornos bem definidos, hiperecogênicas, com perda da relação córtico-hilar, algumas confluentes, {{sem|com}} sinais de degeneração cístico-necrótica, medindo até {{*}} cm na cadeia {{*}}.","hd":["Achados ultrassonográficos que favorecem a possibilidade de doença linfoproliferativa, conveniente prosseguir investigação diagnóstica."]}],"frequente":true}]},{"id":"vesicula-biliar","nome":"Vesícula biliar","achados":[{"id":"adenomiomatose-colesterolose","nome":"Adenomiomatose + colesterolose","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar normodistendida, com paredes difusamente espessas e irregulares, medindo até {{*}} cm (VR ≤0,3 cm), associado a áreas hipoecogênicas de invaginação intraparietal da mucosa para a camada muscular vesicular (seios de Rokitansky-Aschoff), podendo corresponder a adenomiomatose. Observa-se ainda pequenos focos hiperecogênicos de artefatos em \"cauda de cometa\", medindo até 0,2 cm, podendo corresponder a colesterolose. O conteúdo vesicular apresenta-se anecoide, sem cálculos no interior. Sinal de Murphy ultrassonográfico negativo.","hd":["Achados sugestivos de adenomiomatose associado à colesterolose da vesícula biliar."]}]},{"id":"barro-biliar","nome":"Barro / lama biliar","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar normodistendida, com paredes finas e lisas, apresentando conteúdo hipoecogênico com formação de nível líquido-líquido, correspondendo a barro biliar. Sinal de Murphy ultrassonográfico negativo.","hd":["Alterações sugestivas de barro/lama biliar."]}],"frequente":true},{"id":"barrete-frigio","nome":"Barrete frígio","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar normodistendida, com paredes finas e lisas, conteúdo anecoide, apresentando uma dobra na transição do terço {{médio|distal}}, assumindo aspecto em \"barrete frígio\" (variante anatômica).","hd":[]}]},{"id":"colecistectomia","nome":"Colecistectomia","frequente":true,"substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"nome":"Sem dilatação das vias biliares","texto":"Vesícula biliar não caracterizada (status pós-operatório).","hd":["Colecistectomia."]},{"nome":"Com discreta dilatação das vias biliares","texto":"Vesícula biliar não caracterizada (status pós-operatório).\nNota-se discreta dilatação das vias biliares intra e extra-hepáticas, habitualmente observada em pacientes colecistectomizados.","hd":["Colecistectomia."]}]},{"id":"colelitiase","nome":"Colelitíase","frequente":true,"substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"nome":"Múltiplos/alguns cálculos","texto":"Vesícula biliar normodistendida, com paredes finas e lisas, apresentando conteúdo anecoide com {{múltiplas|algumas}} formações nodulares, hiperecogênicas, providas de sombra acústica posterior, móveis à mudança de decúbito, que medem entre {{*}} e {{*}} cm, correspondendo a cálculos. Sinal de Murphy ultrassonográfico negativo.","hd":["Alterações sugestivas de colecistopatia calculosa."]},{"nome":"Cálculo único","texto":"Vesícula biliar normodistendida e com paredes finas e lisas, apresentando no seu interior formação nodular, hiperecogênica, produtora de sombra acústica posterior, móvel à mudança de decúbito, compatível com cálculo, medindo cerca de {{*}} cm.","hd":["Alterações sugestivas de colecistopatia calculosa."]}]},{"id":"colelitiase-barro","nome":"Colelitíase + barro biliar","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar normodistendida, de paredes finas e lisas, apresentando conteúdo hipoecogênico com formação de nível líquido-líquido, correspondendo a barro biliar, associado a formações nodulares, hiperecogênicas, providas de sombras acústicas posteriores, que medem entre {{*}} e {{*}} cm, correspondendo a cálculos. Sinal de Murphy ultrassonográfico negativo.","hd":["Alterações sugestivas de colecistopatia calculosa associado a barro/lama biliar."]}]},{"id":"vesicula-escleroatrofica","nome":"Colelitíase + vesícula escleroatrófica","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar hipodistendida, de paredes aparentemente finas, com seu interior ocupado por formação hiperecogênica, provida de sombra acústica posterior, medindo aproximadamente {{*}} cm, podendo corresponder a {{cálculo|microcálculo}}. Sinal de Murphy ultrassonográfico negativo.","hd":["Alterações sugestivas de vesícula escleroatrófica e colecistopatia calculosa."]}]},{"id":"coledocolitiase","nome":"Colelitíase + coledocolitíase","substitui":["vias-biliares.intra","vias-biliares.coledoco","vias-biliares","vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vias-biliares","variantes":[{"texto":"Vias biliares intra-hepáticas levemente dilatadas, medindo {{*}} cm à esquerda e {{*}} cm à direita (VR ≤0,25 cm). Caracteriza-se formação nodular, hiperecogênica no interior do hepatocolédoco, medindo {{*}} cm, distando {{*}} cm da porta hepatis, correspondendo a cálculo impactado, determinando dilatação a montante, com hepatocolédoco medindo {{*}} cm de calibre.\nVesícula biliar hiperdistendida, medindo {{*}} cm, com paredes finas e lisas, apresentando conteúdo anecoide com múltiplas pequenas formações nodulares, hiperecogênicas, produtoras de sombra acústica posterior, que medem entre {{*}} e {{*}} cm, correspondendo a {{cálculos|microcálculos}}. Sinal de Murphy ultrassonográfico positivo.","hd":["Alterações sugestivas de colecistopatia calculosa e coledocolitíase, associado a dilatação das vias intra e extra-hepáticas."]}]},{"id":"complexo-parede-eco-sombra","nome":"Colelitíase – complexo parede-eco-sombra","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar apresentando fino halo hipoecoico entre a sua parede anterior e a hiperrefringência interna, caracterizando a formação do complexo \"parede-eco-sombra\", podendo estar relacionado a cálculo vultoso e/ou repleção por cálculos, no qual limita a adequada avaliação da sua parede posterior.","hd":["Achados sugestivos de colecistopatia calculosa."]}]},{"id":"colelitiase-ou-porcelana","nome":"Colelitíase ou vesícula em porcelana","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"No leito da vesícula biliar caracteriza-se área hiperrefringente, associado à extensa sombra acústica posterior, no qual limita a adequada avaliação do seu conteúdo e da parede posterior, podendo estar relacionado a cálculo vultoso, repleção por cálculos e/ou vesícula em porcelana.","hd":["Achados sugestivos de colecistopatia calculosa e/ou vesícula em porcelana."]}]},{"id":"colecistite-inicial","nome":"Colecistite litiásica inicial","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar discretamente hiperdistendida, medindo {{*}} cm (VR ≤10,0 x 4,0 cm), com paredes de espessura limítrofe, medindo 0,4 cm (VR ≤0,3 cm), apresentando conteúdo anecoide com {{múltiplas|algumas}} formações nodulares, hiperecogênicas, providas de sombra acústica posterior, que medem entre {{*}} e {{*}} cm, correspondendo a cálculos. Sinal de Murphy ultrassonográfico positivo.","hd":["Achados sugestivos de colecistite em estágio inicial na dependência de estreita correlação clínico-laboratorial."]}]},{"id":"colecistite","nome":"Colecistite litiásica","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar hiperdistendida, medindo {{*}} cm (VR ≤10,0 x 4,0 cm), com paredes espessadas e delaminadas, com halo anecoide de edema, medindo {{*}} cm (VR ≤0,3 cm), apresentando conteúdo hipoecogênico com formação de nível líquido-líquido, correspondendo a barro biliar, associado a {{múltiplos|alguns}} cálculos providos de sombra acústica posterior, sem significativa mobilidade às mudanças de decúbito, que medem entre {{*}} e {{*}} cm. Sinal de Murphy ultrassonográfico positivo.","hd":["Achados sugestivos de colecistite aguda."]}]},{"id":"colesterolose","nome":"Colesterolose","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar normodistendida, de paredes finas com pequenos focos hiperecogênicos de artefatos em \"cauda de cometa\", medindo até 0,2 cm, podendo corresponder à colesterolose. O conteúdo vesicular apresenta-se anecoide sem cálculos no interior.","hd":["Achados sugestivos de colesterolose da vesícula biliar."]}]},{"id":"discinesia-biliar","nome":"Discinesia biliar","substitui":[],"apos":"vesicula","variantes":[{"texto":"Realizado estudo ultrassonográfico de controle após 30 e 60 minutos da ingesta de alimento colecistocinético, caracterizando discreta redução do volume da vesícula biliar (VR >50%) em relação ao volume pré-prandial, sugerindo discinesia biliar.","hd":["Achados sugestivos de discinesia biliar."]}]},{"id":"espessamento-ascite","nome":"Espessamento reacional por ascite","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"A vesícula biliar apresenta espessamento das suas paredes, medindo {{*}} cm (VR ≤0,3 cm), conteúdo anecoide e homogêneo, achado que pode estar relacionado ao quadro de {{ascite|edema}}, na dependência de correlação com dados clínicos.","hd":["Espessamento parietal vesicular, podendo estar relacionado ao quadro de {{ascite|edema}}."]}]},{"id":"sindrome-de-mirizzi","nome":"Síndrome de Mirizzi","substitui":["vias-biliares.intra","vias-biliares.coledoco","vias-biliares","vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vias-biliares","variantes":[{"texto":"Vesícula biliar normodistendida com paredes finas e lisas, apresentando no seu interior múltiplas formações nodulares, hiperecogênicas, produtoras de sombras acústicas posteriores, algumas móveis à mudança de decúbito, e outra impactada na região infundibular, esta última medindo aproximadamente {{*}} cm, determinando aparente compressão extrínseca da via biliar extra-hepática, que mede até {{*}} cm (VR ≤0,6 cm), associado a {{discreta|moderada|acentuada}} dilatação das vias biliares intra-hepáticas. O conjunto de achados favorecem a possibilidade de Síndrome de Mirizzi dentre os diferenciais. A critério clínico um estudo por ColangioRM, poderá fornecer informações adicionais.","hd":["Colecistopatia calculosa, associado a achados que favorecem a possibilidade de Síndrome de Mirizzi dentre os diferenciais. A critério clínico um estudo por ColangioRM, poderá fornecer informações adicionais."]}]},{"id":"polipo-vesicular","nome":"Pólipo vesicular","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar normodistendida e com paredes finas, apresentando na região fúndica formação nodular sólida, hiperecogênica, de aspecto polipoide, medindo {{*}} cm e contornos regulares, imóvel à mudança de decúbito, com pedículo vascularizado ao estudo complementar com Doppler. O conteúdo vesicular apresenta-se anecoide, sem cálculos no interior.","hd":["Formação nodular intravesicular, sugestiva de pólipo vesicular."]}],"frequente":true},{"id":"vesicula-porcelana","nome":"Vesícula em porcelana","substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar apresentando hiperrefringência difusa e linear da sua parede anterior, não sendo caracterizado o complexo \"parede-eco-sombra\", associado à extensa sombra acústica posterior, no qual limita a adequada avaliação do seu conteúdo e da parede posterior.","hd":["Achados ultrassonográficos sugestivos de vesícula em porcelana."]}]},{"id":"vesicula-hipodistendida","nome":"Vesícula hipodistendida","frequente":true,"substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar hipodistendida, limitando a adequada avaliação ecográfica das suas paredes. Apresenta conteúdo anecoide, aparentemente sem cálculos.","hd":[]}]},{"id":"vesicula-nao-caracterizada","nome":"Vesícula não caracterizada","frequente":true,"substitui":["vesicula.paredes","vesicula.conteudo","vesicula"],"apos":"vesicula","variantes":[{"texto":"Vesícula biliar não caracterizada (vazia? Interposição gasosa?).","hd":[]}]}]},{"id":"fast","nome":"FAST","mascaras":["ab
